            { id: "26/45", type: "Waldpflanze", title: "Straußfarn", latin: "Matteuccia struthiopteris (Rippenfarngewächse)", v1: "Wächst an feuchten Bachufern und in Auwäldern, bildet trichterförmige Blattschöpfe.", v2: "Große, fein gefiederte, hellgrüne Wedel, die trichterförmig um einen zentralen Vegetationspunkt stehen.", v3: "Die eingerollten jungen Triebe ('Fiddleheads') gelten in Nordamerika als Delikatesse.", wiki: "https://de.wikipedia.org/wiki/Stra%C3%9Ffarn" },
            { id: "27/45", type: "Waldpflanze", title: "Gewöhnlicher Wurmfarn", latin: "Dryopteris filix-mas (Wurmfarngewächse)", v1: "Einer der häufigsten heimischen Farne in schattigen Laub- und Nadelwäldern.", v2: "Große, doppelt gefiederte, trichterförmig angeordnete Wedel.", v3: "Der Wurzelstock wurde historisch als Bandwurmmittel genutzt – daher der deutsche Name.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnlicher_Wurmfarn" },
            { id: "28/45", type: "Waldpflanze", title: "Frauenfarn", latin: "Athyrium filix-femina (Frauenfarngewächse)", v1: "Wächst in feuchten, schattigen Wäldern und an Bachufern.", v2: "Zarte, hellgrüne, doppelt bis dreifach gefiederte Wedel, filigraner als der Wurmfarn.", v3: "Der Name rührt von der zarten, 'weiblichen' Erscheinung im Vergleich zum kräftigeren Wurmfarn.", wiki: "https://de.wikipedia.org/wiki/Wald-Frauenfarn" },
            { id: "29/45", type: "Selten / Geschützt", title: "Hirschzunge", latin: "Asplenium scolopendrium (Streifenfarngewächse)", v1: "Wächst selten in schattigen, luftfeuchten Schluchtwäldern und an feuchten Felsen.", v2: "Ungeteilte, ledrige, riemenförmige Wedel, völlig anders als die meisten gefiederten Farne.", v3: "Der ungewöhnliche, ungeteilte Wedel machte sie schon früh zu einer beliebten Zierpflanze.", wiki: "https://de.wikipedia.org/wiki/Hirschzunge_(Farn)" },
            { id: "30/45", type: "Waldpflanze", title: "Wald-Simse", latin: "Scirpus sylvaticus (Sauergräser)", v1: "Wächst an feuchten Waldrändern, Gräben und in Erlenbrüchen.", v2: "Breite, grasartige Blätter und lockere, doldenartige, grünliche Blütenstände.", v3: "Ein zuverlässiger Zeiger feuchter, nährstoffreicher Waldstandorte.", wiki: "https://de.wikipedia.org/wiki/Wald-Simse" },
            { id: "31/45", type: "Waldgras", title: "Wald-Schwingel", latin: "Festuca altissima (Süßgräser)", v1: "Wächst in schattigen, luftfeuchten Laub- und Schluchtwäldern.", v2: "Breite, weiche, hellgrüne Blätter und lockere, überhängende Rispen.", v3: "Ein typisches Gras alter, naturnaher Buchen- und Schluchtwälder.", wiki: "https://de.wikipedia.org/wiki/Wald-Schwingel" },
            { id: "32/45", type: "Waldpflanze", title: "Breitblättriger Rippenfarn", latin: "Blechnum spicant (Rippenfarngewächse)", v1: "Wächst auf sauren Böden in Nadel- und Mischwäldern sowie auf Heideflächen.", v2: "Zwei verschiedene Wedeltypen: flach ausgebreitete, sterile Wedel und aufrechte, schmalere Sporenwedel.", v3: "Ein typischer Zeigerfarn für saure, nährstoffarme Waldböden.", wiki: "https://de.wikipedia.org/wiki/Rippenfarn" },
            { id: "33/45", type: "Waldgras", title: "Nickendes Perlgras", latin: "Melica nutans (Süßgräser)", v1: "Wächst in trockenen bis frischen Laub- und Mischwäldern, oft auf kalkreichen Böden.", v2: "Schmale Blätter und einseitswendige, überhängende Ährchen, die perlenartig aufgereiht wirken.", v3: "Eines der zierlichsten heimischen Waldgräser, oft in lichten Buchenwäldern zu finden.", wiki: "https://de.wikipedia.org/wiki/Nickendes_Perlgras" },
            { id: "34/45", type: "Waldpflanze", title: "Haselwurz", latin: "Asarum europaeum (Osterluzeigewächse)", v1: "Wächst als immergrüner Bodendecker in schattigen, nährstoffreichen Laubwäldern.", v2: "Glänzend dunkelgrüne, nierenförmige Blätter und unscheinbare, glockenförmige braunrote Blüten direkt am Boden.", v3: "Die Blüten werden bodennah von Ameisen und kriechenden Insekten bestäubt.", wiki: "https://de.wikipedia.org/wiki/Haselwurz" },
            { id: "35/45", type: "Waldpflanze", title: "Wald-Wachtelweizen", latin: "Melampyrum pratense (Sommerwurzgewächse)", v1: "Wächst als Halbschmarotzer in sauren Nadel- und Laubwäldern.", v2: "Gegenständige, schmale Blätter und gelblich-weiße Lippenblüten in den oberen Blattachseln.", v3: "Die Samen tragen ölhaltige Anhängsel und werden von Ameisen im Wald verbreitet.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Wachtelweizen" },
            { id: "36/45", type: "Waldpflanze / Heilkraut", title: "Sanikel", latin: "Sanicula europaea (Doldenblütler)", v1: "Wächst in schattigen, kalkreichen Laubwäldern, oft in Buchenwäldern.", v2: "Handförmig geteilte, glänzende Grundblätter und kleine, weißliche Blütenköpfchen mit hakigen Früchten.", v3: "Wurde traditionell als Wundkraut zur Blutstillung und Wundheilung genutzt.", wiki: "https://de.wikipedia.org/wiki/Sanikel" },
            { id: "37/45", type: "Geschützt", title: "Keulen-Bärlapp", latin: "Lycopodium clavatum (Bärlappgewächse)", v1: "Wächst kriechend am Boden lichter Nadelwälder und Heideflächen.", v2: "Kriechende, dicht mit nadelartigen Blättchen besetzte Triebe und aufrechte, keulenartige Sporenähren.", v3: "Ein lebendes Relikt urzeitlicher Bärlapppflanzen, die einst riesige Wälder bildeten.", wiki: "https://de.wikipedia.org/wiki/Keulen-B%C3%A4rlapp" },
            { id: "38/45", type: "Streng Geschützt", title: "Tannenbärlapp", latin: "Huperzia selago (Bärlappgewächse)", v1: "Wächst selten in feuchten, moosreichen Nadelwäldern und auf Bergwiesen.", v2: "Aufrechte, tannenartig verzweigte, dicht beblätterte Triebe ohne deutlich abgesetzte Sporenähren.", v3: "Enthält giftige Alkaloide und steht wegen seiner Seltenheit unter strengem Schutz.", wiki: "https://de.wikipedia.org/wiki/Tannen-B%C3%A4rlapp" },
            { id: "39/45", type: "Waldpflanze / Giftig", title: "Gewöhnliche Waldrebe (Wald)", latin: "Clematis vitalba (Hahnenfußgewächse)", v1: "Rankt kletternd an Waldrändern, Hecken und Zäunen, im Herbst an den silbrig-federigen Fruchtständen erkennbar.", v2: "Gefiederte Blätter und cremeweiße, duftende Blütenrispen im Sommer.", v3: "Der Pflanzensaft reizt Haut und Schleimhäute stark – im Volksmund auch 'Teufelszwirn' genannt.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliche_Waldrebe" },
            { id: "40/45", type: "Streng Geschützt", title: "Türkenbund-Lilie (Wald)", latin: "Lilium martagon (Liliengewächse)", v1: "Wächst in halbschattigen Laubwäldern auf kalkreichen Böden.", v2: "Auffällige, turbanartig zurückgeschlagene, weinrote Blütenblätter mit dunklen Punkten.", v3: "Wird nachts von Schwärmern bestäubt und steht unter strengem Naturschutz.", wiki: "https://de.wikipedia.org/wiki/T%C3%BCrkenbund-Lilie" },
            { id: "41/45", type: "Streng Geschützt", title: "Frauenschuh (Wald)", latin: "Cypripedium calceolus (Orchideen)", v1: "Eine der prächtigsten und seltensten wilden Orchideenarten Deutschlands, wächst in lichten Kalkbuchenwäldern.", v2: "Die Blüte besitzt eine große, gelbe Lippe, die wie ein Pantoffel geformt ist, umgeben von braunroten Blütenblättern.", v3: "Pflücken und Ausgraben stehen unter hoher Strafe – ein Symbol des heimischen Naturschutzes.", wiki: "https://de.wikipedia.org/wiki/Gelber_Frauenschuh" },
            { id: "42/45", type: "Waldpflanze", title: "Wald-Veilchen (Wald)", latin: "Viola reichenbachiana (Veilchengewächse)", v1: "Wächst in lichten Laub- und Mischwäldern, blüht oft schon etwas früher als das Hain-Veilchen.", v2: "Herzförmige Blätter und schmale, hellviolette Blüten mit einem dunkelvioletten, geraden Sporn.", v3: "Eine der häufigsten Waldveilchenarten Mitteleuropas.", wiki: "https://de.wikipedia.org/wiki/Wald-Veilchen" },
            { id: "43/45", type: "Waldpflanze / Giftig", title: "Buschwindröschen (Wald)", latin: "Anemone nemorosa (Hahnenfußgewächse)", v1: "Bildet im März bis Mai dichte, weiße Blütenteppiche in Laubwäldern, bevor die Bäume austreiben.", v2: "Eine einzige weiße Blüte pro Stängel mit meist 6 bis 8 Blütenblättern und tief dreiteiligen Stängelblättern.", v3: "Eine der bekanntesten Charakterarten des zeitigen Laubwald-Frühlings – frisch giftig durch Protoanemonin.", wiki: "https://de.wikipedia.org/wiki/Buschwind%C3%B6schen" },
            { id: "44/45", type: "Waldpflanze / Essbar", title: "Wald-Erdbeere (Wald)", latin: "Fragaria vesca (Rosengewächse)", v1: "Wächst an lichten Waldrändern, Böschungen und Lichtungen, blüht weiß von April bis Juni.", v2: "Dreizählige, gezähnte Blätter und kleine weiße Blüten, gefolgt von den winzigen, intensiv süß-aromatischen Früchten.", v3: "Gilt als eine der aromatischsten heimischen Wildfrüchte – deutlich süßer als jede Kultursorte.", wiki: "https://de.wikipedia.org/wiki/Wald-Erdbeere" },
            { id: "45/45", type: "Waldpflanze / Giftig", title: "Efeu (Wald)", latin: "Hedera helix (Efeugewächse)", v1: "Rankt kletternd an Bäumen, Mauern und am Waldboden, bleibt auch im Winter grün.", v2: "Junge Blätter sind gelappt, ältere Blätter an blühenden Trieben oval-rautenförmig; im Herbst erscheinen kugelige Blütendolden.", v3: "Ein wichtiger Winterlebensraum für Vögel und Insekten – die Beeren sind für Menschen giftig.", wiki: "https://de.wikipedia.org/wiki/Efeu" }
        ],
        selten: [
            { id: "01/45", type: "Streng Geschützt", title: "Frauenschuh", latin: "Cypripedium calceolus (Orchideen)", v1: "Eine der prächtigsten und seltensten wilden Orchideenarten Deutschlands.", v2: "Die Blüte besitzt eine große, gelbe Lippe, die wie ein Pantoffel geformt ist.", v3: "Wächst in lichten Kalkbuchenwäldern. Pflücken und Ausgraben steht unter hoher Strafe.", wiki: "https://de.wikipedia.org/wiki/Gelber_Frauenschuh" },
            { id: "02/45", type: "Rote Liste", title: "Frühlings-Adonisröschen", latin: "Adonis vernalis (Hahnenfußgewächse)", v1: "Wächst extrem selten auf sonnigen Trockenrasen und Steppenheiden.", v2: "Fein geschlitzte, fenchelartige Blätter und riesige, zitronengelbe Blüten.", v3: "Streng geschützt und stark giftig (herzwirksam). Benannt nach dem schönen Adonis.", wiki: "https://de.wikipedia.org/wiki/Fr%C3%BChlings-Adonisr%C3%B6schen" },
            { id: "03/45", type: "Streng Geschützt", title: "Küchenschelle (Pulsatilla)", latin: "Pulsatilla vulgaris (Hahnenfußgewächse)", v1: "Liebt kalkreiche, sonnige Mager- und Trockenrasen im zeitigen Frühjahr.", v2: "Glockenförmige, tiefviolette Blüten, die außen seidig-weiß behaart sind.", v3: "Sehr giftig. Die Samen tragen lange, fedrige Haarschweife zur Windausbreitung.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliche_Kuhschelle" },
            { id: "04/45", type: "Rote Liste", title: "Echte Schlüsselblume", latin: "Primula veris (Primelgewächse)", v1: "Wächst auf trockenen, kalkreichen Wiesen und lichten Laubwäldern.", v2: "Dottergelbe Blüten mit fünf orangefarbenen Flecken im Schlund.", v3: "In freier Natur streng geschützt. Wirkt stark schleimlösend bei Husten.", wiki: "https://de.wikipedia.org/wiki/Echte_Schl%C3%BCsselblume" },
            { id: "05/45", type: "Rote Liste", title: "Sonnentau", latin: "Drosera rotundifolia (Sonnentaugewächse)", v1: "Eine seltene, fleischfressende Pflanze in nährstoffarmen Hochmooren.", v2: "Blätter mit roten Tentakeln, die klebrige Sekrettropfen ausscheiden.", v3: "Fängt winzige Insekten, um den Stickstoffmangel des Moorbodens auszugleichen.", wiki: "https://de.wikipedia.org/wiki/Rundbl%C3%A4ttriger_Sonnentau" },
            { id: "06/45", type: "Streng Geschützt", title: "Türkenbund-Lilie", latin: "Lilium martagon (Liliengewächse)", v1: "Wächst in halbschattigen Laubwäldern auf kalkreichen Böden.", v2: "Auffällige, trunderartig zurückgeschlagene, weinrote Blütenblätter mit Punkten.", v3: "Wird nachts von Schwärmern bestäubt. Streng geschützt.", wiki: "https://de.wikipedia.org/wiki/Türkenbund-Lilie" },
            { id: "07/45", type: "Streng Geschützt", title: "Schachblume", latin: "Fritillaria meleagris (Liliengewächse)", v1: "Wächst extrem selten auf feuchten, periodisch überschwemmten Wiesen.", v2: "Glockenblüten mit einem außergewöhnlichen rot-weiß schachbrettartigen Muster.", v3: "Der Bestand schrumpft durch die Entwässerung von Feuchtwiesen dramatisch.", wiki: "https://de.wikipedia.org/wiki/Schachblume" },
            { id: "08/45", type: "Streng Geschützt", title: "Feuer-Lilie", latin: "Lilium bulbiferum (Liliengewächse)", v1: "Liebt sonnige, felsige Berghänge und magere Wiesen.", v2: "Leuchtend feuerrote, aufrecht stehende Blüten ohne Duft.", v3: "Bildet kleine Brutknospen (Bulben) in den Blattachseln zur Vermehrung.", wiki: "https://de.wikipedia.org/wiki/Feuer-Lilie" },
            { id: "09/45", type: "Rote Liste", title: "Gemeines Fettkraut", latin: "Pinguicula vulgaris (Fettkrautgewächse)", v1: "Eine fleischfressende Pflanze feuchter, nährstoffarmer Moore und Quellfluren.", v2: "Rosette aus fettig-glänzenden Blättern und eine violettte Einzelblüte.", v3: "Insekten bleiben auf den klebrigen Blättern haften und werden verdaut.", wiki: "https://de.wikipedia.org/wiki/Gemeines_Fettkraut" },
            { id: "10/45", type: "Seltene Moorart", title: "Sumpfporst", latin: "Rhododendron tomentosum (Heidekrautgewächse)", v1: "Wächst in torfreichen, sauren Kiefernmoorwäldern Norddeutschlands.", v2: "Immergrüner Strauch mit zimtbraun behaarter Blattunterseite und weißen Blüten.", v3: "Riecht stark harzig-aromatisch. Der Duft wirkt betäubend und vertreibt Insekten.", wiki: "https://de.wikipedia.org/wiki/Sumpfporst" },
            { id: "11/45", type: "Rote Liste", title: "Wiesen-Schwertlilie", latin: "Iris sibirica (Schwertliliengewächse)", v1: "Besiedelt sehr selten gewordene, nasse Streuwiesen und Flachmoore.", v2: "Schwertförmige Blätter und prächtige, blauviolett gemusterte Blüten.", v3: "Steht unter strengstem Naturschutz, da ihr Lebensraum fast völlig zerstört wurde.", wiki: "https://de.wikipedia.org/wiki/Sibirische_Schwertlilie" },
            { id: "12/45", type: "Streng Geschützt", title: "Bienen-Ragwurz", latin: "Ophrys apifera (Orchideen)", v1: "Wächst sehr selten auf kalkreichen Trockenrasen und in lichten Gebüschen, meist einzeln oder in kleinen Gruppen.", v2: "Die Blütenlippe ahmt täuschend echt eine pelzige Biene nach, um männliche Bienen zur Scheinpaarung anzulocken.", v3: "In Deutschland meist selbstbestäubend, da passende Bestäuberinsekten hier fehlen – ein faszinierendes Überlebensbeispiel.", wiki: "https://de.wikipedia.org/wiki/Bienen-Ragwurz" },
            { id: "13/45", type: "Streng Geschützt", title: "Fliegen-Ragwurz", latin: "Ophrys insectifera (Orchideen)", v1: "Wächst sehr selten auf mageren Kalkmagerrasen und in lichten Kiefernwäldern.", v2: "Die schmale, dunkle Blütenlippe mit blau schimmerndem Fleck ahmt eine Grabwespe nach.", v3: "Lockt männliche Grabwespen zur Scheinpaarung und wird so gezielt bestäubt.", wiki: "https://de.wikipedia.org/wiki/Fliegen-Ragwurz" },
            { id: "14/45", type: "Streng Geschützt", title: "Helm-Knabenkraut", latin: "Orchis militaris (Orchideen)", v1: "Wächst selten auf kalkreichen Magerrasen und lichten Gebüschen.", v2: "Helmartig zusammenneigende, graurosa Blütenhüllblätter und eine tief eingeschnittene, gepunktete Lippe.", v3: "Der Name rührt von der helmartigen Form der oberen Blütenblätter her.", wiki: "https://de.wikipedia.org/wiki/Helm-Knabenkraut" },
            { id: "15/45", type: "Streng Geschützt", title: "Purpur-Knabenkraut", latin: "Orchis purpurea (Orchideen)", v1: "Wächst selten in lichten Laubwäldern und auf Kalkmagerrasen, oft an warmen Südhängen.", v2: "Dunkelpurpurne, helmartige obere Blütenblätter und eine große, hellere, gepunktete Lippe.", v3: "Eine der größten und prächtigsten heimischen Orchideenarten.", wiki: "https://de.wikipedia.org/wiki/Purpur-Knabenkraut" },
            { id: "16/45", type: "Streng Geschützt", title: "Kleines Knabenkraut", latin: "Anacamptis morio (Orchideen)", v1: "Wächst extrem selten geworden auf mageren, ungedüngten Wiesen und Weiden.", v2: "Kleine, purpurviolette Blüten mit deutlich geaderten, helmartigen Kelchblättern.", v3: "Durch Wiesendüngung und Nutzungsaufgabe eine der am stärksten zurückgehenden Orchideenarten Mitteleuropas.", wiki: "https://de.wikipedia.org/wiki/Kleines_Knabenkraut" },
            { id: "17/45", type: "Streng Geschützt", title: "Brand-Knabenkraut", latin: "Neotinea ustulata (Orchideen)", v1: "Wächst sehr selten auf mageren, kalkreichen Trockenrasen und Weiden.", v2: "Dunkel purpurbraune Knospen an der Spitze wirken wie 'verbrannt', darunter öffnen sich weißliche Blüten.", v3: "Zählt zu den seltensten und am stärksten gefährdeten Orchideen Deutschlands.", wiki: "https://de.wikipedia.org/wiki/Brand-Knabenkraut" },
            { id: "18/45", type: "Geschützt", title: "Weißes Waldvöglein", latin: "Cephalanthera damasonium (Orchideen)", v1: "Wächst in schattigen, kalkreichen Laubwäldern, meist unter Buchen.", v2: "Cremeweiße, meist nur halb geöffnete Blüten mit orangegelbem Fleck im Schlund.", v3: "Bestäubt sich häufig selbst, da die Blüten kaum vollständig aufgehen.", wiki: "https://de.wikipedia.org/wiki/Wei%C3%9Fes_Waldv%C3%B6glein" },
            { id: "19/45", type: "Streng Geschützt", title: "Rotes Waldvöglein", latin: "Cephalanthera rubra (Orchideen)", v1: "Wächst sehr selten in lichten, warmen Kalkbuchenwäldern.", v2: "Leuchtend rosarote Blüten mit gelblich-weißer, gefranster Lippe.", v3: "Eine der farbenprächtigsten, aber auch seltensten heimischen Waldorchideen.", wiki: "https://de.wikipedia.org/wiki/Rotes_Waldv%C3%B6glein" },
            { id: "20/45", type: "Streng Geschützt", title: "Sumpf-Stendelwurz", latin: "Epipactis palustris (Orchideen)", v1: "Wächst selten geworden in Kalkflachmooren und auf feuchten, nährstoffarmen Wiesen.", v2: "Nickende, braun-weiße Blüten mit gekräuselter, weißer Lippe in lockeren Trauben.", v3: "Durch die Trockenlegung von Feuchtwiesen stark im Bestand zurückgegangen.", wiki: "https://de.wikipedia.org/wiki/Sumpf-Stendelwurz" },
            { id: "21/45", type: "Geschützt", title: "Mücken-Händelwurz", latin: "Gymnadenia conopsea (Orchideen)", v1: "Wächst auf mageren, kalkreichen Wiesen und in lichten Gebüschen.", v2: "Dichte, zylindrische Blütenähren aus kleinen, stark duftenden, rosaroten Blüten mit langem Sporn.", v3: "Der intensive, würzige Duft wird nachts besonders stark und lockt Nachtfalter an.", wiki: "https://de.wikipedia.org/wiki/M%C3%BCcken-H%C3%A4ndelwurz" },
            { id: "22/45", type: "Streng Geschützt", title: "Grüne Hohlzunge", latin: "Coeloglossum viride (Orchideen)", v1: "Wächst sehr selten auf mageren Bergwiesen und Kalkmagerrasen.", v2: "Unscheinbare, grünlich-braune Blüten mit kurzer, gedrungener Lippe.", v3: "Wegen ihrer unauffälligen Farbe wird sie leicht übersehen und gilt als stark gefährdet.", wiki: "https://de.wikipedia.org/wiki/Gr%C3%BCne_Hohlzunge" },
            { id: "23/45", type: "Streng Geschützt", title: "Kleines Zweiblatt", latin: "Neottia cordata (Orchideen)", v1: "Wächst sehr selten in moosreichen Nadelwäldern und Hochmooren, meist im Gebirge oder Norddeutschland.", v2: "Nur zwei herzförmige, gegenständige Blätter am Stängel und winzige, grünliche Blüten.", v3: "Eine der unscheinbarsten und am schwersten zu findenden heimischen Orchideenarten.", wiki: "https://de.wikipedia.org/wiki/Kleines_Zweiblatt" },
            { id: "24/45", type: "Streng Geschützt", title: "Torf-Glanzkraut", latin: "Liparis loeselii (Orchideen)", v1: "Wächst extrem selten in Kalkflachmooren und feuchten Dünentälern.", v2: "Zwei glänzend gelbgrüne Grundblätter und wenige kleine, gelbgrüne Blüten am Stängel.", v3: "Eine der am stärksten vom Aussterben bedrohten Pflanzenarten Mitteleuropas.", wiki: "https://de.wikipedia.org/wiki/Torf-Glanzkraut" },
            { id: "25/45", type: "Streng Geschützt", title: "Edelweiß", latin: "Leontopodium nivale (Korbblütler)", v1: "Wächst hoch oben auf felsigen, kalkreichen Alpenhängen und Geröllfluren.", v2: "Filzig-weiß behaarte, sternförmig angeordnete Hochblätter umrahmen die unscheinbaren gelblichen Blütenköpfchen.", v3: "Als Symbol der Alpen wurde es früher stark gepflückt und steht deshalb heute unter strengem Schutz.", wiki: "https://de.wikipedia.org/wiki/Edelwei%C3%9F" },
            { id: "26/45", type: "Geschützt", title: "Rostblättrige Alpenrose", latin: "Rhododendron ferrugineum (Heidekrautgewächse)", v1: "Bildet dichte Bestände an sauren, steinigen Hängen der Alpen oberhalb der Waldgrenze.", v2: "Lederartige, unterseits rostbraun beschuppte Blätter und leuchtend rosarote Blütendolden im Juni/Juli.", v3: "Eine der bekanntesten alpinen Blühpflanzen und namensgebend für ganze Almlandschaften.", wiki: "https://de.wikipedia.org/wiki/Rostbl%C3%A4ttrige_Alpenrose" },
            { id: "27/45", type: "Geschützt", title: "Gelber Enzian", latin: "Gentiana lutea (Enziangewächse)", v1: "Wächst auf nährstoffreichen Bergwiesen und Almweiden der Mittelgebirge und Alpen.", v2: "Große, ovale, stark geaderte Blätter und quirlständige, leuchtend gelbe Blüten an bis zu 1,5 Meter hohen Stängeln.", v3: "Die bittere Wurzel wird traditionell zur Herstellung von Enzianschnaps und Magenbitter genutzt, das Sammeln ist streng geregelt.", wiki: "https://de.wikipedia.org/wiki/Gelber_Enzian" },
            { id: "28/45", type: "Streng Geschützt", title: "Lungen-Enzian", latin: "Gentiana pneumonanthe (Enziangewächse)", v1: "Wächst sehr selten auf feuchten, nährstoffarmen Moor- und Streuwiesen.", v2: "Schmale, grasartige Blätter und große, tiefblaue, trichterförmige Einzelblüten im Spätsommer.", v3: "Ist die einzige Raupen-Futterpflanze des seltenen Kreuzenzian-Ameisenbläulings.", wiki: "https://de.wikipedia.org/wiki/Lungen-Enzian" },
            { id: "29/45", type: "Streng Geschützt", title: "Kreuz-Enzian", latin: "Gentiana cruciata (Enziangewächse)", v1: "Wächst sehr selten auf warmen, trockenen Kalkmagerrasen.", v2: "Kreuzförmig gegenständige Blätter und blaue, glockenförmige Blüten in dichten Blattachsel-Büscheln.", v3: "Wichtige Wirtspflanze für die Raupen des ebenfalls streng geschützten Kreuzenzian-Ameisenbläulings.", wiki: "https://de.wikipedia.org/wiki/Kreuz-Enzian" },
            { id: "30/45", type: "Geschützt", title: "Alpen-Soldanelle", latin: "Soldanella alpina (Primelgewächse)", v1: "Wächst an schneereichen Hängen der Alpen, blüht oft schon direkt am Rand schmelzender Schneefelder.", v2: "Runde, ledrige Blätter und nickende, tief gefranste, violette Glockenblüten.", v3: "Kann durch Zellatmung den umgebenden Schnee leicht antauen und so als eine der ersten Alpenblumen erscheinen.", wiki: "https://de.wikipedia.org/wiki/Alpen-Soldanelle" },
            { id: "31/45", type: "Geschützt", title: "Silberdistel", latin: "Carlina acaulis (Korbblütler)", v1: "Wächst auf mageren, kalkreichen Bergwiesen und Trockenrasen, oft stängellos direkt am Boden.", v2: "Silbrig-weiße, sternförmige Hüllblätter umschließen den großen, flachen Blütenkorb.", v3: "Schließt bei feuchtem Wetter ihre Hüllblätter und diente früher als natürliche 'Wetterstation'.", wiki: "https://de.wikipedia.org/wiki/Silberdistel" },
            { id: "32/45", type: "Streng Geschützt", title: "Federgras", latin: "Stipa pennata (Süßgräser)", v1: "Wächst extrem selten auf warmen, trockenen Steppenrasen und Felshängen.", v2: "Schmale, aufrechte Blätter und lange, silbrig gefiederte Grannen an den Samen, die im Wind wogen.", v3: "Eines der eindrucksvollsten heimischen Steppengräser, in Deutschland vom Aussterben bedroht.", wiki: "https://de.wikipedia.org/wiki/Federgras" },
            { id: "33/45", type: "Streng Geschützt", title: "Wiesen-Kuhschelle", latin: "Pulsatilla pratensis (Hahnenfußgewächse)", v1: "Wächst sehr selten auf sandigen, mageren Trockenrasen und Heiden, vor allem in Ostdeutschland.", v2: "Nickende, dunkel violett-braune Glockenblüten und fein zerteilte, seidig behaarte Blätter.", v3: "Im Gegensatz zur Gewöhnlichen Küchenschelle bleiben ihre Blüten stets leicht geöffnet und nickend.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Kuhschelle" },
            { id: "34/45", type: "Geschützt", title: "Sumpf-Herzblatt", latin: "Parnassia palustris (Dickblattgewächse)", v1: "Wächst selten geworden auf feuchten, nährstoffarmen Moor- und Quellwiesen.", v2: "Herzförmige Grundblätter und einzelne, weiße Blüten mit auffällig geäderten Kronblättern.", v3: "Die namensgebenden herzförmigen Blätter machten sie schon im Mittelalter zur Symbolpflanze der Liebe.", wiki: "https://de.wikipedia.org/wiki/Sumpf-Herzblatt" },
            { id: "35/45", type: "Geschützt", title: "Gewöhnliche Moosbeere", latin: "Vaccinium oxycoccos (Heidekrautgewächse)", v1: "Wächst kriechend in Torfmoosbulten von Hochmooren, oft weit abseits von Wegen.", v2: "Winzige, ledrige Blättchen an fadendünnen Trieben und kleine, rosa Blüten mit zurückgeschlagenen Kronblättern.", v3: "Die sauren, roten Beeren reifen erst im Spätherbst und sind eine Delikatesse für Moorvögel.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliche_Moosbeere" },
            { id: "36/45", type: "Geschützt", title: "Krähenbeere", latin: "Empetrum nigrum (Krähenbeerengewächse)", v1: "Wächst als niedriger Zwergstrauch in Hochmooren, Heiden und auf sauren Sandböden Norddeutschlands.", v2: "Nadelartige, immergrüne Blättchen und kleine, unscheinbare Blüten, gefolgt von schwarzen Beeren.", v3: "Die Beeren waren früher wichtiges Wildobst nordischer Völker, schmecken herb-säuerlich.", wiki: "https://de.wikipedia.org/wiki/Kr%C3%A4henbeere" },
            { id: "37/45", type: "Streng Geschützt", title: "Sumpf-Calla (Drachenwurz)", latin: "Calla palustris (Aronstabgewächse)", v1: "Wächst sehr selten an schlammigen Ufern von Mooren, Sümpfen und stehenden Gewässern.", v2: "Herzförmige, glänzende Blätter und ein weißes Hochblatt, das den kleinen Blütenkolben umhüllt.", v3: "Alle Pflanzenteile sind roh giftig, wurden getrocknet aber früher in Notzeiten zu 'Missbrot' verarbeitet.", wiki: "https://de.wikipedia.org/wiki/Drachenwurz" },
            { id: "38/45", type: "Vom Aussterben bedroht", title: "Vierblättriger Kleefarn", latin: "Marsilea quadrifolia (Kleefarngewächse)", v1: "Wächst extrem selten in flachen, nährstoffarmen Altwassern und Teichen.", v2: "Kleeblattähnliche, vierteilige Blätter, die an langen Stielen auf oder knapp über der Wasseroberfläche schwimmen.", v3: "Einer der seltensten heimischen Farne überhaupt, in Deutschland nur noch an wenigen Stellen erhalten.", wiki: "https://de.wikipedia.org/wiki/Vierbl%C3%A4ttriger_Kleefarn" },
            { id: "39/45", type: "Streng Geschützt (EU-weit)", title: "Schwimmendes Froschkraut", latin: "Luronium natans (Froschlöffelgewächse)", v1: "Wächst sehr selten in nährstoffarmen Seen, Teichen und langsam fließenden Gewässern.", v2: "Schwimmende, ovale Blätter und kleine, weiße, dreizählige Blüten knapp über der Wasseroberfläche.", v3: "Zählt zu den prioritär geschützten Arten der europäischen Fauna-Flora-Habitat-Richtlinie.", wiki: "https://de.wikipedia.org/wiki/Schwimmendes_Froschkraut" },
            { id: "40/45", type: "Geschützt", title: "Strand-Grasnelke", latin: "Armeria maritima (Bleiwurzgewächse)", v1: "Wächst an Küsten, Salzwiesen und in geringerer Zahl auch auf Schwermetallböden im Binnenland.", v2: "Grasartige Blattrosette und kugelige, rosarote Blütenköpfe an langen, blattlosen Stielen.", v3: "Eine der wenigen Pflanzen, die sowohl salzige Küstenböden als auch schwermetallbelastete Standorte vertragen.", wiki: "https://de.wikipedia.org/wiki/Strand-Grasnelke" },
            { id: "41/45", type: "Geschützt", title: "Alpen-Aster", latin: "Aster alpinus (Korbblütler)", v1: "Wächst auf steinigen, kalkreichen Alpenwiesen und Felsbändern.", v2: "Grundständige, spatelförmige Blätter und große, violette Blütenköpfe mit gelber Mitte.", v3: "Eine der farbenprächtigsten Alpenblumen, oft in großen Polstern anzutreffen.", wiki: "https://de.wikipedia.org/wiki/Alpen-Aster" },
            { id: "42/45", type: "Geschützt", title: "Sumpffarn", latin: "Thelypteris palustris (Wurmfarngewächse)", v1: "Wächst selten geworden in Erlenbrüchen, Kalkflachmooren und feuchten Röhrichten.", v2: "Zart gefiederte, hellgrüne Wedel, die aus einem kriechenden Rhizom in lockerem Bestand wachsen.", v3: "Ein wichtiger Zeigerfarn für intakte, nährstoffarme Feuchtgebiete.", wiki: "https://de.wikipedia.org/wiki/Sumpffarn" },
            { id: "43/45", type: "Geschützt", title: "Alpen-Kuhschelle", latin: "Pulsatilla alpina (Hahnenfußgewächse)", v1: "Wächst auf alpinen Weiden und Matten oberhalb der Waldgrenze, oft in großen Gruppen.", v2: "Große, weiße bis leicht rosa überhauchte Blüten mit goldgelben Staubgefäßen und stark behaarten Knospen.", v3: "Nach der Blüte bilden sich auffällige, silbrig-federige Fruchtstände, die an kleine Wattebäusche erinnern.", wiki: "https://de.wikipedia.org/wiki/Alpen-Kuhschelle" },
            { id: "44/45", type: "Geschützt", title: "Feder-Nelke", latin: "Dianthus plumarius (Nelkengewächse)", v1: "Wächst selten auf trockenen Felsstandorten, Mauern und Kalkmagerrasen.", v2: "Blaugrüne, grasartige Blätter und stark duftende, weiße bis rosa Blüten mit tief gefransten Kronblättern.", v3: "Die Stammform vieler beliebter Garten-Nelkensorten.", wiki: "https://de.wikipedia.org/wiki/Feder-Nelke" },
            { id: "45/45", type: "Geschützt", title: "Karthäuser-Nelke", latin: "Dianthus carthusianorum (Nelkengewächse)", v1: "Wächst auf mageren, trockenen Kalkmagerrasen und Felsstandorten, blüht intensiv purpurrot im Sommer.", v2: "Schmale, grasartige Blätter und dichte Büschel kleiner, leuchtend purpurroter Blüten.", v3: "Wichtige Nektarquelle für Schmetterlinge auf sonst blütenarmen Trockenrasen.", wiki: "https://de.wikipedia.org/wiki/Karth%C3%A4user-Nelke" }
        ]
    };

    function showCurrentCard() {

        const container = document.getElementById('card-container');
        const list = plantData[currentCategory] || [];

        if (list.length === 0 || !list[currentCardIndex]) {
            container.innerHTML = `<div style="padding:20px; text-align:center; color:#7f8c8d;">In dieser Kategorie folgen bald weitere Karten.</div>`;
            document.getElementById('btn-prev').disabled = true;
            document.getElementById('btn-next').disabled = true;
            return;
        }

        const item = list[currentCardIndex];

        container.innerHTML = `
            <div class="plant-card" id="active-plant-card" onclick="handleCardClick()">
                <div class="card-header">
                    <div class="card-header-left">Wildpflanze ${item.id}</div>
                    <div class="card-header-right">${item.type}</div>
                </div>
                <div class="card-body">
                    <h2 class="plant-title">${item.title}</h2>
                    <div class="latin-name">${item.latin}</div>
                    <div class="verse"><span class="verse-num">1.</span>${item.v1}</div>
                    <div class="verse"><span class="verse-num">2.</span>${item.v2}</div>
                    <div class="verse"><span class="verse-num">3.</span>${item.v3}</div>
                </div>
                <div class="card-footer">
                    <a href="${item.wiki}" target="_blank" class="wiki-link" onclick="event.stopPropagation();">🔗 Wikipedia</a>
                    <div class="action-buttons">
                        <button class="btn-action btn-audio" onclick="event.stopPropagation(); speakCard();">🔊 Vorlesen</button>
                        <button class="btn-action btn-stop" onclick="event.stopPropagation(); stopSpeech();">⏹️ Stopp</button>
                    </div>
                </div>
            </div>
        `;

        document.getElementById('btn-prev').disabled = (currentCardIndex === 0);
        document.getElementById('btn-next').disabled = (currentCardIndex === list.length - 1);
    }

    function handleCardClick() {
        if (!('speechSynthesis' in window)) {
            navigateCard(1);
            return;
        }
        isAutoNavigating = true;
        speakCard(true);
    }

    function changeCategory(category, element) {
        currentCategory = category;
        currentCardIndex = 0;

        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');

        const titles = {
            fruehblueher: "Frühblüher", kueche: "Küche", heilkraeuter: "Heilpflanzen",
            giftig: "Giftpflanzen", baeume: "Bäume", straeucher: "Sträucher",
            wiesen: "Wiesenpflanzen", wald: "Waldpflanzen", selten: "Seltene Arten"
        };
        document.getElementById('cat-title').innerText = titles[category];

        showCurrentCard();
    }

    function navigateCard(direction) {
        const list = plantData[currentCategory] || [];
        const nextIndex = currentCardIndex + direction;

        if (nextIndex >= 0 && nextIndex < list.length) {
            currentCardIndex = nextIndex;
            showCurrentCard();
        }
    }

    function speakCard(autoNavigateAfter = false) {
        stopSpeech();
        const list = plantData[currentCategory];
        if (!list || !list[currentCardIndex]) return;
        const item = list[currentCardIndex];

        if ('speechSynthesis' in window) {
            const text = `${item.title}. Erstens: ${item.v1} Zweitens: ${item.v2} Drittens: ${item.v3}`;
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.lang = 'de-DE';

            if (autoNavigateAfter) {
                currentUtterance.onend = function() {
                    if (isAutoNavigating) {
                        navigateCard(1);
                    }
                };
            }

            window.speechSynthesis.speak(currentUtterance);
        }
    }

    function stopSpeech() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
        if (isAutoNavigating) {
            isAutoNavigating = false;
        }
    }

    function showLegalModal(type) {
        const titleEl = document.getElementById('modal-title');
        const bodyEl = document.getElementById('modal-body');
        if (type === 'impressum') {
            titleEl.innerText = 'Impressum';
            bodyEl.innerText = '© Ella Pinorella Verlag\nKatharina Schütz\nPotsdam, Germany\n\nE-Mail: ella.pinorella.07@gmail.com\n\nÜber diese App:\nDiese Wildpflanzen-App ist aus meinem eigenen Interesse an heimischen Kräutern entstanden, auch angeregt durch einen Wildpflanzenkurs, den ich im September in Berlin-Düppel besuche. Zusammengestellt habe ich die App mithilfe künstlicher Intelligenz und habe dabei mehrere KIs getestet (u. a. Claude, ChatGPT, Gemini). Ohne diese Hilfe wäre die App so nicht entstanden – die kreative Umsetzung, der Aufbau und die Auswahl der Inhalte stammen jedoch aus meinen eigenen Gedanken. Die App richtet sich an alle, die sich mit Kräutern und der Natur intensiver beschäftigen möchten.\n\nQuellenhinweis:\nDiese App verlinkt auf Wikipedia-Artikel. Für die Richtigkeit dieser externen Informationen wird keine Haftung übernommen.\n\nNutzung:\nDiese App ist ausschließlich für private Zwecke bestimmt. Eine kommerzielle Nutzung ist nicht gestattet. Die Weitergabe des Links ist nur mit Erlaubnis der Autorin gestattet.\n\n© 2026 Ella Pinorella Verlag\nAlle Rechte vorbehalten.';
        } else {
            titleEl.innerText = 'Datenschutz';
            bodyEl.innerText = 'Diese App sammelt keine personenbezogenen Daten, nutzt keine Cookies und speichert keinerlei Nutzungsverhalten. Die Vorlesefunktion verwendet die im Browser integrierte, rein lokale Web Speech API.';
        }
        document.getElementById('legal-modal').classList.add('active');
    }

    function closeLegalModal(event) {
        if (event) event.stopPropagation();
        document.getElementById('legal-modal').classList.remove('active');
    }

    window.onload = function() {
        showCurrentCard();
    };
</script>
</body>
