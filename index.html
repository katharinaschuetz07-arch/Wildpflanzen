    const plantData = {

            { id: "01/45", type: "Giftpflanze", title: "Buschwindröschen", latin: "Anemone nemorosa (Hahnenfußgewächse)", v1: "Bildet im März bis Mai dichte, weiße Blütenteppiche in Laubwäldern, bevor die Bäume austreiben.", v2: "Eine einzige weiße Blüte pro Stängel mit meist 6 bis 8 Blütenblättern. Die Stängelblätter sind tief dreiteilig.", v3: "Nutzt das Licht vor dem Blattschluss der Bäume. Achtung: Im frischen Zustand durch Protoanemonin giftig!", wiki: "https://de.wikipedia.org/wiki/Buschwind%C3%B6schen" },
            { id: "02/45", type: "Essbar (vor Blüte)", title: "Scharbockskraut", latin: "Ficaria verna (Hahnenfußgewächse)", v1: "Gehört zu den allerersten Frühlingsboten ab März auf feuchten Wiesen und unter Hecken.", v2: "Glänzende, herz- bis nierenförmige Blätter und sternförmige, leuchtend gelbe Blüten.", v3: "Die Blätter sind extrem reich an Vitamin C. Sobald sich die Blüten öffnen, lagert die Pflanze Bitterstoffe ein.", wiki: "https://de.wikipedia.org/wiki/Scharbockskraut" },
            { id: "03/45", type: "Geschützt / Giftig", title: "Gewöhnliches Leberblümchen", latin: "Hepatica nobilis (Hahnenfußgewächse)", v1: "Wächst vor allem in kalkreichen Buchenwäldern und blüht oft schon ab März.", v2: "Unverkennbare, intensiv azurblaue Blüten. Die Laubblätter sind dreilappig und erinnern an die Form der Leber.", v3: "Steht unter strengem Naturschutz (darf nicht gepflückt werden) und ist schwach giftig.", wiki: "https://de.wikipedia.org/wiki/Dreilappiges_Leberbl%C3%BCmchen" },
            { id: "04/45", type: "Heilkraut", title: "Huflattich", latin: "Tussilago farfara (Korbblütler)", v1: "Besiedelt als Pionierpflanze trockene, offene Böden, Bahndämme und Schuttplätze ab Februar/März.", v2: "Das Kuriose: Die gelben Blüten erscheinen lange vor den Blättern. Die Blätter treiben erst aus, wenn die Blüte vorbei ist.", v3: "Eine der ältesten Husten-Heilpflanzen. Der Name Tussilago bedeutet übersetzt 'Hustenvertreiber'.", wiki: "https://de.wikipedia.org/wiki/Huflattich" },
            { id: "05/45", type: "Geschützt / Giftig", title: "Märzenbecher", latin: "Leucojum vernum (Amaryllisgewächse)", v1: "Liebt feuchte Auwälder und Laubmischwälder. Blüht im März, oft noch im Schnee.", v2: "Größer als das Schneeglöckchen. Die weißen, glockenförmigen Blüten haben an den Spitzen charakteristische grün-gelbe Punkte.", v3: "Die gesamte Pflanze ist stark giftig (enthält Alkaloide wie Lycorin). Gilt in freier Natur als gefährdet.", wiki: "https://de.wikipedia.org/wiki/Fr%C3%BChlings-Knotenblume" },
            { id: "06/45", type: "Geschützt / Giftig", title: "Kleines Schneeglöckchen", latin: "Galanthus nivalis (Amaryllisgewächse)", v1: "Der absolute Klassiker. Blüht oft schon ab Januar/Februar in Wäldern und Gärten.", v2: "Nickende, weiße Einzelblüte. Die drei inneren Blütenblätter sind deutlich kürzer als die äußeren und grün gezeichnet.", v3: "Schmilzt durch Eigenwärme den umgebenden Schnee weg. Ebenfalls giftig und streng geschützt.", wiki: "https://de.wikipedia.org/wiki/Kleines_Schneegl%C3%B6ckchen" },
            { id: "07/45", type: "Selten", title: "Wald-Gelbstern", latin: "Gagea lutea (Liliengewächse)", v1: "Wächst im März und April in nährstoffreichen Laubwäldern, Gebüschen und Parkanlagen.", v2: "Kleine, sternförmige, gelbe Blüten mit grünen Streifen auf der Außenseite der Blütenblätter.", v3: "Zieht nach der Blüte extrem schnell ein. Schon im Juni ist oberirdisch absolut nichts mehr zu sehen.", wiki: "https://de.wikipedia.org/wiki/Wald-Gelbstern" },
            { id: "08/45", type: "Heilkraut", title: "Geflecktes Lungenkraut", latin: "Pulmonaria officinalis (Raublattgewächse)", v1: "Wächst in schattigen Laubmischwäldern und blüht von März bis Mai.", v2: "Die Blätter haben auffällige, weiße Flecken. Die Blüten wechseln ihre Farbe während des Blühens von Rosa zu Blau.", v3: "Enthält Kieselsäure und Schleimstoffe. Wurde traditionell bei Lungenleiden eingesetzt.", wiki: "https://de.wikipedia.org/wiki/Geflecktes_Lungenkraut" },
            { id: "09/45", type: "Heilkraut / Geschützt", title: "Hohe Schlüsselblume", latin: "Primula elatior (Primelgewächse)", v1: "Blüht von März bis Mai in feuchten Wäldern, auf Wiesen und an Bachrändern.", v2: "Hellgelbe Blüten, die in einer Dolde an einem gemeinsamen, behaarten Stängel einseitig nach unten hängen.", v3: "Die Wurzeln riechen stark nach Anis. Steht unter Naturschutz. Wirkt als Schleimlöser bei Husten.", wiki: "https://de.wikipedia.org/wiki/Hohe_Schl%C3%BCsselblume" },
            { id: "10/45", type: "Heilkraut", title: "Gewöhnlicher Pestwurz", latin: "Petasites hybridus (Korbblütler)", v1: "Treibt seine Blüten im März/April an Bachufern und feuchten Gräben aus.", v2: "Erst kommen rötlich-blasse Blütenkolben. Danach wachsen die Blätter, die riesig werden können (bis zu 1 Meter!).", v3: "Stark krampflösend (z.B. bei Migräne), darf wegen PA aber nur als Fertigpräparat genutzt werden.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliche_Pestwurz" },
            { id: "11/45", type: "Duft / Essbar", title: "Hain-Veilchen", latin: "Viola riviniana (Veilchengewächse)", v1: "Besiedelt lichte Wälder, Waldränder und Gebüsche von April bis Juni.", v2: "Typische Veilchenblüte in Hellblau bis Violett mit einem weißlichen Sporn. Herzförmige Laubblätter.", v3: "Duftet fast gar nicht im Vergleich zum März-Veilchen. Die Blüten sind eine wunderschöne Salat-Dekoration.", wiki: "https://de.wikipedia.org/wiki/Hain-Veilchen" },
            { id: "12/45", type: "Essbar / Heilkraut", title: "Gundermann", latin: "Glechoma hederacea (Lippenblütler)", v1: "Wächst ab April kriechend am Waldboden, in Gärten und unter Hecken. Bleibt wintergrün.", v2: "Runde, gekerbte Blätter an Ausläufern. Die kleinen Blüten sind blauviolett.", v3: "Tolles Gewürzkraut mit herbem, leicht minzigem Geschmack. Wurde früher zum Bierbrauen genutzt.", wiki: "https://de.wikipedia.org/wiki/Gundermann" },
            { id: "13/45", type: "Essbar / Gewürz", title: "Knoblauchsrauke", latin: "Alliaria petiolata (Kreuzblütler)", v1: "Erscheint ab April an schattigen Waldrändern, Hecken und in nährstoffreichen Gärten.", v2: "Herz- bis nierenförmige Blätter und kleine weiße Blüten mit vier Blättern im Kreuz.", v3: "Zerriebene Blätter duften intensiv nach Knoblauch, hinterlassen aber danach keinen langanhaltenden Atem!", wiki: "https://de.wikipedia.org/wiki/Knoblauchsrauke" },
            { id: "14/45", type: "Farbwunder", title: "Frühlings-Platterbse", latin: "Lathyrus vernus (Hülsenfrüchtler)", v1: "Bevorzugt Laubwälder und ist von April bis Mai zu finden.", v2: "Schmetterlingsblüten zeigen ein Farbspiel: Sie blühen purpurrot auf und verblühen grünblau.", v3: "Samen reifen in braunen Hülsen. In größeren Mengen wie viele wilde Erbsen schwach giftig.", wiki: "https://de.wikipedia.org/wiki/Fr%C3%BChlings-Platterbse" },
            { id: "15/45", type: "Stark Giftig", title: "Einbeere", latin: "Paris quadrifolia (Melanthiengewächse)", v1: "Wächst ab April/Mai in feuchten, schattigen Laub- und Auwäldern auf gutem Humus.", v2: "Vier Blätter stehen in einem perfekten Quirl. Aus der Mitte wächst eine einzelne grünliche Blüte.", v3: "Später bildet sich genau eine blauschwarze Beere. Achtung: Die Beere und alle Teile sind hochgradig giftig!", wiki: "https://de.wikipedia.org/wiki/Vierbl%C3%A4ttrige_Einbeere" },
            { id: "16/45", type: "Essbar / Aroma", title: "Waldmeister", latin: "Galium odoratum (Rötegewächse)", v1: "Teppichbildner in schattigen Buchenwäldern von April bis Juni.", v2: "Schmale Blätter stehen in Quirlen am vierkantigen Stängel. Blüten sind winzig, weiß und kreuzförmig.", v3: "Enthält Cumarin. Das typische Aroma entsteht erst, wenn die Pflanze leicht welkt oder trocknet (Maibowle).", wiki: "https://de.wikipedia.org/wiki/Waldmeister" },
            { id: "17/45", type: "Giftpflanze", title: "Gelbes Windröschen", latin: "Anemone ranunculoides (Hahnenfußgewächse)", v1: "Wächst in feuchten Laub- und Auwäldern, oft gemeinsam mit dem Buschwindröschen, blüht März bis Mai.", v2: "Leuchtend gelbe Einzelblüten mit meist 5 bis 8 Blütenblättern und tief gelappten Stängelblättern.", v3: "Wie das Buschwindröschen enthält die Pflanze Protoanemonin und ist im frischen Zustand giftig.", wiki: "https://de.wikipedia.org/wiki/Gelbes_Windr%C3%B6schen" },
            { id: "18/45", type: "Giftpflanze", title: "Sumpfdotterblume", latin: "Caltha palustris (Hahnenfußgewächse)", v1: "Wächst an sumpfigen Ufern, Gräben und in Feuchtwiesen, blüht bereits ab März leuchtend gelb.", v2: "Herz- bis nierenförmige, glänzende Blätter und große, becherförmige goldgelbe Blüten.", v3: "Frisch giftig durch Protoanemonin, wird aber von manchen Wasservögeln als Nahrung genutzt.", wiki: "https://de.wikipedia.org/wiki/Sumpfdotterblume" },
            { id: "19/45", type: "Duft / Essbar", title: "Duftveilchen", latin: "Viola odorata (Veilchengewächse)", v1: "Wächst an Hecken, Gartenrändern und Waldsäumen, blüht schon ab März intensiv duftend.", v2: "Herzförmige Blätter und dunkelviolette, stark duftende Blüten mit kurzem Sporn.", v3: "Die Blüten werden traditionell kandiert oder zu Sirup verarbeitet und schmücken Frühlingssalate.", wiki: "https://de.wikipedia.org/wiki/Duft-Veilchen" },
            { id: "20/45", type: "Giftig", title: "Kleines Immergrün", latin: "Vinca minor (Hundsgiftgewächse)", v1: "Wächst als immergrüner Bodendecker in schattigen Gärten, Parks und an Waldrändern.", v2: "Glänzend dunkelgrüne, ledrige Blätter und einzelne, blauviolette Sternblüten von März bis Mai.", v3: "Alle Pflanzenteile enthalten das Alkaloid Vincamin und sind für Mensch und Tier giftig.", wiki: "https://de.wikipedia.org/wiki/Kleines_Immergr%C3%BCn" },
            { id: "21/45", type: "Stark Giftig", title: "Gewöhnlicher Seidelbast", latin: "Daphne mezereum (Seidelbastgewächse)", v1: "Wächst in lichten Laubwäldern und an Waldrändern, blüht schon im Februar/März vor dem Laubaustrieb.", v2: "Rosa-violette, stark duftende Blüten sitzen direkt am kahlen Zweig, im Sommer folgen leuchtend rote Beeren.", v3: "Eine der giftigsten heimischen Pflanzen – schon wenige Beeren können für Kinder lebensgefährlich sein.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnlicher_Seidelbast" },
            { id: "22/45", type: "Frühblüher", title: "Zweiblättriger Blaustern", latin: "Scilla bifolia (Spargelgewächse)", v1: "Wächst in lichten Laubwäldern und auf Wiesen, bildet im März blaue Blütenteppiche.", v2: "Zwei schmale, grundständige Blätter und sternförmige, leuchtend blaue Blüten in lockeren Trauben.", v3: "Eine der wenigen wirklich heimischen Blausternarten Mitteleuropas, in manchen Regionen selten geworden.", wiki: "https://de.wikipedia.org/wiki/Zweibl%C3%A4ttriger_Blaustern" },
            { id: "23/45", type: "Frühblüher", title: "Wechselblättriges Milzkraut", latin: "Chrysosplenium alternifolium (Steinbrechgewächse)", v1: "Wächst an quelligen, feuchten Stellen in Wäldern und an Bachrändern, blüht März bis Mai.", v2: "Kleine, nierenförmige Blätter und unscheinbare, aber von leuchtend gelbgrünen Hochblättern umrahmte Blütenpolster.", v3: "Bildet dichte, moosähnliche Teppiche und ist ein verlässlicher Zeiger für nasse, nährstoffreiche Böden.", wiki: "https://de.wikipedia.org/wiki/Wechselbl%C3%A4ttriges_Milzkraut" },
            { id: "24/45", type: "Frühblüher", title: "Frühlings-Fingerkraut", latin: "Potentilla neumanniana (Rosengewächse)", v1: "Wächst auf trockenen, sonnigen Magerrasen und Böschungen, blüht schon ab März leuchtend gelb.", v2: "Kleine, fünfteilige Blätter in dichten Polstern und flache, gelbe Blüten mit fünf herzförmigen Kronblättern.", v3: "Eine der ersten Nahrungsquellen für früh fliegende Wildbienen im Jahr.", wiki: "https://de.wikipedia.org/wiki/Fr%C3%BChlings-Fingerkraut" },
            { id: "25/45", type: "Frühblüher", title: "Wiesenschaumkraut", latin: "Cardamine pratensis (Kreuzblütler)", v1: "Überzieht feuchte Wiesen ab April mit einem zarten, lila-weißen Blütenteppich.", v2: "Gefiederte Blätter und vierblättrige, hellviolette bis weiße Blüten in lockeren Trauben.", v3: "Namensgeberin für den 'Kuckucksspeichel' der Wiesenschaumzikade, die sich an den Stängeln versteckt.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Schaumkraut" },
            { id: "26/45", type: "Frühblüher", title: "Rote Taubnessel", latin: "Lamium purpureum (Lippenblütler)", v1: "Wächst auf Äckern, in Gärten und an Wegrändern, blüht oft schon ab Februar bei milder Witterung.", v2: "Rötlich überlaufene obere Blätter und kleine, purpurrote Lippenblüten in dichten Blattachsel-Quirlen.", v3: "Eine wichtige frühe Nektarquelle für Bienen, wenn kaum andere Blüten verfügbar sind.", wiki: "https://de.wikipedia.org/wiki/Rote_Taubnessel" },
            { id: "27/45", type: "Frühblüher", title: "Wald-Vergissmeinnicht", latin: "Myosotis sylvatica (Raublattgewächse)", v1: "Wächst in lichten Laubwäldern, an Waldrändern und in Gärten, blüht von April bis Juni.", v2: "Behaarte, längliche Blätter und kleine, leuchtend blaue Blüten mit gelbem Schlundring.", v3: "Gilt seit jeher als Symbol der Treue und Erinnerung – daher der deutsche und lateinische Name.", wiki: "https://de.wikipedia.org/wiki/Wald-Vergissmeinnicht" },
            { id: "28/45", type: "Giftig / Frühblüher", title: "Hohler Lerchensporn", latin: "Corydalis cava (Erdrauchgewächse)", v1: "Bildet im März/April dichte Teppiche in Auwäldern und auf nährstoffreichen Böden.", v2: "Blaugrüne, doppelt gefiederte Blätter und traubige Blütenstände in Purpur, Rosa oder Weiß mit charakteristischem Sporn.", v3: "Die hohle Knolle gab der Pflanze ihren Namen; alle Teile enthalten schwach giftige Alkaloide.", wiki: "https://de.wikipedia.org/wiki/Hohler_Lerchensporn" },
            { id: "29/45", type: "Frühblüher", title: "Zwiebel-Zahnwurz", latin: "Cardamine bulbifera (Kreuzblütler)", v1: "Wächst in schattigen, feuchten Laubwäldern, blüht von April bis Juni.", v2: "Gefiederte Blätter mit kleinen, schwarzvioletten Brutzwiebeln in den Blattachseln und blassviolette Blüten.", v3: "Vermehrt sich hauptsächlich über die Brutzwiebeln, die zu Boden fallen und neue Pflanzen bilden.", wiki: "https://de.wikipedia.org/wiki/Zwiebel-Zahnwurz" },
            { id: "30/45", type: "Frühblüher", title: "Sal-Weide", latin: "Salix caprea (Weidengewächse)", v1: "Wächst an Waldrändern und feuchten Böschungen, blüht schon im Februar/März weit vor dem Laubaustrieb.", v2: "Die pelzig-silbrigen 'Palmkätzchen' sitzen dicht an den kahlen Zweigen, männliche Kätzchen färben sich später leuchtend gelb.", v3: "Eine der wichtigsten Bienenweiden im zeitigen Frühjahr, wenn sonst kaum Nahrung verfügbar ist.", wiki: "https://de.wikipedia.org/wiki/Sal-Weide" },
            { id: "31/45", type: "Frühblüher", title: "Gemeine Hasel", latin: "Corylus avellana (Birkengewächse)", v1: "Wächst in fast jedem Wald, Garten und Hecke, blüht bereits im Januar/Februar.", v2: "Hängende, gelbe Staubbeutelkätzchen stäuben Pollen in den Wind, winzige rote Narbenbüschel sitzen an den Knospen.", v3: "Zählt zu den ersten Pollenspendern des Jahres und ist für Allergiker oft der Startschuss der Pollensaison.", wiki: "https://de.wikipedia.org/wiki/Gemeine_Hasel" },
            { id: "32/45", type: "Giftig / Frühblüher", title: "Winterling", latin: "Eranthis hyemalis (Hahnenfußgewächse)", v1: "Wächst in Parks, Gärten und lichten Laubwäldern, blüht oft schon im Januar/Februar durch den Schnee.", v2: "Leuchtend gelbe, sternförmige Blüten sitzen direkt über einem kragenartigen, grünen Hochblattkranz.", v3: "Alle Pflanzenteile enthalten herzwirksame Glykoside und sind giftig.", wiki: "https://de.wikipedia.org/wiki/Winterling" },
            { id: "33/45", type: "Streng Geschützt", title: "Frühlings-Enzian", latin: "Gentiana verna (Enziangewächse)", v1: "Wächst extrem selten auf alpinen und voralpinen Magerrasen, blüht in intensivem Enzianblau.", v2: "Kleine, rosettenartige Blätter und einzeln stehende, sternförmige Blüten von leuchtender Farbe.", v3: "Zählt zu den am intensivsten blau gefärbten heimischen Blüten überhaupt und steht unter strengem Schutz.", wiki: "https://de.wikipedia.org/wiki/Fr%C3%BChlings-Enzian" },
            { id: "34/45", type: "Streng Geschützt", title: "Aurikel", latin: "Primula auricula (Primelgewächse)", v1: "Wächst selten an Felsspalten und auf Kalkfelsen der Alpen und Voralpen.", v2: "Mehlig bereifte, ledrige Blätter und dottergelbe, duftende Blütendolden.", v3: "Wurde bereits im 16. Jahrhundert als Zierpflanze kultiviert und ist Stammform vieler Gartenprimeln.", wiki: "https://de.wikipedia.org/wiki/Aurikel" },
            { id: "35/45", type: "Essbar / Frühblüher", title: "Kornelkirsche", latin: "Cornus mas (Hartriegelgewächse)", v1: "Blüht bereits im Februar/März goldgelb in lichten Wäldern, Hecken und Gärten – weit vor dem Blattaustrieb.", v2: "Kleine, doldenartige gelbe Blütenbüschel sitzen dicht an den kahlen Zweigen.", v3: "Die im Herbst reifenden, säuerlichen roten Steinfrüchte ergeben köstliche Marmeladen und Liköre.", wiki: "https://de.wikipedia.org/wiki/Kornelkirsche" },
            { id: "36/45", type: "Essbar", title: "Bärlauch", latin: "Allium ursinum (Amaryllisgewächse)", v1: "Bildet ab März/April dichte, knoblauchduftende Blätterteppiche in feuchten, schattigen Laubwäldern.", v2: "Schmale, lanzettliche Blätter und kugelige, weiße Doldenblüten, die im April/Mai erscheinen.", v3: "Vorsicht beim Sammeln: Die Blätter ähneln stark den hochgiftigen Blättern von Maiglöckchen und Herbstzeitlose.", wiki: "https://de.wikipedia.org/wiki/B%C3%A4rlauch" },
            { id: "37/45", type: "Heilkraut / Geschützt", title: "Fieberklee", latin: "Menyanthes trifoliata (Fieberkleegewächse)", v1: "Wächst in Mooren, Sümpfen und an flachen Gewässerrändern, blüht von April bis Juni.", v2: "Dreizählige, kleeähnliche Blätter und auffällig fransig-behaarte, weiß-rosa Blütensterne.", v3: "Die bitteren Blätter wurden traditionell bei Verdauungsschwäche genutzt; die Art ist heute stark gefährdet.", wiki: "https://de.wikipedia.org/wiki/Fieberklee" },
            { id: "38/45", type: "Verwildert", title: "Elfen-Krokus", latin: "Crocus tommasinianus (Schwertliliengewächse)", v1: "Ursprünglich aus Südosteuropa eingeführt, hat sich der Krokus in Parks, Gärten und auf Wiesen vielerorts eingebürgert.", v2: "Schmale, weiß gestreifte Blätter und schlanke, hell- bis dunkelviolette Blüten, die schon im Februar erscheinen.", v3: "Bildet oft flächendeckende Blütenteppiche und zählt zu den ersten Nektarquellen für Bienen im Jahr.", wiki: "https://de.wikipedia.org/wiki/Elfenkrokus" },
            { id: "39/45", type: "Essbar", title: "Wald-Sauerklee", latin: "Oxalis acetosella (Sauerkleegewächse)", v1: "Wächst an schattigen, moosigen Stellen in Nadel- und Laubwäldern, blüht von April bis Mai.", v2: "Kleeblattartige, dreizählige Blätter, die sich nachts und bei Regen einklappen, sowie zarte weiß-violett geäderte Blüten.", v3: "Die Blätter schmecken angenehm säuerlich, enthalten aber Oxalsäure und sollten nur in Maßen genascht werden.", wiki: "https://de.wikipedia.org/wiki/Wald-Sauerklee" },
            { id: "40/45", type: "Frühblüher", title: "Weiße Pestwurz", latin: "Petasites albus (Korbblütler)", v1: "Wächst an feuchten Berghängen, Bachufern und in Schluchtwäldern, blüht schon im März.", v2: "Weißliche Blütenköpfe erscheinen vor den großen, runden Blättern, die erst danach austreiben.", v3: "Eine wichtige frühe Nahrungsquelle für Hummelköniginnen nach dem Winterschlaf.", wiki: "https://de.wikipedia.org/wiki/Wei%C3%9Fe_Pestwurz" },
            { id: "41/45", type: "Frühblüher", title: "Sumpf-Veilchen", latin: "Viola palustris (Veilchengewächse)", v1: "Wächst auf nassen Wiesen, in Mooren und an Grabenrändern, blüht von April bis Juni.", v2: "Rundliche, herzförmige Blätter und blasslila Blüten mit dunklen Aderzeichnungen ohne Duft.", v3: "Im Gegensatz zu vielen anderen Veilchenarten bevorzugt es ausschließlich sehr nasse Standorte.", wiki: "https://de.wikipedia.org/wiki/Sumpf-Veilchen" },
            { id: "42/45", type: "Verwildert", title: "Traubenhyazinthe", latin: "Muscari botryoides (Spargelgewächse)", v1: "Ursprünglich als Gartenpflanze eingeführt, hat sie sich auf Wiesen, in Parks und an Wegrändern eingebürgert.", v2: "Grasartige Blätter und dichte, traubige Blütenstände aus kleinen, kugeligen, tiefblauen Blüten.", v3: "Der Duft erinnert entfernt an reife Pflaumen, was der Pflanze ihren botanischen Namen einbrachte.", wiki: "https://de.wikipedia.org/wiki/Kleine_Traubenhyazinthe" },
            { id: "43/45", type: "Geschützt", title: "Wilde Narzisse (Osterglocke)", latin: "Narcissus pseudonarcissus (Amaryllisgewächse)", v1: "Wächst selten geworden auf feuchten Bergwiesen, ist aber Namensgeberin der Gartennarzissen.", v2: "Schmale, graugrüne Blätter und die typische Blüte mit heller Blütenhülle und leuchtend gelber Nebenkrone.", v3: "In einigen Regionen wie der Eifel gibt es noch beeindruckende, streng geschützte Wildbestände.", wiki: "https://de.wikipedia.org/wiki/Gelbe_Narzisse" },
            { id: "44/45", type: "Frühblüher", title: "Wald-Veilchen", latin: "Viola reichenbachiana (Veilchengewächse)", v1: "Wächst in lichten Laub- und Mischwäldern, blüht oft schon etwas früher als das Hain-Veilchen.", v2: "Herzförmige Blätter und schmale, hellviolette Blüten mit einem dunkelvioletten, geraden Sporn.", v3: "Eine der häufigsten Waldveilchenarten Mitteleuropas, oft nur an feinen Merkmalen vom Hain-Veilchen zu unterscheiden.", wiki: "https://de.wikipedia.org/wiki/Wald-Veilchen" },
            { id: "45/45", type: "Giftig", title: "Wald-Bingelkraut", latin: "Mercurialis perennis (Wolfsmilchgewächse)", v1: "Bildet dichte, teppichartige Bestände am Boden schattiger Laubwälder, blüht unscheinbar von März bis Mai.", v2: "Gegenständige, ovale Blätter und winzige, grünliche Blüten an dünnen Ähren, getrenntgeschlechtig auf verschiedenen Pflanzen.", v3: "Alle Pflanzenteile sind schwach giftig und riechen beim Zerreiben unangenehm nach ranzigem Fisch.", wiki: "https://de.wikipedia.org/wiki/Wald-Bingelkraut" }
        ],
        kueche: [
            { id: "01/45", type: "Essbar", title: "Bärlauch", latin: "Allium ursinum (Amaryllisgewächse)", v1: "Bevorzugt feuchte, schattige Laubwälder und wächst ab März in Teppichen.", v2: "Lanzettliche, intensiv nach Knoblauch duftende Blätter und kugelige weiße Doldenblüten.", v3: "Frisch zubereitet ein echter Genuss. Achtung beim Sammeln wegen der hochgiftigen Maiglöckchen!", wiki: "https://de.wikipedia.org/wiki/B%C3%A4rlauch" },
            { id: "02/45", type: "Essbar", title: "Giersch", latin: "Aegopodium podagraria (Doldenblütler)", v1: "Gilt in Gärten als hartnäckiges Unkraut, ist aber ein extrem vitaminreiches Wildgemüse.", v2: "Dreikantiger Stängel und dreigeteilte Blätter. Blüht weiß im Frühsommer.", v3: "Schmeckt roh in Salaten nach Petersilie und Sellerie, gekocht wie Spinat.", wiki: "https://de.wikipedia.org/wiki/Giersch" },
            { id: "03/45", type: "Essbar", title: "Große Brennnessel", latin: "Urtica dioica (Brennnesselgewächse)", v1: "Wächst auf stickstoffreichen Böden an Wegrändern, Schutthalden und in Gärten.", v2: "Gegenständige, grob gesägte Blätter mit Brennhaaren, die Ameisensäure enthalten.", v3: "Blätter getrocknet oder gewalzt brennen nicht mehr. Reich an Eisen und extrem schmackhaft.", wiki: "https://de.wikipedia.org/wiki/Gro%C3%9Fe_Brennnessel" },
            { id: "04/45", type: "Essbar / Gewürz", title: "Wegwarte", latin: "Cichorium intybus (Korbblütler)", v1: "Wächst an staubigen Wegrändern und auf trockenen Weiden ab dem Sommer.", v2: "Himmelblaue Blüten, die sich nur am Vormittag öffnen, und tiefe Pfahlwurzeln.", v3: "Die geröstete Wurzel diente früher als Kaffeeersatz ('Muckefuck'), junge Blätter als Salat.", wiki: "https://de.wikipedia.org/wiki/Gemeine_Wegwarte" },
            { id: "05/45", type: "Essbar", title: "Wiesen-Sauerampfer", latin: "Rumex acetosa (Knöterichgewächse)", v1: "Häufig auf nährstoffreichen Wiesen zu finden. Blüht rötlich ab Mai.", v2: "Pfeilförmige, saftig-grüne Blätter mit einem säuerlich-frischen Geschmack.", v3: "Enthält viel Vitamin C, aber auch Oxalsäure – daher in Maßen als Gewürz verzehren.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Sauerampfer" },
            { id: "06/45", type: "Essbar", title: "Brunnenkresse", latin: "Nasturtium officinale (Kreuzblütler)", v1: "Wächst ausschließlich an sauberen, fließenden Quellen und klaren Bächen.", v2: "Wintergrüne, gefiederte Blätter und weiße Blüten mit Senfölen.", v3: "Schmeckt herrlich scharf und erfrischend im Quark, darf aber wegen Parasitengefahr nur gewaschen werden.", wiki: "https://de.wikipedia.org/wiki/Echte_Brunnenkresse" },
            { id: "07/45", type: "Essbar", title: "Vogelmiere", latin: "Stellaria media (Nelkengewächse)", v1: "Wächst fast das ganze Jahr über kriechend auf Äckern und im Garten.", v2: "Kleine, eiförmige Blätter und winzige sternförmige weiße Blüten.", v3: "Schmeckt mild nach jungem Mais und ist eine hervorragende Vitaminquelle im Winter.", wiki: "https://de.wikipedia.org/wiki/Vogelmiere" },
            { id: "08/45", type: "Essbar", title: "Gänseblümchen", latin: "Bellis perennis (Korbblütler)", v1: "Der unermüdliche Dauerblüher auf fast jedem Rasen von Frühling bis Herbst.", v2: "Rosette aus spatelförmigen Blättern und ein behaarter Stängel mit weiß-rotem Blütenkopf.", v3: "Die Blütenknospen schmecken nussig und eingelegt wie Kapern, geöffnete Blüten dekorieren den Salat.", wiki: "https://de.wikipedia.org/wiki/G%C3%A4nsebl%C3%BCmchen" },
            { id: "09/45", type: "Essbar", title: "Wiesen-Labkraut", latin: "Galium album (Rötegewächse)", v1: "Überall auf mäßig trockenen Wiesen und an Wegrändern ab Juni zu sehen.", v2: "Vierkantiger Stängel mit quirlständigen Blättern und weißen Blütenwolken.", v3: "Die zarten Triebspitzen schmecken mild-salatig. Enthält das Labferment zum Käsen.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Labkraut" },
            { id: "10/45", type: "Essbar / Gewürz", title: "Beifuß", latin: "Artemisia vulgaris (Korbblütler)", v1: "Wächst mannshoch an Schuttplätzen und Wegrändern. Blüht unscheinbar gelblich-grau.", v2: "Blattoberseite dunkelgrün, Unterseite weißfilzig behaart und stark aromatisch duftend.", v3: "Eines der ältesten Gewürzkräuter für fette Speisen (Gänsebraten), da es die Verdauung fördert.", wiki: "https://de.wikipedia.org/wiki/Beifu%C3%9F" },
            { id: "11/45", type: "Essbar", title: "Wilde Möhre", latin: "Daucus carota (Doldenblütler)", v1: "Die Urform unserer Karotte wächst auf sonnigen Wiesen und an Wegrändern.", v2: "Weiße Doppeldolden mit einer charakteristischen, fast schwarzen 'Lockblüte' in der Mitte.", v3: "Die weiße Pfahlwurzel riecht intensiv nach Karotte und schmeckt im ersten Jahr süßlich.", wiki: "https://de.wikipedia.org/wiki/Wilde_M%C3%B6hre" },
            { id: "12/45", type: "Essbar", title: "Wild-Feldsalat (Ackersalat)", latin: "Valerianella locusta (Geißblattgewächse)", v1: "Wächst auf Äckern, Brachflächen und in Gärten, meist von Herbst bis zum zeitigen Frühjahr.", v2: "Kleine, löffelförmige, rosettenartig angeordnete Blätter und winzige, blassblaue Blüten im späten Frühjahr.", v3: "Die Wildform unseres Feldsalats schmeckt intensiver und nussiger als gezüchtete Sorten.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnlicher_Feldsalat" },
            { id: "13/45", type: "Essbar", title: "Portulak", latin: "Portulaca oleracea (Portulakgewächse)", v1: "Wächst auf sandigen, warmen Äckern, in Gärten und Pflasterritzen, oft als hartnäckiges Unkraut.", v2: "Fleischige, spatelförmige Blätter an kriechenden, rötlichen Stängeln und winzige gelbe Blüten.", v3: "Reich an Omega-3-Fettsäuren, schmeckt leicht säuerlich-salzig und wird roh oder gedünstet gegessen.", wiki: "https://de.wikipedia.org/wiki/Portulak" },
            { id: "14/45", type: "Essbar", title: "Franzosenkraut", latin: "Galinsoga parviflora (Korbblütler)", v1: "Ursprünglich aus Südamerika eingewandert, wächst es heute auf Äckern und in Gärten fast überall.", v2: "Eiförmige, gezähnte Blätter und winzige, weiß-gelbe Blütenköpfchen mit nur wenigen Zungenblüten.", v3: "Schmeckt mild-nussig und wird in Südamerika und zunehmend auch bei uns als Wildgemüse geschätzt.", wiki: "https://de.wikipedia.org/wiki/Kleinbl%C3%BCtiges_Knopfkraut" },
            { id: "15/45", type: "Essbar / Gewürz", title: "Wilder Meerrettich", latin: "Armoracia rusticana (Kreuzblütler)", v1: "Wächst verwildert an Wegrändern, Gräben und auf Brachflächen, ursprünglich aus Osteuropa eingeführt.", v2: "Große, langgestielte, ledrige Grundblätter und lockere, weiße Blütenrispen im Frühsommer.", v3: "Die scharfe Wurzel enthält Senföle und wird traditionell zu Meerrettichsauce verarbeitet.", wiki: "https://de.wikipedia.org/wiki/Meerrettich" },
            { id: "16/45", type: "Essbar", title: "Guter Heinrich", latin: "Chenopodium bonus-henricus (Fuchsschwanzgewächse)", v1: "Wächst an Dorfrändern, Misthaufen und nährstoffreichen Wegrändern, wird aber immer seltener.", v2: "Pfeilförmige, mehlig bestäubte Blätter und unscheinbare, grünliche Blütenähren.", v3: "Ein traditionelles Wildgemüse, das wie Spinat zubereitet wird – daher auch 'Wilder Spinat' genannt.", wiki: "https://de.wikipedia.org/wiki/Guter_Heinrich" },
            { id: "17/45", type: "Essbar", title: "Weißer Gänsefuß (Melde)", latin: "Chenopodium album (Fuchsschwanzgewächse)", v1: "Wächst auf Äckern, Schuttplätzen und in Gärten, eines der häufigsten Ackerunkräuter überhaupt.", v2: "Rautenförmige, mehlig-weiß bestäubte Blätter und unscheinbare, grünliche Blütenknäuel.", v3: "War schon in der Steinzeit ein wichtiges Nahrungsmittel und schmeckt spinatähnlich.", wiki: "https://de.wikipedia.org/wiki/Wei%C3%9Fer_G%C3%A4nsefu%C3%9F" },
            { id: "18/45", type: "Essbar", title: "Hopfen", latin: "Humulus lupulus (Hanfgewächse)", v1: "Rankt an Hecken, Ufergebüschen und Zäunen, wird zudem gezielt in Hopfengärten kultiviert.", v2: "Raue, meist dreilappige Blätter und die charakteristischen, zapfenartigen weiblichen Blütenstände (Dolden).", v3: "Die jungen Frühjahrstriebe ('Hopfenspargel') gelten als seltene Delikatesse, die Dolden würzen und konservieren Bier.", wiki: "https://de.wikipedia.org/wiki/Hopfen" },
            { id: "19/45", type: "Essbar", title: "Breitblättriger Rohrkolben", latin: "Typha latifolia (Rohrkolbengewächse)", v1: "Wächst in dichten Beständen an Teich-, See- und Grabenufern in flachem Wasser.", v2: "Lange, schwertförmige Blätter und der unverwechselbare, samtbraune, walzenförmige Blütenkolben.", v3: "Die jungen weißen Sprossbasen ('Wasserspargel') und der stärkereiche Wurzelstock sind essbar.", wiki: "https://de.wikipedia.org/wiki/Breitbl%C3%A4ttriger_Rohrkolben" },
            { id: "20/45", type: "Essbar", title: "Kleiner Sauerampfer", latin: "Rumex acetosella (Knöterichgewächse)", v1: "Wächst auf sauren, mageren Sandböden, Äckern und trockenen Wegrändern.", v2: "Kleine, pfeilförmige Blätter mit charakteristischen, abstehenden Basisecken und rötliche Blütenrispen.", v3: "Schmeckt noch intensiver säuerlich als der Wiesen-Sauerampfer, enthält aber ebenfalls viel Oxalsäure.", wiki: "https://de.wikipedia.org/wiki/Kleiner_Sauerampfer" },
            { id: "21/45", type: "Essbar", title: "Wiesen-Löwenzahn (Küche)", latin: "Taraxacum officinale (Korbblütler)", v1: "Der Klassiker unter den Wildsalaten, leuchtet ab April massenhaft gelb auf fast allen Wiesen.", v2: "Tief gezähnte Blätter in einer Rosette und hohle Stängel mit weißem Milchsaft.", v3: "Blätter, Blüten und Wurzel sind vollständig essbar – aus den Knospen lässt sich sogar ein 'falscher Kapernersatz' einlegen.", wiki: "https://de.wikipedia.org/wiki/L%C3%B6wenzahn_(Formenkreis)" },
            { id: "22/45", type: "Essbar", title: "Winterportulak (Tellerkraut)", latin: "Claytonia perfoliata (Portulakgewächse)", v1: "Ursprünglich aus Nordamerika stammend, hat es sich in Gärten und auf sandigen Böden eingebürgert.", v2: "Auffällig runde, den Stängel umschließende Hüllblätter, aus deren Mitte kleine weiße Blüten wachsen.", v3: "Ein mildes, spinatähnliches Wintersalatkraut, das auch bei Frost noch geerntet werden kann.", wiki: "https://de.wikipedia.org/wiki/Kubanischer_Portulak" },
            { id: "23/45", type: "Essbar", title: "Rapunzel-Glockenblume", latin: "Campanula rapunculus (Glockenblumengewächse)", v1: "Wächst an trockenen Wegrändern, Waldsäumen und auf Wiesen, wurde früher gezielt als Gemüse angebaut.", v2: "Schmale, wechselständige Blätter und blassviolette, glockenförmige Blüten in lockeren Trauben.", v3: "Die rübenartige Wurzel und die jungen Blätter schmecken mild nussig und wurden früher wie Rapunzel gegessen.", wiki: "https://de.wikipedia.org/wiki/Rapunzel-Glockenblume" },
            { id: "24/45", type: "Essbar (junge Blätter)", title: "Klatschmohn", latin: "Papaver rhoeas (Mohngewächse)", v1: "Leuchtet ab Mai in dichten roten Teppichen auf Äckern, Brachflächen und Wegrändern.", v2: "Fein gefiederte Blätter und die unverwechselbaren, leuchtend roten, oft schwarz gefleckten Blüten.", v3: "Nur die jungen, gekochten Blätter sind unbedenklich essbar; der milchige Saft älterer Pflanzenteile enthält schwach wirksame Alkaloide.", wiki: "https://de.wikipedia.org/wiki/Klatschmohn" },
            { id: "25/45", type: "Essbar (in Maßen)", title: "Wald-Ziest", latin: "Stachys sylvatica (Lippenblütler)", v1: "Wächst in schattigen, feuchten Wäldern und an Hecken, oft mit unangenehmem Geruch beim Zerreiben.", v2: "Herzförmige, grob gesägte Blätter und dunkelrote Lippenblüten in Scheinquirlen.", v3: "Die jungen Triebspitzen wurden früher trotz des Geruchs als Wildgemüse genutzt.", wiki: "https://de.wikipedia.org/wiki/Wald-Ziest" },
            { id: "26/45", type: "Essbar (Vorsicht Verwechslung)", title: "Wiesenkerbel", latin: "Anthriscus sylvestris (Doldenblütler)", v1: "Eine der ersten hochwachsenden Doldenblütler-Arten an Wegrändern und Wiesen im Frühjahr.", v2: "Fein gefiederte, an Petersilie erinnernde Blätter und weiße Doppeldolden.", v3: "Schmeckt mild-würzig, ähnelt aber gefährlich giftigen Doldenblütlern – nur mit sicherer Artenkenntnis sammeln!", wiki: "https://de.wikipedia.org/wiki/Wiesen-Kerbel" },
            { id: "27/45", type: "Essbar", title: "Wiesen-Pippau", latin: "Crepis biennis (Korbblütler)", v1: "Wächst häufig auf nährstoffreichen Wiesen und an Wegrändern, blüht leuchtend gelb ab Mai.", v2: "Grundständige, buchtig gezähnte Blätter und lockere Rispen aus kleinen, löwenzahnähnlichen Blütenköpfen.", v3: "Die jungen Blätter schmecken mild-bitter und lassen sich wie Löwenzahn im Salat verwenden.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Pippau" },
            { id: "28/45", type: "Essbar", title: "Schmalblättrige Rauke (Wilde Rucola)", latin: "Diplotaxis tenuifolia (Kreuzblütler)", v1: "Wächst an Bahndämmen, Mauerritzen und trockenen Wegrändern, oft aus Gärten verwildert.", v2: "Schmale, tief gezähnte Blätter mit intensiv scharfem Geruch und kleine, gelbe Kreuzblüten.", v3: "Schmeckt noch würziger und schärfer als kultivierte Rucola und ist ein beliebtes Wildsalatkraut.", wiki: "https://de.wikipedia.org/wiki/Schmalbl%C3%A4ttrige_Rauke" },
            { id: "29/45", type: "Essbar (jung)", title: "Stumpfblättriger Ampfer", latin: "Rumex obtusifolius (Knöterichgewächse)", v1: "Wächst auf nährstoffreichen Wiesen, Weiden und an Wegrändern, gilt als hartnäckiges Weideunkraut.", v2: "Große, breit-ovale Blätter mit herzförmiger Basis und rötlich-braune, hängende Blütenrispen.", v3: "Nur die ganz jungen Blätter schmecken mild-säuerlich; ältere Blätter werden schnell bitter und zäh.", wiki: "https://de.wikipedia.org/wiki/Stumpfbl%C3%A4ttriger_Ampfer" },
            { id: "30/45", type: "Essbar", title: "Schlangen-Knöterich", latin: "Bistorta officinalis (Knöterichgewächse)", v1: "Wächst auf feuchten Bergwiesen und an Bachrändern, blüht rosa im Frühsommer.", v2: "Wellig berandete, lanzettliche Blätter und dichte, walzenförmige rosa Blütenähren.", v3: "Die jungen Blätter wurden traditionell zu österlichem 'Osterspinat' verarbeitet, der Wurzelstock ist gerbstoffreich.", wiki: "https://de.wikipedia.org/wiki/Schlangen-Kn%C3%B6terich" },
            { id: "31/45", type: "Essbar", title: "Vogelknöterich", latin: "Polygonum aviculare (Knöterichgewächse)", v1: "Wächst niederliegend auf Trittrasen, Wegen und Pflasterritzen, äußerst anspruchslos.", v2: "Kleine, schmale Blätter an verzweigten, knotigen Stängeln mit winzigen, weiß-rosa Blüten in den Blattachseln.", v3: "Die jungen Triebe schmecken mild und wurden früher in Notzeiten als Wildgemüse genutzt.", wiki: "https://de.wikipedia.org/wiki/Vogel-Kn%C3%B6terich" },
            { id: "32/45", type: "Essbar", title: "Weiß-Klee", latin: "Trifolium repens (Hülsenfrüchtler)", v1: "Wächst kriechend auf fast jedem Rasen, jeder Weide und Wiese Mitteleuropas.", v2: "Dreizählige Blätter mit hellem V-Fleck und kugelige, weiße Blütenköpfe an langen Stielen.", v3: "Blüten und junge Blätter schmecken mild-süßlich und eignen sich als essbare Salatdekoration.", wiki: "https://de.wikipedia.org/wiki/Wei%C3%9F-Klee" },
            { id: "33/45", type: "Essbar", title: "Rot-Klee (Küche)", latin: "Trifolium pratense (Hülsenfrüchtler)", v1: "Wächst auf fast allen Wiesen und Weiden und verbessert durch Stickstoffbindung die Bodenqualität.", v2: "Dreizählige Blätter mit heller V-Zeichnung und kugelige, rote Blütenköpfe.", v3: "Die süßen Blütenröhren können ausgesaugt werden, die getrockneten Blüten ergeben einen milden Tee.", wiki: "https://de.wikipedia.org/wiki/Rot-Klee" },
            { id: "34/45", type: "Essbar (nicht verwechseln!)", title: "Wiesen-Bärenklau", latin: "Heracleum sphondylium (Doldenblütler)", v1: "Wächst häufig auf Wiesen, an Wegrändern und Waldsäumen – nicht zu verwechseln mit dem giftigen Riesen-Bärenklau.", v2: "Große, grob gefiederte Blätter und weiße bis grünliche Doldenblüten an kantigen, behaarten Stängeln.", v3: "Junge Blätter, Stängel und Samen schmecken würzig-nussig, roher Hautkontakt kann bei Sonne dennoch reizen.", wiki: "https://de.wikipedia.org/wiki/Wiesen-B%C3%A4renklau" },
            { id: "35/45", type: "Essbar", title: "Wilde Pastinake", latin: "Pastinaca sativa (Doldenblütler)", v1: "Wächst an sonnigen Wegrändern und auf Trockenrasen, ist die Wildform unserer Kulturpastinake.", v2: "Gefiederte Blätter und gelbe Doppeldolden, deutlich kleiner und dünner als die Zuchtform.", v3: "Die aromatische Wurzel schmeckt süßlich-nussig, der Kontakt mit Blattsaft kann bei Sonneneinstrahlung die Haut reizen.", wiki: "https://de.wikipedia.org/wiki/Pastinak" },
            { id: "36/45", type: "Essbar", title: "Holunderblüten (Schwarzer Holunder)", latin: "Sambucus nigra (Moschuskrautgewächse)", v1: "Der bekannte Strauch blüht im Frühsommer mit großen, duftenden weißen Schirmdolden.", v2: "Gefiederte Blätter und breite, flache Blütendolden mit unzähligen kleinen, cremeweißen Einzelblüten.", v3: "Die Blüten ergeben in Teig gebacken 'Holunderküchle' oder eingelegt den beliebten Holunderblütensirup.", wiki: "https://de.wikipedia.org/wiki/Schwarzer_Holunder" },
            { id: "37/45", type: "Essbar / Gewürz", title: "Quendel (Sand-Thymian)", latin: "Thymus serpyllum (Lippenblütler)", v1: "Wächst niederliegend auf trockenen Sandböden, Dünen und Heideflächen.", v2: "Winzige, ovale Blättchen an kriechenden Trieben und rosa-violette Blütenköpfchen.", v3: "Milder im Aroma als der Feld-Thymian, wird traditionell als Tee und Gewürz für deftige Speisen genutzt.", wiki: "https://de.wikipedia.org/wiki/Sand-Thymian" },
            { id: "38/45", type: "Essbar / Gewürz", title: "Kleine Bibernelle", latin: "Pimpinella saxifraga (Doldenblütler)", v1: "Wächst auf trockenen Magerwiesen und Kalkmagerrasen, blüht weiß im Sommer.", v2: "Unpaarig gefiederte Grundblätter und feine, filigrane Stängelblätter mit lockeren weißen Dolden.", v3: "Die würzige Wurzel wurde traditionell zum Aromatisieren von Kräuterschnäpsen genutzt.", wiki: "https://de.wikipedia.org/wiki/Kleine_Bibernelle" },
            { id: "39/45", type: "Essbar", title: "Gewöhnliche Nachtkerze", latin: "Oenothera biennis (Nachtkerzengewächse)", v1: "Wächst auf Bahndämmen, Sandböden und Brachflächen, ursprünglich aus Nordamerika eingewandert.", v2: "Lanzettliche Blätter in einer Rosette im ersten Jahr, im zweiten Jahr große, gelbe Blüten, die abends aufblühen.", v3: "Die rübenartige Wurzel ('Schinkenwurzel') schmeckt leicht scharf und wurde traditionell wie Wurzelgemüse zubereitet.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliche_Nachtkerze" },
            { id: "40/45", type: "Essbar (Blüten)", title: "Wiesen-Flockenblume", latin: "Centaurea jacea (Korbblütler)", v1: "Wächst auf mageren bis mittelfetten Wiesen und blüht von Juni bis in den Herbst hinein.", v2: "Schmale, ungeteilte Blätter und purpurrote Blütenköpfe mit trockenhäutigen, braunen Hüllblatträndern.", v3: "Die Blütenblätter schmecken mild und dienen vor allem als essbare, farbenfrohe Salatdekoration.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Flockenblume" },
            { id: "41/45", type: "Essbar", title: "Duftveilchen (Küche)", latin: "Viola odorata (Veilchengewächse)", v1: "Wächst an Hecken und Gartenrändern, blüht schon ab März intensiv duftend.", v2: "Herzförmige Blätter und dunkelviolette, stark duftende Blüten mit kurzem Sporn.", v3: "Die Blüten werden traditionell kandiert oder zu Sirup verarbeitet und schmücken Frühlingsdesserts.", wiki: "https://de.wikipedia.org/wiki/Duft-Veilchen" },
            { id: "42/45", type: "Essbar", title: "Wald-Sauerklee (Küche)", latin: "Oxalis acetosella (Sauerkleegewächse)", v1: "Wächst an schattigen, moosigen Stellen in Nadel- und Laubwäldern.", v2: "Kleeblattartige, dreizählige Blätter, die sich nachts einklappen, und zarte weiß-violett geäderte Blüten.", v3: "Schmeckt angenehm zitronig-säuerlich, sollte wegen der Oxalsäure aber nur in kleinen Mengen genascht werden.", wiki: "https://de.wikipedia.org/wiki/Wald-Sauerklee" },
            { id: "43/45", type: "Essbar / Aroma", title: "Waldmeister (Küche)", latin: "Galium odoratum (Rötegewächse)", v1: "Bildet Teppiche in schattigen Buchenwäldern und blüht weiß von April bis Juni.", v2: "Schmale Blätter in Quirlen am vierkantigen Stängel und winzige, weiße Sternblüten.", v3: "Das typische Cumarin-Aroma entfaltet sich erst beim Anwelken – klassische Zutat der Maibowle.", wiki: "https://de.wikipedia.org/wiki/Waldmeister" },
            { id: "44/45", type: "Essbar", title: "Hundsrose (Hagebutte)", latin: "Rosa canina (Rosengewächse)", v1: "Wächst an Waldrändern, Hecken und sonnigen Hängen, blüht zartrosa im Juni.", v2: "Gefiederte Blätter mit kleinen Stacheln und im Herbst leuchtend rote, ovale Hagebutten.", v3: "Die vitaminreichen Hagebutten ergeben Mus, Tee und Marmelade – die feinen Kerne müssen vorher entfernt werden.", wiki: "https://de.wikipedia.org/wiki/Hunds-Rose" },
            { id: "45/45", type: "Essbar", title: "Wald-Erdbeere (Küche)", latin: "Fragaria vesca (Rosengewächse)", v1: "Wächst an lichten Waldrändern, Böschungen und Lichtungen, blüht weiß von April bis Juni.", v2: "Dreizählige, gezähnte Blätter und kleine weiße Blüten, gefolgt von den winzigen, intensiv süß-aromatischen Früchten.", v3: "Gilt als eine der aromatischsten heimischen Wildfrüchte – deutlich süßer als jede Kultursorte.", wiki: "https://de.wikipedia.org/wiki/Wald-Erdbeere" }
        ],
        heilkraeuter: [
            { id: "01/45", type: "Heilkraut", title: "Spitzwegerich", latin: "Plantago lanceolata (Wegerichgewächse)", v1: "Wächst auf mageren bis nährstoffreichen Wiesen, Wegrändern und in Gärten – eine der häufigsten Heilpflanzen überhaupt.", v2: "Schmale, lanzettliche Blätter mit parallelen Blattadern in einer Rosette; walzenförmige Ährenblüten an langen, kantigen Stielen.", v3: "Der frisch gepresste Saft lindert sofort Insektenstiche und kleine Wunden. Enthält Schleim- und Gerbstoffe, die reizlindernd bei Husten wirken.", wiki: "https://de.wikipedia.org/wiki/Spitzwegerich" },
            { id: "02/45", type: "Heilkraut", title: "Echte Kamille", latin: "Matricaria chamomilla (Korbblütler)", v1: "Wächst auf Äckern, Schuttplätzen und an Wegrändern, blüht von Mai bis September.", v2: "Fein gefiederte Blätter und weiß-gelbe Blütenköpfe mit hohlem, kegelförmigem Blütenboden – ein sicheres Unterscheidungsmerkmal zu ähnlichen Korbblütlern.", v3: "Das ätherische Öl wirkt entzündungshemmend, krampflösend und antibakteriell – klassisch als Tee, Dampfbad oder Salbe.", wiki: "https://de.wikipedia.org/wiki/Echte_Kamille" },
            { id: "03/45", type: "Heilkraut", title: "Echtes Johanniskraut", latin: "Hypericum perforatum (Johanniskrautgewächse)", v1: "Liebt sonnige Wegränder, Waldsäume und trockene Wiesen, blüht rund um die Sommersonnenwende (Johannistag).", v2: "Die Blätter zeigen im Gegenlicht winzige, durchscheinende Öldrüsen wie kleine Löcher. Zerreibt man die gelben Blüten zwischen den Fingern, färben sie sich blutrot.", v3: "Bekannt als pflanzliches Stimmungsaufhellermittel bei leichten Verstimmungen; das rote Öl (Rotöl) wird äußerlich bei Verbrennungen und Prellungen angewendet.", wiki: "https://de.wikipedia.org/wiki/Echtes_Johanniskraut" },
            { id: "04/45", type: "Heilkraut", title: "Schafgarbe", latin: "Achillea millefolium (Korbblütler)", v1: "Wächst genügsam auf Wiesen, Weiden und Wegrändern nahezu überall in Mitteleuropa.", v2: "Das Laub ist tausendfach feingefiedert, daher der lateinische Beiname 'millefolium'. Die weiß-rosa Blüten stehen in flachen Schirmrispen.", v3: "Enthält ätherische Öle und Bitterstoffe, die krampflösend auf die Verdauung wirken; früher als Wundkraut für Soldaten genutzt (Beiname nach dem Sagenhelden Achilles).", wiki: "https://de.wikipedia.org/wiki/Gemeine_Schafgarbe" },
            { id: "05/45", type: "Heilkraut", title: "Breitwegerich", latin: "Plantago major (Wegerichgewächse)", v1: "Ein anspruchsloser Überlebenskünstler auf festgetretenen Wegen, Höfen und Pflasterritzen.", v2: "Breite, eiförmige Blätter mit auffälligen Längsnerven wachsen in einer flachen Rosette dicht über dem Boden.", v3: "Frische Blätter wurden traditionell als natürliches Pflaster auf Wunden und Blasen gelegt, da sie kühlend und leicht desinfizierend wirken.", wiki: "https://de.wikipedia.org/wiki/Breitwegerich" },
            { id: "06/45", type: "Heilkraut", title: "Gemeine Wegwarte", latin: "Cichorium intybus (Korbblütler)", v1: "Wächst an trockenen Wegrändern und Böschungen und ist Namensgeberin für die Zichorie.", v2: "Die leuchtend himmelblauen Blüten öffnen sich nur bei Sonnenschein am Vormittag und schließen sich mittags wieder.", v3: "Wurzel und Blätter enthalten Bitterstoffe und Inulin, die die Verdauung sanft anregen; geröstet diente die Wurzel früher als Kaffee-Ersatz.", wiki: "https://de.wikipedia.org/wiki/Gemeine_Wegwarte" },
            { id: "07/45", type: "Heilkraut", title: "Wiesen-Steinklee", latin: "Melilotus officinalis (Hülsenfrüchtler)", v1: "Besiedelt trockene Wegränder, Bahndämme und Brachflächen, blüht gelb im Hochsommer.", v2: "Dreizählige Blätter und lange, lockere Blütentrauben, die beim Trocknen intensiv nach frischem Heu duften.", v3: "Der Inhaltsstoff Cumarin stärkt die Venenwände und wird traditionell bei schweren Beinen und Krampfadern eingesetzt.", wiki: "https://de.wikipedia.org/wiki/Gelber_Steinklee" },
            { id: "08/45", type: "Heilkraut", title: "Echte Nelkenwurz", latin: "Geum urbanum (Rosengewächse)", v1: "Wächst in schattigen Gärten, an Hecken und Waldrändern, oft übersehen als 'Unkraut'.", v2: "Kleine, fünfblättrige gelbe Blüten und gefiederte Blätter; die Früchte tragen winzige Widerhaken, die sich in Fell und Kleidung verhaken.", v3: "Der Wurzelstock duftet intensiv nach Gewürznelken (Eugenol) und wirkt entzündungshemmend, etwa bei Zahnfleisch- und Halsbeschwerden.", wiki: "https://de.wikipedia.org/wiki/Echte_Nelkenwurz" },
            { id: "09/45", type: "Heilkraut", title: "Zinnkraut (Acker-Schachtelhalm)", latin: "Equisetum arvense (Schachtelhalmgewächse)", v1: "Wächst auf lehmigen Äckern, Wegrändern und Böschungen – ein lebendes Relikt aus dem Erdaltertum.", v2: "Im Frühjahr erscheinen zunächst bräunliche Sporentriebe, später die grünen, quirlig verzweigten 'Tannenwedel'-Sommertriebe.", v3: "Extrem reich an Kieselsäure – stärkt traditionell Bindegewebe, Haare, Nägel und wird bei Nierenbeschwerden als Tee genutzt.", wiki: "https://de.wikipedia.org/wiki/Acker-Schachtelhalm" },
            { id: "10/45", type: "Heilkraut", title: "Wiesen-Salbei", latin: "Salvia pratensis (Lippenblütler)", v1: "Bevorzugt kalkreiche, sonnige Magerwiesen und blüht ab Mai in kräftigem Violett.", v2: "Gekerbte, runzelige Blätter und große Lippenblüten mit einem raffinierten Hebelmechanismus, der Bienen beim Landen mit Pollen bestäubt.", v3: "Wirkt milder als der Gartensalbei, hilft aber ebenfalls bei Halsschmerzen und übermäßigem Schwitzen.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Salbei" },
            { id: "11/45", type: "Heilkraut", title: "Hirtentäschel", latin: "Capsella bursa-pastoris (Kreuzblütler)", v1: "Ein genügsamer Dauerblüher auf Äckern, in Gärten und auf Schuttplätzen – blüht fast das ganze Jahr.", v2: "Unscheinbare weiße Blüten und die charakteristischen, herzförmig-dreieckigen Samenschötchen, die an kleine Hirtentaschen erinnern.", v3: "Traditionell zur Blutstillung bei leichten Blutungen genutzt und zur sanften Unterstützung des Kreislaufs.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliches_Hirtent%C3%A4schelkraut" },
            { id: "12/45", type: "Heilkraut", title: "Echter Baldrian", latin: "Valeriana officinalis (Geißblattgewächse)", v1: "Wächst an feuchten Wiesen, Gräben und Waldrändern, blüht rosa-weiß von Juni bis August.", v2: "Gefiederte Blätter und doldenartige, süßlich duftende Blütenrispen an hohlen, kantigen Stängeln.", v3: "Die Wurzel riecht streng, wirkt aber beruhigend auf die Nerven und wird traditionell bei Einschlafproblemen als Tee oder Tinktur verwendet.", wiki: "https://de.wikipedia.org/wiki/Echter_Baldrian" },
            { id: "13/45", type: "Heilkraut", title: "Frauenmantel", latin: "Alchemilla vulgaris (Rosengewächse)", v1: "Wächst auf feuchten Wiesen, an Wegrändern und in Gärten, besonders in höheren Lagen häufig.", v2: "Rundliche, gefaltete Blätter, an deren Rand sich morgens glitzernde Tautropfen sammeln – daher der Name 'Löwentröpfchen' im Volksmund.", v3: "Enthält Gerbstoffe und wird traditionell als mildes Frauenkraut bei Regelbeschwerden geschätzt.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnlicher_Frauenmantel" },
            { id: "14/45", type: "Heilkraut", title: "Kleiner Odermennig", latin: "Agrimonia eupatoria (Rosengewächse)", v1: "Wächst an sonnigen Wegrändern, Waldsäumen und auf Trockenrasen.", v2: "Gefiederte, unterseits silbrig behaarte Blätter und schlanke, gelbe Blütenähren, die im Herbst klettende Kletten bilden.", v3: "Enthält viele Gerbstoffe und wirkt zusammenziehend – klassisch als Gurgeltee bei Halsschmerzen und leichten Entzündungen.", wiki: "https://de.wikipedia.org/wiki/Kleiner_Odermennig" },
            { id: "15/45", type: "Heilkraut", title: "Weiße Taubnessel", latin: "Lamium album (Lippenblütler)", v1: "Wächst an Wegrändern, Zäunen und Schuttplätzen, oft mit der Brennnessel verwechselt.", v2: "Brennnesselähnliche Blätter, die aber nicht brennen, und weiße, lippenförmige Blüten in Blattachsel-Quirlen.", v3: "Die Blüten schmecken süßlich nektarreich und wirken mild adstringierend bei Frauenbeschwerden und Halsentzündungen.", wiki: "https://de.wikipedia.org/wiki/Wei%C3%9Fe_Taubnessel" },
            { id: "16/45", type: "Heilkraut", title: "Kleinblütige Königskerze", latin: "Verbascum densiflorum (Braunwurzgewächse)", v1: "Wächst auf trockenen Schuttplätzen, Böschungen und Wegrändern, wird bis zu zwei Meter hoch.", v2: "Dicht filzig-wollig behaarte, große Blätter und eine imposante Blütenkerze mit leuchtend gelben Blüten.", v3: "Die Blüten enthalten Schleimstoffe und werden als reizlindernder Hustentee verwendet.", wiki: "https://de.wikipedia.org/wiki/Kleinbl%C3%BCtige_K%C3%B6nigskerze" },
            { id: "17/45", type: "Heilkraut", title: "Feld-Thymian", latin: "Thymus pulegioides (Lippenblütler)", v1: "Wächst auf trockenen, sonnigen Wiesen, Heiden und Dünen – der wilde Verwandte des Gartenthymians.", v2: "Kleine, ovale, stark aromatisch duftende Blätter und rosa-violette Blütenquirle an niederliegenden Stängeln.", v3: "Das ätherische Öl (Thymol) wirkt antibakteriell und krampflösend, klassisch bei Husten und Erkältung.", wiki: "https://de.wikipedia.org/wiki/Arznei-Thymian" },
            { id: "18/45", type: "Heilkraut", title: "Gewöhnlicher Dost", latin: "Origanum vulgare (Lippenblütler)", v1: "Wächst auf trockenen Kalkmagerrasen und Waldrändern, blüht rosa-purpur im Hochsommer.", v2: "Gegenständige, ovale Blätter und dichte, doldenartige Blütenstände, die intensiv würzig duften.", v3: "Nahe verwandt mit dem Gewürz-Oregano, wirkt appetitanregend und leicht krampflösend bei Verdauungsbeschwerden.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnlicher_Dost" },
            { id: "19/45", type: "Heilkraut", title: "Echtes Eisenkraut", latin: "Verbena officinalis (Eisenkrautgewächse)", v1: "Wächst an trockenen Wegrändern, Mauern und Schuttplätzen, blüht unscheinbar von Juni bis Oktober.", v2: "Vierkantiger, sparsam beblätterter Stängel mit winzigen, blassvioletten Blüten in dünnen Ähren.", v3: "Galt schon in der Antike als heiliges Kraut; wird traditionell bei nervöser Erschöpfung als mildes Beruhigungskraut genutzt.", wiki: "https://de.wikipedia.org/wiki/Echtes_Eisenkraut" },
            { id: "20/45", type: "Heilkraut", title: "Echtes Tausendgüldenkraut", latin: "Centaurium erythraea (Enziangewächse)", v1: "Wächst auf trockenen Wiesen, lichten Wäldern und Dünen, ist regional gefährdet.", v2: "Gegenständige, rosettenartig angeordnete Blätter und leuchtend rosa Sternblüten in Trugdolden.", v3: "Eines der bittersten heimischen Kräuter – regt als Tee Appetit und Verdauung an.", wiki: "https://de.wikipedia.org/wiki/Echtes_Tausendg%C3%BCldenkraut" },
            { id: "21/45", type: "Heilkraut", title: "Echte Bärentraube", latin: "Arctostaphylos uva-ursi (Heidekrautgewächse)", v1: "Wächst als niedriger Zwergstrauch in lichten Kiefernwäldern und auf Heideflächen, vor allem im Gebirge.", v2: "Immergrüne, lederartig glänzende Blätter und kleine, krugförmige rosa-weiße Blüten, gefolgt von roten Beeren.", v3: "Die Blätter enthalten Arbutin und wurden traditionell bei leichten Blasenbeschwerden als Tee genutzt.", wiki: "https://de.wikipedia.org/wiki/Echte_B%C3%A4rentraube" },
            { id: "22/45", type: "Heilkraut", title: "Echter Ehrenpreis", latin: "Veronica officinalis (Wegerichgewächse)", v1: "Wächst kriechend auf trockenen Wiesen, Heiden und in lichten Wäldern.", v2: "Behaarte, gegenständige Blätter und kleine, blasslila Blüten in aufrechten Seitentrauben.", v3: "Galt früher als vielseitiges 'Allheilkraut' bei Husten und Hautunreinheiten – daher der Name Ehrenpreis.", wiki: "https://de.wikipedia.org/wiki/Echter_Ehrenpreis" },
            { id: "23/45", type: "Heilkraut", title: "Stinkender Storchschnabel", latin: "Geranium robertianum (Storchschnabelgewächse)", v1: "Wächst in schattigen Gärten, an Mauern und Waldrändern, oft in Gesellschaft von Brennnesseln.", v2: "Fein zerteilte, rötlich überlaufene Blätter und kleine, pinkfarbene Blüten mit einem unangenehmen, moschusartigen Geruch beim Zerreiben.", v3: "Wirkt adstringierend und wurde traditionell äußerlich bei kleinen Wunden und Hautreizungen aufgelegt.", wiki: "https://de.wikipedia.org/wiki/Stinkender_Storchschnabel" },
            { id: "24/45", type: "Heilkraut", title: "Wermut", latin: "Artemisia absinthium (Korbblütler)", v1: "Wächst auf trockenen Schuttplätzen und sonnigen Wegrändern, oft verwildert aus alten Gärten.", v2: "Silbrig-graue, fein zerteilte Blätter mit intensiv bitterem Geruch und unscheinbare, gelbliche Blütenköpfchen.", v3: "Eines der bittersten Kräuter überhaupt – regt Magensaft und Verdauung an, bekannt als Zutat des Absinths.", wiki: "https://de.wikipedia.org/wiki/Wermut_(Pflanze)" },
            { id: "25/45", type: "Heilkraut", title: "Gewöhnlicher Andorn", latin: "Marrubium vulgare (Lippenblütler)", v1: "Wächst an trockenen, nährstoffreichen Wegrändern und Schuttplätzen, ist regional selten geworden.", v2: "Filzig-weiß behaarte, runzelige Blätter und weiße Lippenblüten in dichten Blattachsel-Quirlen.", v3: "Die Bitterstoffe fördern die Schleimlösung und werden traditionell bei hartnäckigem Husten geschätzt.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnlicher_Andorn" },
            { id: "26/45", type: "Heilkraut / Giftig", title: "Efeu", latin: "Hedera helix (Efeugewächse)", v1: "Rankt kletternd an Bäumen, Mauern und am Waldboden, bleibt auch im Winter grün.", v2: "Junge Blätter sind gelappt, ältere Blätter an blühenden Trieben oval-rautenförmig; im Herbst erscheinen kugelige, gelbgrüne Blütendolden.", v3: "Extrakte aus den Blättern wirken schleimlösend bei Husten, werden aber ausschließlich als Fertigpräparat genutzt – die Beeren sind giftig!", wiki: "https://de.wikipedia.org/wiki/Efeu" },
            { id: "27/45", type: "Heilkraut / Giftig", title: "Weißbeerige Mistel", latin: "Viscum album (Sandelholzgewächse)", v1: "Wächst als Halbschmarotzer in den Kronen von Laub- und Nadelbäumen, meist gut sichtbar im Winter.", v2: "Kugelige, immergrüne Büsche mit gabelig verzweigten Zweigen, ledrigen Blättern und weißen, klebrigen Beeren.", v3: "In der Volksmedizin und modernen Forschung wird die Mistel bei verschiedenen Beschwerden untersucht; die Beeren sind für Menschen giftig.", wiki: "https://de.wikipedia.org/wiki/Wei%C3%9Fbeerige_Mistel" },
            { id: "28/45", type: "Heilkraut", title: "Gewöhnlicher Wacholder", latin: "Juniperus communis (Zypressengewächse)", v1: "Wächst als genügsamer Nadelstrauch auf Heiden, Trockenrasen und in lichten Kiefernwäldern.", v2: "Stachelig-spitze, nadelförmige Blätter zu dritt am Zweig und blauschwarze, bereifte Beerenzapfen, die erst im zweiten Jahr reifen.", v3: "Die Beeren wirken verdauungsfördernd und harntreibend und würzen traditionell Wildgerichte und Sauerkraut.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnlicher_Wacholder" },
            { id: "29/45", type: "Heilkraut", title: "Meisterwurz", latin: "Peucedanum ostruthium (Doldenblütler)", v1: "Wächst auf feuchten Bergwiesen und an Waldrändern, vor allem in Mittelgebirgen und Alpen.", v2: "Große, dreifach gefiederte Blätter mit aufgeblasenen Blattscheiden und weiße Doppeldolden.", v3: "Die aromatische Wurzel galt früher als vielseitiges Heilmittel gegen Erkältungen und Verdauungsbeschwerden.", wiki: "https://de.wikipedia.org/wiki/Meisterwurz" },
            { id: "30/45", type: "Geschützt / Giftig", title: "Arnika (Bergwohlverleih)", latin: "Arnica montana (Korbblütler)", v1: "Wächst selten geworden auf mageren Bergwiesen und Heiden, steht unter strengem Naturschutz.", v2: "Rosettenartige, ganzrandige Blätter und leuchtend orangegelbe, sternförmige Blütenköpfe.", v3: "Die Blüten wirken entzündungshemmend und werden äußerlich als Salbe bei Prellungen und blauen Flecken verwendet – roh eingenommen ist die Pflanze giftig.", wiki: "https://de.wikipedia.org/wiki/Arnika" },
            { id: "31/45", type: "Heilkraut", title: "Augentrost", latin: "Euphrasia officinalis (Sommerwurzgewächse)", v1: "Wächst als Halbschmarotzer auf mageren Wiesen und Weiden, blüht von Juli bis Oktober.", v2: "Kleine, gezähnte Blättchen und winzige weiß-violette Blüten mit gelbem Fleck, die an Gräserwurzeln andocken.", v3: "Der Name verrät die traditionelle Anwendung: als Aufguss zu Augenkompressen bei Reizungen und Bindehautentzündung.", wiki: "https://de.wikipedia.org/wiki/Wirksamer_Augentrost" },
            { id: "32/45", type: "Heilkraut", title: "Wasserdost", latin: "Eupatorium cannabinum (Korbblütler)", v1: "Wächst an feuchten Ufern, Gräben und in Auwäldern, blüht rosa-purpur im Spätsommer.", v2: "Gegenständige, hanfähnlich dreiteilige Blätter und dichte, doldenartige Blütentrauben, die viele Schmetterlinge anlocken.", v3: "Wurde historisch bei fiebrigen Erkältungen genutzt, gilt heute wegen enthaltener Alkaloide als bedenklich für den Dauergebrauch.", wiki: "https://de.wikipedia.org/wiki/Wasserdost" },
            { id: "33/45", type: "Heilkraut", title: "Blutwurz (Tormentill)", latin: "Potentilla erecta (Rosengewächse)", v1: "Wächst auf feuchten Wiesen, Heiden und in lichten Wäldern auf saurem Boden.", v2: "Vierzählige, gelbe Blüten (statt der bei Fingerkräutern typischen fünf) und ein dicker, beim Anschneiden blutrot anlaufender Wurzelstock.", v3: "Die gerbstoffreiche Wurzel wirkt stark zusammenziehend und wird traditionell bei Durchfall und Zahnfleischentzündungen genutzt.", wiki: "https://de.wikipedia.org/wiki/Blutwurz" },
            { id: "34/45", type: "Heilkraut", title: "Großer Wiesenknopf", latin: "Sanguisorba officinalis (Rosengewächse)", v1: "Wächst auf feuchten, nährstoffreichen Wiesen und ist Lebensraum für den seltenen Dunklen Wiesenknopf-Ameisenbläuling.", v2: "Gefiederte Blätter und dunkelrote, walzenförmige Blütenköpfchen ohne auffällige Kronblätter.", v3: "Die Wurzel enthält viele Gerbstoffe und wurde traditionell zur Blutstillung bei leichten Wunden verwendet.", wiki: "https://de.wikipedia.org/wiki/Gro%C3%9Fer_Wiesenknopf" },
            { id: "35/45", type: "Heilkraut", title: "Knotige Braunwurz", latin: "Scrophularia nodosa (Braunwurzgewächse)", v1: "Wächst in schattigen, feuchten Wäldern und an Bachufern, oft übersehen zwischen anderem Unterwuchs.", v2: "Kantiger Stängel mit gegenständigen, gezähnten Blättern und kleinen, unscheinbaren braunroten Blüten.", v3: "Der Name verweist auf die knotigen Wurzelverdickungen; wurde traditionell äußerlich bei Hautunreinheiten aufgelegt.", wiki: "https://de.wikipedia.org/wiki/Knotige_Braunwurz" },
            { id: "36/45", type: "Heilkraut / Vorsicht", title: "Wald-Engelwurz", latin: "Angelica sylvestris (Doldenblütler)", v1: "Wächst an feuchten Waldrändern, Gräben und auf Nasswiesen, wird bis zu zwei Meter hoch.", v2: "Hohler, oft rötlich überlaufener Stängel, große gefiederte Blätter und große, weißliche Doppeldolden.", v3: "Verwandt mit der Echten Engelwurz; die Wurzel wirkt verdauungsfördernd – Verwechslungsgefahr mit giftigen Doldenblütlern beachten!", wiki: "https://de.wikipedia.org/wiki/Wald-Engelwurz" },
            { id: "37/45", type: "Heilkraut", title: "Gänse-Fingerkraut", latin: "Potentilla anserina (Rosengewächse)", v1: "Wächst kriechend auf feuchten Wegrändern, Weiden und an Gewässerufern.", v2: "Silbrig behaarte, gefiederte Blätter und einzeln stehende, gelbe fünfblättrige Blüten an langen Ausläufern.", v3: "Enthält Gerbstoffe, die traditionell bei leichten Krämpfen und als mildes Frauenkraut geschätzt wurden.", wiki: "https://de.wikipedia.org/wiki/G%C3%A4nse-Fingerkraut" },
            { id: "38/45", type: "Heilkraut", title: "Bachbunge", latin: "Veronica beccabunga (Wegerichgewächse)", v1: "Wächst direkt im und am Wasser von Bächen, Gräben und Quellen.", v2: "Dickfleischige, glänzende Blätter an kriechenden Stängeln und kleine, blaue Blütentrauben.", v3: "Früher als frisches Vitamin-C-Kraut gegen Skorbut gegessen, ähnlich der Brunnenkresse.", wiki: "https://de.wikipedia.org/wiki/Bachbunge" },
            { id: "39/45", type: "Heilkraut / Essbar", title: "Wald-Erdbeere", latin: "Fragaria vesca (Rosengewächse)", v1: "Wächst an lichten Waldrändern, Böschungen und Lichtungen, blüht weiß von April bis Juni.", v2: "Dreizählige, gezähnte Blätter und kleine weiße Blüten, gefolgt von den bekannten roten, süß-aromatischen Früchten.", v3: "Die Blätter sind gerbstoffreich und werden getrocknet als milder, magenfreundlicher Tee genutzt.", wiki: "https://de.wikipedia.org/wiki/Wald-Erdbeere" },
            { id: "40/45", type: "Heilkraut / Essbar", title: "Echte Brombeere", latin: "Rubus fruticosus (Rosengewächse)", v1: "Bildet dornige, dichte Hecken an Waldrändern, Böschungen und Brachflächen.", v2: "Dreifach gefiederte, dornig gestielte Blätter und weiße bis rosa Blüten, gefolgt von schwarzen Sammelsteinfrüchten.", v3: "Die getrockneten Blätter ergeben einen gerbstoffreichen Tee, der traditionell bei leichtem Durchfall getrunken wird.", wiki: "https://de.wikipedia.org/wiki/Echte_Brombeere" },
            { id: "41/45", type: "Heilkraut / Essbar", title: "Echte Himbeere", latin: "Rubus idaeus (Rosengewächse)", v1: "Wächst an Waldrändern, Lichtungen und Kahlschlägen, oft als Pionierpflanze nach Störungen im Wald.", v2: "Gefiederte Blätter mit weißfilziger Unterseite und weiße Blüten, gefolgt von den roten, aromatischen Sammelfrüchten.", v3: "Die Blätter werden traditionell als mildes Frauenkraut gegen Ende der Schwangerschaft und bei leichten Regelbeschwerden getrunken.", wiki: "https://de.wikipedia.org/wiki/Echte_Himbeere" },
            { id: "42/45", type: "Heilkraut", title: "Sal-Weide", latin: "Salix caprea (Weidengewächse)", v1: "Wächst an Waldrändern und feuchten Böschungen, ist eine der wichtigsten Frühlings-Bienenweiden.", v2: "Breite, ovale Blätter und die bekannten pelzigen 'Palmkätzchen', die schon im Februar/März blühen.", v3: "Die Rinde enthält wie die Silberweide Salicin, den pflanzlichen Vorläufer der Acetylsalicylsäure (Aspirin).", wiki: "https://de.wikipedia.org/wiki/Sal-Weide" },
            { id: "43/45", type: "Heilkraut", title: "Echtes Mädesüß", latin: "Filipendula ulmaria (Rosengewächse)", v1: "Wächst an feuchten Ufern, Gräben und auf Nasswiesen, blüht cremeweiß und stark duftend im Hochsommer.", v2: "Gefiederte, unterseits weißfilzige Blätter und dichte, schaumig wirkende Blütenrispen.", v3: "Enthält Salicylsäure-Verbindungen – der Name 'Aspirin' geht auf die alte botanische Bezeichnung 'Spiraea' dieser Pflanze zurück.", wiki: "https://de.wikipedia.org/wiki/Echtes_M%C3%A4des%C3%BC%C3%9F" },
            { id: "44/45", type: "Heilkraut", title: "Wilde Malve", latin: "Malva sylvestris (Malvengewächse)", v1: "Wächst an Wegrändern, Zäunen und auf Brachflächen, blüht violett-geädert von Juni bis September.", v2: "Rundliche, gelappte Blätter und große, fünfblättrige Blüten mit dunklen Längsstreifen.", v3: "Blüten und Blätter enthalten viel Schleimstoff und wirken reizlindernd bei Husten und Halsschmerzen.", wiki: "https://de.wikipedia.org/wiki/Wilde_Malve" },
            { id: "45/45", type: "Heilkraut", title: "Echtes Löffelkraut", latin: "Cochlearia officinalis (Kreuzblütler)", v1: "Wächst ursprünglich an Küsten und salzigen Standorten, seltener auch im Binnenland auf salzhaltigen Böden.", v2: "Fleischige, löffelförmige Grundblätter und kleine weiße, kreuzförmige Blüten.", v3: "Extrem reich an Vitamin C – diente Seefahrern traditionell zur Vorbeugung von Skorbut.", wiki: "https://de.wikipedia.org/wiki/Echtes_L%C3%B6ffelkraut" }
        ],
        giftig: [
            { id: "01/45", type: "Tödlich Giftig", title: "Blauer Eisenhut", latin: "Aconitum napellus (Hahnenfußgewächse)", v1: "Gilt as giftigste Pflanze Europas. Wächst in feuchten Bergwäldern und Gärten.", v2: "Markante, helmförmige, violettblaue Blüten an aufrechten, hohen Stängeln.", v3: "Enthält Aconitin. Bereits Hautkontakt kann Taubheitsgefühle und Lähmungen auslösen.", wiki: "https://de.wikipedia.org/wiki/Blauer_Eisenhut" },
            { id: "02/45", type: "Tödlich Giftig", title: "Gefleckter Schierling", latin: "Conium maculatum (Doldenblütler)", v1: "Wächst auf Brachflächen und an Wegen. Blüht weiß im Hochsommer.", v2: "Bläulich bereifter, im unteren Teil rot gefleckter Stängel mit unangenehmem Mäusegeruch.", v3: "Enthält Coniin. Der Schierlingsbecher raffte einst den Philosophen Sokrates dahin.", wiki: "https://de.wikipedia.org/wiki/Gefleckter_Schierling" },
            { id: "03/45", type: "Tödlich Giftig", title: "Roter Fingerhut", latin: "Digitalis purpurea (Ampfergewächse)", v1: "Wächst auf Waldlichtungen, Kahlschlägen und in naturnahen Gärten.", v2: "Wunderschöne, fingerhutartige rote Glockenblüten an langen Trauben.", v3: "Enthält herzwirksame Glykoside. Bereits zwei verzehrte Blätter können tödlich sein.", wiki: "https://de.wikipedia.org/wiki/Roter_Fingerhut" },
            { id: "04/45", type: "Tödlich Giftig", title: "Tollkirsche", latin: "Atropa belladonna (Nachtschattengewächse)", v1: "Liebt schattige Waldränder, Lichtungen und kalkhaltige Böden.", v2: "Glockenförmige, braunviolette Blüten und glänzende, kirschgroße schwarze Beeren.", v3: "Enthält Atropin. Verursacht Halluzinationen, Herzrasen und Atemlähmung.", wiki: "https://de.wikipedia.org/wiki/Schwarze_Tollkirsche" },
            { id: "05/45", type: "Tödlich Giftig", title: "Riesen-Bärenklau", latin: "Heracleum mantegazzianum (Doldenblütler)", v1: "Sehr dominante, bis zu 4 Meter hohe Pflanze an Bachufern und Waldrändern.", v2: "Riesige Blätter und weiße Dolden, die einen Durchmesser von 50 cm erreichen können.", v3: "Der Saft verursacht bei Sonnenlicht schwerste, verbrennungsähnliche Hautblasen.", wiki: "https://de.wikipedia.org/wiki/Riesen-B%C3%A4renklau" },
            { id: "06/45", type: "Stark Giftig", title: "Gemeiner Stechapfel", latin: "Datura stramonium (Nachtschattengewächse)", v1: "Wächst auf Schuttplätzen, Äckern und in Gärten ab Juni.", v2: "Große, trichterförmige weiße Blüten und stachelige, nussgroße Kapselfrüchte.", v3: "Stark halluzinogen, führt aber rasch zu lebensgefährlichen Vergiftungen.", wiki: "https://de.wikipedia.org/wiki/Gemeiner_Stechapfel" },
            { id: "07/45", type: "Tödlich Giftig", title: "Wasserschierling", latin: "Cicuta virosa (Doldenblütler)", v1: "Wächst an sumpfigen Ufern, Gräben und in Mooren. Sehr selten geworden.", v2: "Knolliger, innen hohl gekammerter Wurzelstock mit gelblichem Milchsaft.", v3: "Enthält Cicutoxin. Führt nach Verzehr innerhalb kurzer Zeit zu schweren Krämpfen.", wiki: "https://de.wikipedia.org/wiki/Wasserschierling" },
            { id: "08/45", type: "Stark Giftig", title: "Herbstzeitlose", latin: "Colchicum autumnale (Zeitlosengewächse)", v1: "Blüht im Herbst blattlos auf feuchten Wiesen. Die Blätter treiben im Frühjahr.", v2: "Krokusähnliche rosa-violette Blüten im September/Oktober.", v3: "Enthält Colchicin. Wird oft fatalerweise mit Bärlauchblättern verwechselt.", wiki: "https://de.wikipedia.org/wiki/Herbstzeitlose" },
            { id: "09/45", type: "Stark Giftig", title: "Bittersüßer Nachtschatten", latin: "Solanum dulcamara (Nachtschattengewächse)", v1: "Kletternder Halbstrauch in feuchten Wäldern, Ufern und Hecken.", v2: "Violette Blüten mit gelbem Staubbeutelkegel und eiförmige, rote Beeren.", v3: "Enthält Solanin. Vergiftung äußert sich durch Erbrechen und Durchfall.", wiki: "https://de.wikipedia.org/wiki/Bitters%C3%BC%C3%9Fer_Nachtschatten" },
            { id: "10/45", type: "Tödlich Giftig", title: "Gefleckter Aronstab", latin: "Arum maculatum (Aronstabgewächse)", v1: "Wächst im Schatten feuchter Laubwälder ab April.", v2: "Pfeilförmige, oft gefleckte Blätter und ein Blütenkolben mit braunviolettem Stab.", v3: "Im Herbst reifen leuchtend rote Beeren, die extrem brennend und hochgiftig sind.", wiki: "https://de.wikipedia.org/wiki/Gefleckter_Aronstab" },
            { id: "11/45", type: "Stark Giftig", title: "Rainfarn", latin: "Tanacetum vulgare (Korbblütler)", v1: "Häufig an Wegrändern und Bahndämmen ab Juli anzutreffen.", v2: "Knopfartige, leuchtend gelbe Blütenköpfe und stark duftende, gefiederte Blätter.", v3: "Enthält Thujon. Wurde früher als Wurmmittel genutzt, ist aber giftig für Leber und Nieren.", wiki: "https://de.wikipedia.org/wiki/Rainfarn" },
            { id: "12/45", type: "Stark Giftig", title: "Goldregen", latin: "Laburnum anagyroides (Hülsenfrüchtler)", v1: "Wächst häufig als Zierstrauch in Gärten und Parks, teils auch verwildert an Waldrändern.", v2: "Dreizählige Blätter und lange, hängende Trauben leuchtend gelber Schmetterlingsblüten im Mai.", v3: "Alle Pflanzenteile, besonders die erbsenähnlichen Samen, sind stark giftig und für Kinder besonders gefährlich.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnlicher_Goldregen" },
            { id: "13/45", type: "Stark Giftig", title: "Maiglöckchen", latin: "Convallaria majalis (Spargelgewächse)", v1: "Bildet dichte Bestände in schattigen Laubwäldern und wird auch gerne als Gartenpflanze kultiviert.", v2: "Zwei breite, glänzende Blätter und eine einseitige Traube nickender, weißer, glockenförmiger Blüten.", v3: "Enthält herzwirksame Glykoside; wird oft fatal mit essbarem Bärlauch verwechselt.", wiki: "https://de.wikipedia.org/wiki/Maigl%C3%B6ckchen" },
            { id: "14/45", type: "Giftig", title: "Adlerfarn", latin: "Pteridium aquilinum (Adlerfarngewächse)", v1: "Bildet dichte, oft mannshohe Bestände auf Kahlschlägen, Heiden und in lichten Wäldern.", v2: "Große, dreifach gefiederte Wedel, die von oben betrachtet an einen ausgebreiteten Adlerflügel erinnern.", v3: "Enthält krebserregende und thiaminabbauende Stoffe; gefährdet vor allem Weidevieh bei Massenaufnahme.", wiki: "https://de.wikipedia.org/wiki/Adlerfarn" },
            { id: "15/45", type: "Giftig", title: "Buchsbaum", latin: "Buxus sempervirens (Buchsbaumgewächse)", v1: "Wächst wild an wenigen warmen Standorten Südwestdeutschlands, ist aber vor allem als geschnittene Heckenpflanze in Gärten verbreitet.", v2: "Kleine, ledrige, glänzend dunkelgrüne, gegenständige Blätter und unscheinbare, gelbliche Blüten.", v3: "Alle Pflanzenteile enthalten giftige Alkaloide und sind für Mensch und Haustiere gefährlich.", wiki: "https://de.wikipedia.org/wiki/Buchsbaum" },
            { id: "16/45", type: "Tödlich Giftig", title: "Weißer Germer", latin: "Veratrum album (Germergewächse)", v1: "Wächst auf feuchten Bergwiesen und Almweiden der Mittelgebirge und Alpen.", v2: "Große, stark gerippte, spiralig angeordnete Blätter, die jungen Pflanzen ähneln stark dem Gelben Enzian.", v3: "Häufigste tödliche Verwechslung beim Enzianschnaps-Brennen – enthält hochgiftige Alkaloide.", wiki: "https://de.wikipedia.org/wiki/Wei%C3%9Fer_Germer" },
            { id: "17/45", type: "Stark Giftig", title: "Sadebaum", latin: "Juniperus sabina (Zypressengewächse)", v1: "Wächst als Zierstrauch in Gärten und Friedhöfen, ursprünglich aus dem Mittelmeerraum stammend.", v2: "Schuppenartige, dunkelgrüne Nadeln mit unangenehmem Geruch beim Zerreiben, im Gegensatz zum Wacholder mit stechenden Nadeln.", v3: "Alle Pflanzenteile sind stark giftig und wurden historisch missbräuchlich als Abtreibungsmittel verwendet – mit oft tödlichem Ausgang.", wiki: "https://de.wikipedia.org/wiki/Sadebaum" },
            { id: "18/45", type: "Giftig", title: "Jakobs-Kreuzkraut", latin: "Senecio jacobaea (Korbblütler)", v1: "Wächst auf mageren Weiden, Wegrändern und Brachflächen, breitet sich zunehmend aus.", v2: "Gefiederte, unregelmäßig gezähnte Blätter und dichte Dolden kleiner, gelber Korbblüten.", v3: "Enthält leberschädigende Pyrrolizidinalkaloide, die sich im Körper von Weidetieren summieren können.", wiki: "https://de.wikipedia.org/wiki/Jakobs-Greiskraut" },
            { id: "19/45", type: "Giftig", title: "Zypressen-Wolfsmilch", latin: "Euphorbia cyparissias (Wolfsmilchgewächse)", v1: "Wächst auf trockenen Wiesen, Böschungen und Wegrändern, oft in dichten Horsten.", v2: "Schmale, nadelartige Blätter und gelbgrüne, becherförmige Scheinblüten mit auffälligen Hochblättern.", v3: "Der milchige Pflanzensaft ist hautreizend und beim Verschlucken giftig.", wiki: "https://de.wikipedia.org/wiki/Zypressen-Wolfsmilch" },
            { id: "20/45", type: "Giftig", title: "Osterluzei", latin: "Aristolochia clematitis (Osterluzeigewächse)", v1: "Wächst an Weinbergrändern, Ruinen und in warmen, nährstoffreichen Gebüschen.", v2: "Herzförmige Blätter und gelbliche, pfeifenartig gebogene Röhrenblüten in den Blattachseln.", v3: "Enthält Aristolochiasäure, die schwere, teils irreversible Nierenschäden verursachen kann.", wiki: "https://de.wikipedia.org/wiki/Osterluzei" },
            { id: "21/45", type: "Stark Giftig", title: "Rote Zaunrübe", latin: "Bryonia dioica (Kürbisgewächse)", v1: "Rankt an Hecken, Zäunen und Gebüschen, oft übersehen zwischen anderen Kletterpflanzen.", v2: "Raue, handförmig gelappte Blätter, Ranken und im Herbst leuchtend rote, erbsengroße Beeren.", v3: "Die Beeren und die dicke Rübenwurzel sind stark giftig, wenige Beeren können für Kinder gefährlich werden.", wiki: "https://de.wikipedia.org/wiki/Zweih%C3%A4usige_Zaunr%C3%BCbe" },
            { id: "22/45", type: "Giftig", title: "Hundspetersilie", latin: "Aethusa cynapium (Doldenblütler)", v1: "Wächst als lästiges Unkraut auf Äckern, in Gärten und auf Schuttplätzen.", v2: "Glänzend dunkelgrüne, fein gefiederte Blätter, unterseits deutlich glänzender als bei echter Petersilie.", v3: "Eine der gefährlichsten Verwechslungspflanzen für Petersilie, Kerbel und Schierling – im Zweifel nicht sammeln.", wiki: "https://de.wikipedia.org/wiki/Hundspetersilie" },
            { id: "23/45", type: "Stark Giftig", title: "Großer Wasserfenchel", latin: "Oenanthe aquatica (Doldenblütler)", v1: "Wächst in und an flachen, stehenden oder langsam fließenden Gewässern.", v2: "Fein gefiederte Unterwasserblätter und derbere Luftblätter, weiße Doppeldolden über dem Wasser.", v3: "Zählt zu den giftigsten heimischen Doldenblütlern und wird leicht mit essbaren Arten verwechselt.", wiki: "https://de.wikipedia.org/wiki/Wasser-Pferdesaat" },
            { id: "24/45", type: "Giftig (unreif)", title: "Schwarzer Nachtschatten", latin: "Solanum nigrum (Nachtschattengewächse)", v1: "Wächst häufig auf Äckern, in Gärten und auf Schuttplätzen.", v2: "Eiförmige, gebuchtete Blätter und kleine weiße Sternblüten, gefolgt von kugeligen, zunächst grünen Beeren.", v3: "Unreife, grüne Beeren enthalten Solanin und sind giftig; vollreife schwarze Beeren gelten als weniger bedenklich, Vorsicht ist dennoch geboten.", wiki: "https://de.wikipedia.org/wiki/Schwarzer_Nachtschatten" },
            { id: "25/45", type: "Giftig (roh)", title: "Roter Holunder (Traubenholunder)", latin: "Sambucus racemosa (Moschuskrautgewächse)", v1: "Wächst in Bergwäldern, an Waldrändern und Schlägen, blüht bereits im April/Mai.", v2: "Gefiederte Blätter und kegelförmige, aufrechte Blütenrispen, im Sommer leuchtend rote Beeren.", v3: "Im Gegensatz zum Schwarzen Holunder sind die roten Beeren roh giftig und müssen unbedingt abgekocht werden.", wiki: "https://de.wikipedia.org/wiki/Roter_Holunder" },
            { id: "26/45", type: "Giftig", title: "Stinkende Nieswurz", latin: "Helleborus foetidus (Hahnenfußgewächse)", v1: "Wächst in lichten Laubwäldern und an Waldrändern auf kalkreichen Böden, blüht schon im Winter.", v2: "Dunkelgrüne, fingerförmig geteilte, ledrige Blätter und hängende, hellgrüne, oft rot berandete Glockenblüten.", v3: "Alle Pflanzenteile sind giftig; der unangenehme Geruch beim Zerreiben gab ihr den deutschen Namen.", wiki: "https://de.wikipedia.org/wiki/Stinkende_Nieswurz" },
            { id: "27/45", type: "Giftig", title: "Gemeiner Liguster (Giftig)", latin: "Ligustrum vulgare (Ölbaumgewächse)", v1: "Sehr häufig als Heckenpflanze in Gärten und Parkanlagen genutzt.", v2: "Halbwintergrüne, schmale Blätter und weiße, intensiv duftende Blütenrispen.", v3: "Die im Herbst reifenden schwarzen Beeren sind für Menschen und Haustiere giftig und werden oft von Kindern verwechselt.", wiki: "https://de.wikipedia.org/wiki/Gemeiner_Liguster" },
            { id: "28/45", type: "Giftig", title: "Efeu (Giftig)", latin: "Hedera helix (Efeugewächse)", v1: "Rankt kletternd an Bäumen, Mauern und am Waldboden, bleibt auch im Winter grün.", v2: "Junge Blätter sind gelappt, ältere Blätter an blühenden Trieben oval-rautenförmig; im Herbst erscheinen kugelige Blütendolden.", v3: "Die schwarzen Beeren und Blätter sind giftig und zählen zu den häufigsten Ursachen für Vergiftungsfälle bei Haustieren.", wiki: "https://de.wikipedia.org/wiki/Efeu" },
