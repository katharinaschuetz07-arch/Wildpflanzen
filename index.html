            { id: "29/45", type: "Tödlich Giftig", title: "Gemeine Eibe (Giftig)", latin: "Taxus baccata (Eibengewächse)", v1: "Schattenverträglicher, sehr langsam wachsender Nadelbaum, oft als Heckenpflanze in Gärten und Friedhöfen genutzt.", v2: "Weiche, dunkelgrüne Nadeln. Weibliche Bäume tragen rote, becherartige Samenmäntel.", v3: "Nadeln und Samen (nicht der rote Fruchtmantel) sind hochgiftig – schon wenige Nadeln können für Pferde tödlich sein.", wiki: "https://de.wikipedia.org/wiki/Europ%C3%A4ische_Eibe" },
            { id: "30/45", type: "Giftig", title: "Kirschlorbeer", latin: "Prunus laurocerasus (Rosengewächse)", v1: "Ursprünglich aus Südosteuropa stammend, ist er als immergrüne Heckenpflanze in Gärten weit verbreitet und verwildert zunehmend.", v2: "Große, ledrige, glänzend dunkelgrüne Blätter und aufrechte, weiße Blütenkerzen im Frühjahr.", v3: "Blätter und Samen enthalten blausäureabspaltende Glykoside und sind für Mensch und Tier giftig.", wiki: "https://de.wikipedia.org/wiki/Lorbeerkirsche" },
            { id: "31/45", type: "Giftig", title: "Pontischer Rhododendron", latin: "Rhododendron ponticum (Heidekrautgewächse)", v1: "Ursprünglich aus Südosteuropa und Kleinasien eingeführt, verwildert er zunehmend in Wäldern und verdrängt heimische Arten.", v2: "Große, ledrige, immergrüne Blätter und auffällige violette Blütendolden im Mai/Juni.", v3: "Nektar und Blätter enthalten Grayanotoxine, die auch über Honig ('Rauschhonig') zu Vergiftungen führen können.", wiki: "https://de.wikipedia.org/wiki/Pontischer_Rhododendron" },
            { id: "32/45", type: "Tödlich Giftig", title: "Gelber Eisenhut (Sturmhut)", latin: "Aconitum lycoctonum (Hahnenfußgewächse)", v1: "Wächst in feuchten Bergwäldern und an schattigen Waldbächen der Mittelgebirge und Alpen.", v2: "Tief gelappte Blätter und gelbliche, helmförmige Blüten in lockeren Trauben.", v3: "Wie der Blaue Eisenhut hochgiftig – bereits Hautkontakt kann zu Taubheitsgefühlen führen.", wiki: "https://de.wikipedia.org/wiki/Wolfs-Eisenhut" },
            { id: "33/45", type: "Stark Giftig", title: "Schwarzes Bilsenkraut", latin: "Hyoscyamus niger (Nachtschattengewächse)", v1: "Wächst auf Schuttplätzen, an Wegrändern und Ruinen, oft an stickstoffreichen Standorten.", v2: "Klebrig-behaarte, buchtig gezähnte Blätter und trichterförmige, gelblich-violett geaderte Blüten.", v3: "Enthält wie die Tollkirsche stark halluzinogene Alkaloide und war historisch als 'Hexenkraut' gefürchtet.", wiki: "https://de.wikipedia.org/wiki/Schwarzes_Bilsenkraut" },
            { id: "34/45", type: "Giftig", title: "Gewöhnliche Waldrebe", latin: "Clematis vitalba (Hahnenfußgewächse)", v1: "Rankt kletternd an Hecken, Waldrändern und Zäunen, im Herbst an den silbrig-federigen Fruchtständen erkennbar.", v2: "Gefiederte Blätter und cremeweiße, duftende Blütenrispen im Sommer.", v3: "Der Pflanzensaft reizt Haut und Schleimhäute stark, weshalb sie im Volksmund auch 'Teufelszwirn' genannt wird.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliche_Waldrebe" },
            { id: "35/45", type: "Giftig", title: "Faulbaum (Giftig)", latin: "Frangula alnus (Kreuzdorngewächse)", v1: "Bevorzugt feuchte, saure Wälder und Moorböden.", v2: "Glatte Rinde, die beim Anschaben unangenehm riecht. Dreifarbige Beerenreife (Grün-Rot-Schwarz).", v3: "Die Beeren sind vor allem unreif giftig und können bei Kindern zu heftigen Magen-Darm-Beschwerden führen.", wiki: "https://de.wikipedia.org/wiki/Faulbaum" },
            { id: "36/45", type: "Sehr Giftig", title: "Pfaffenhütchen (Giftig)", latin: "Euonymus europaeus (Spindelbaumgewächse)", v1: "Wächst in Hecken und an Waldrändern auf nährstoffreichen Böden.", v2: "Unscheinbare Blüten, aber im Herbst leuchtend rosa-orange Kapselfrüchte mit orangen Samen.", v3: "Alle Pflanzenteile, besonders die Samen, sind stark herzgiftig und für Kinder wegen der bunten Farben verlockend gefährlich.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliches_Pfaffenh%C3%BCtchen" },
            { id: "37/45", type: "Giftig", title: "Robinie (Giftig)", latin: "Robinia pseudoacacia (Hülsenfrüchtler)", v1: "Ursprünglich aus Nordamerika stammend, hat sich die Robinie auf Bahndämmen und Brachflächen stark eingebürgert.", v2: "Gefiederte Blätter mit paarigen Dornen und hängende, weiße, duftende Blütentrauben im Mai/Juni.", v3: "Rinde, Blätter und vor allem die Samen enthalten das Toxalbumin Robin und sind giftig.", wiki: "https://de.wikipedia.org/wiki/Robinie" },
            { id: "38/45", type: "Giftig (für Tiere)", title: "Rosskastanie (Giftig für Tiere)", latin: "Aesculus hippocastanum (Seifenbaumgewächse)", v1: "Ursprünglich vom Balkan stammend, ist die Rosskastanie seit Jahrhunderten als Allee- und Parkbaum eingebürgert.", v2: "Handförmig gefiederte Blätter und aufrechte, kerzenartige weiß-rosa Blütenstände im Mai.", v3: "Die Samen enthalten Aescin und sind für Pferde und Hunde giftig, für Menschen ungenießbar bitter.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliche_Rosskastanie" },
            { id: "39/45", type: "Giftig", title: "Acker-Rittersporn", latin: "Consolida regalis (Hahnenfußgewächse)", v1: "Wächst als Ackerwildkraut zwischen Getreide, ist durch intensive Landwirtschaft selten geworden.", v2: "Fein zerteilte Blätter und leuchtend blauviolette Blüten mit einem langen, geraden Sporn.", v3: "Wie der verwandte Eisenhut enthält sie giftige Alkaloide, vor allem in den Samen.", wiki: "https://de.wikipedia.org/wiki/Acker-Rittersporn" },
            { id: "40/45", type: "Giftig", title: "Gift-Hahnenfuß", latin: "Ranunculus sceleratus (Hahnenfußgewächse)", v1: "Wächst an schlammigen Ufern, Gräben und zeitweise überschwemmten Flächen.", v2: "Fleischige, gelappte Blätter und kleine, blassgelbe Blüten mit auffällig walzenförmigem Fruchtstand.", v3: "Der Pflanzensaft ist stark hautreizend und gilt als der giftigste heimische Hahnenfuß.", wiki: "https://de.wikipedia.org/wiki/Gift-Hahnenfu%C3%9F" },
            { id: "41/45", type: "Giftig", title: "Sumpfporst (Giftig)", latin: "Rhododendron tomentosum (Heidekrautgewächse)", v1: "Wächst in torfreichen, sauren Kiefernmoorwäldern Norddeutschlands.", v2: "Immergrüner Strauch mit zimtbraun behaarter Blattunterseite und weißen Blüten.", v3: "Die ätherischen Öle wirken narkotisch und können bei intensivem Kontakt Kopfschmerzen und Übelkeit auslösen.", wiki: "https://de.wikipedia.org/wiki/Sumpfporst" },
            { id: "42/45", type: "Giftig", title: "Garten-Wolfsmilch", latin: "Euphorbia peplus (Wolfsmilchgewächse)", v1: "Wächst als häufiges Unkraut in Gärten, auf Äckern und Schuttplätzen.", v2: "Verkehrt-eiförmige Blätter und kleine, becherförmige, gelbgrüne Scheinblüten.", v3: "Der milchige Saft ist hautreizend und beim Verschlucken giftig, wurde volksmedizinisch aber äußerlich gegen Warzen genutzt.", wiki: "https://de.wikipedia.org/wiki/Garten-Wolfsmilch" },
            { id: "43/45", type: "Giftig", title: "Stechpalme (Giftig)", latin: "Ilex aquifolium (Stechpalmengewächse)", v1: "Wächst als immergrüner Strauch oder kleiner Baum im Unterwuchs schattiger, milder Laubwälder.", v2: "Ledrige, glänzende, stachelig gezähnte Blätter und im Winter leuchtend rote Beeren.", v3: "Die Beeren sind für Menschen giftig und können bei Kindern zu ernsthaften Magen-Darm-Beschwerden führen.", wiki: "https://de.wikipedia.org/wiki/Europ%C3%A4ische_Stechpalme" },
            { id: "44/45", type: "Giftig", title: "Sumpf-Calla (Giftig)", latin: "Calla palustris (Aronstabgewächse)", v1: "Wächst sehr selten an schlammigen Ufern von Mooren, Sümpfen und stehenden Gewässern.", v2: "Herzförmige, glänzende Blätter und ein weißes Hochblatt, das den kleinen Blütenkolben umhüllt.", v3: "Alle Pflanzenteile sind roh durch Kalziumoxalat-Kristalle giftig und reizen Mund und Rachen stark.", wiki: "https://de.wikipedia.org/wiki/Drachenwurz" },
            { id: "45/45", type: "Giftig", title: "Gewöhnliches Kreuzkraut", latin: "Senecio vulgaris (Korbblütler)", v1: "Wächst als häufiges Unkraut auf Äckern, in Gärten und auf Schuttplätzen, blüht fast ganzjährig.", v2: "Fiederteilige Blätter und kleine, meist geschlossen bleibende gelbe Blütenköpfchen ohne Zungenblüten.", v3: "Enthält wie das Jakobs-Kreuzkraut leberschädigende Pyrrolizidinalkaloide und ist besonders für Weidetiere gefährlich.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliches_Greiskraut" }
        ],
        baeume: [
            { id: "01/45", type: "Heimischer Laubbaum", title: "Stieleiche", latin: "Quercus robur (Buchengewächse)", v1: "Wächst extrem langsam und kann weit über 1000 Jahre alt werden.", v2: "Typisch tief gelappte Blätter und die eiförmigen Eicheln in kleinen Bechern.", v3: "Bietet Nahrung für unzählige Insekten- und Vogelarten. Sehr hartes, wertvolles Holz.", wiki: "https://de.wikipedia.org/wiki/Stieleiche" },
            { id: "02/45", type: "Heimischer Laubbaum", title: "Rotbuche", latin: "Fagus sylvatica (Buchengewächse)", v1: "Der am häufigsten vorkommende Waldbaum Deutschlands. Bildet dichte Kronendächer.", v2: "Glatte, silbergraue Rinde und eiförmige Blätter mit leicht gewelltem Rand.", v3: "Trägt im Herbst Bucheckern, die reich an Fett und eine wichtige Waldtiernahrung sind.", wiki: "https://de.wikipedia.org/wiki/Rotbuche" },
            { id: "03/45", type: "Heimischer Laubbaum", title: "Hängebirke", latin: "Betula pendula (Birkengewächse)", v1: "Eine Pionierpflanze, die kahle Flächen rasch besiedelt. Liebt Licht.", v2: "Unverkennbare weiße Rinde und dünne, hängende Zweige mit dreieckigen Blättern.", v3: "Der Birkensaft wird im Frühjahr gezapft, Blütenschätzchen dienen Vögeln als Nahrung.", wiki: "https://de.wikipedia.org/wiki/H%C3%A4nge-Birke" },
            { id: "04/45", type: "Heimischer Nadelbaum", title: "Gemeine Fichte", latin: "Picea abies (Kieferngewächse)", v1: "Schnellwüchsiger Nadelbaum, der forstwirtschaftlich stark genutzt wird.", v2: "Spitze, vierkantige Nadeln und herabhängende Zapfen, die im Ganzen abfallen.", v3: "Flachwurzler – leidet daher in trockenen Sommern stark unter Borkenkäferbefall.", wiki: "https://de.wikipedia.org/wiki/Gemeine_Fichte" },
            { id: "05/45", type: "Heimischer Nadelbaum", title: "Waldkiefer", latin: "Pinus sylvestris (Kieferngewächse)", v1: "Sehr anpassungsfähiger Baum auf Sandböden und Mooren.", v2: "Bläulich-grüne, paarweise angeordnete Nadeln und rötlich-braune Rinde am oberen Stamm.", v3: "Das harzreiche Holz brennt gut, die Knospen enthalten wertvolle ätherische Öle.", wiki: "https://de.wikipedia.org/wiki/Waldkiefer" },
            { id: "06/45", type: "Heimischer Laubbaum", title: "Spitzahorn", latin: "Acer platanoides (Seifenbaumgewächse)", v1: "Wächst häufig in Alleen und Parks. Blüht im April vor dem Blattaustrieb gelbgrün.", v2: "Handförmige, spitz zulaufende Blätter und die typischen geflügelten Spaltfrüchte.", v3: "Das Laub färbt sich im Herbst intensiv goldgelb bis feurig rot.", wiki: "https://de.wikipedia.org/wiki/Spitzahorn" },
            { id: "07/45", type: "Heimischer Laubbaum", title: "Winterlinde", latin: "Tilia cordata (Malvengewächse)", v1: "Ein beliebter Dorf- und Schattenbaum, der sehr alt werden kann.", v2: "Herzförmige, unterseits braunbärtige Blätter und süß duftende Blüten im Juni.", v3: "Die Blüten sind eine Bienenweide und ergeben den klassischen schweißtreibenden Lindentee.", wiki: "https://de.wikipedia.org/wiki/Winterlinde" },
            { id: "08/45", type: "Heimischer Laubbaum", title: "Silberweide", latin: "Salix alba (Weidengewächse)", v1: "Wächst an Ufern von Flüssen und Seen. Verträgt Überschwemmungen problemlos.", v2: "Schmale Blätter mit silbrig behaarter Unterseite, die im Wind glitzern.", v3: "Enthält Salicylsäure (Urvater des Aspirins) in der Rinde. Zweige sind extrem biegsam.", wiki: "https://de.wikipedia.org/wiki/Silber-Weide" },
            { id: "09/45", type: "Heimischer Laubbaum", title: "Gemeine Esche", latin: "Fraxinus excelsior (Ölbaumgewächse)", v1: "Wächst bevorzugt in feuchten Tälern und Auwäldern. Wird sehr hoch.", v2: "Gefiederte Blätter und auffallend tiefschwarze Knospen im Winter.", v3: "Das elastische und zähe Holz wird traditionell für Werkzeugstiele und Sportgeräte verwendet.", wiki: "https://de.wikipedia.org/wiki/Gemeine_Esche" },
            { id: "10/45", type: "Heimischer Laubbaum", title: "Schwarz-Erle", latin: "Alnus glutinosa (Birkengewächse)", v1: "Typischer Baum feuchter Moore, Brüche und Bachränder.", v2: "Blätter sind vorne abgerundet oder eingekerbt. Trägt kleine verholzende Zapfen.", v3: "Kann im nassen Boden ohne Sauerstoff überleben, da sie Luftgänge im Holz besitzt.", wiki: "https://de.wikipedia.org/wiki/Schwarz-Erle" },
            { id: "11/45", type: "Heimischer Nadelbaum", title: "Gemeine Eibe", latin: "Taxus baccata (Eibengewächse)", v1: "Schattenverträglicher, sehr langsam wachsender Nadelbaum in schattigen Mischwäldern.", v2: "Weiche, dunkelgrüne Nadeln. Weibliche Bäume tragen rote, becherartige Samenmäntel.", v3: "Die gesamte Pflanze (außer dem roten Samenmantel) ist hochgradig giftig für Mensch und Tier.", wiki: "https://de.wikipedia.org/wiki/Europ%C3%A4ische_Eibe" },
            { id: "12/45", type: "Heimischer Laubbaum", title: "Bergahorn", latin: "Acer pseudoplatanus (Seifenbaumgewächse)", v1: "Wächst bevorzugt in Bergwäldern und an feuchten Hängen, ist aber auch im Flachland als Parkbaum verbreitet.", v2: "Große, fünflappige Blätter mit stumpfen Zähnen und geflügelte Spaltfrüchte in engem Winkel.", v3: "Liefert eines der wertvollsten heimischen Hölzer für den Instrumentenbau (Geigenbau).", wiki: "https://de.wikipedia.org/wiki/Berg-Ahorn" },
            { id: "13/45", type: "Heimischer Laubbaum", title: "Feldahorn", latin: "Acer campestre (Seifenbaumgewächse)", v1: "Wächst als kleiner Baum oder Strauch in Hecken, an Feldrändern und in Laubwäldern.", v2: "Kleinere, stumpf gelappte Blätter mit korkig geflügelten Zweigen und waagerecht abstehenden Spaltfrüchten.", v3: "Beliebter Heckenbaum, dessen Laub sich im Herbst leuchtend goldgelb färbt.", wiki: "https://de.wikipedia.org/wiki/Feld-Ahorn" },
            { id: "14/45", type: "Heimischer Laubbaum", title: "Sommerlinde", latin: "Tilia platyphyllos (Malvengewächse)", v1: "Wächst in warmen Laubwäldern und wird häufig als Dorf- und Alleebaum gepflanzt.", v2: "Größere, unterseits weichhaarige Blätter als die Winterlinde, blüht bereits im Juni etwas früher.", v3: "Die Blüten sind ebenfalls eine wertvolle Bienenweide und ergeben aromatischen Lindentee.", wiki: "https://de.wikipedia.org/wiki/Sommer-Linde" },
            { id: "15/45", type: "Heimischer Laubbaum", title: "Flatterulme", latin: "Ulmus laevis (Ulmengewächse)", v1: "Wächst in feuchten Auwäldern und an Flussufern, ist relativ resistent gegen das Ulmensterben.", v2: "Asymmetrische Blattbasis wie alle Ulmen; die Früchte haben einen auffällig gewimperten Flügelrand.", v3: "Einer der wenigen Ulmenarten, die dem Ulmensterben (einem Pilzbefall) noch gut standhalten.", wiki: "https://de.wikipedia.org/wiki/Flatter-Ulme" },
            { id: "16/45", type: "Heimischer Laubbaum", title: "Bergulme", latin: "Ulmus glabra (Ulmengewächse)", v1: "Wächst in kühl-feuchten Schlucht- und Bergwäldern, oft an schattigen Hängen.", v2: "Große, sehr raue, asymmetrische Blätter mit oft dreispitziger Blattspitze.", v3: "Wie andere Ulmenarten stark durch das Ulmensterben gefährdet.", wiki: "https://de.wikipedia.org/wiki/Berg-Ulme" },
            { id: "17/45", type: "Heimischer Laubbaum", title: "Feld-Ulme", latin: "Ulmus minor (Ulmengewächse)", v1: "Wächst an Waldrändern, Hecken und Flussauen des Tieflands.", v2: "Kleinere, glänzende, asymmetrische Blätter und oft korkleistenartige junge Zweige.", v3: "Zählt zu den seltensten heimischen Ulmenarten, da sie besonders stark vom Ulmensterben betroffen ist.", wiki: "https://de.wikipedia.org/wiki/Feld-Ulme" },
            { id: "18/45", type: "Heimischer Laubbaum", title: "Gemeine Traubenkirsche", latin: "Prunus padus (Rosengewächse)", v1: "Wächst an feuchten Waldrändern, Bachufern und in Auwäldern, blüht duftend im Mai.", v2: "Lange, hängende Blütentrauben aus weißen Einzelblüten, gefolgt von kleinen, schwarzen Steinfrüchten.", v3: "Die bitteren Früchte sind für Vögel eine wichtige Nahrungsquelle, roh für Menschen ungenießbar herb.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliche_Traubenkirsche" },
            { id: "19/45", type: "Heimischer Laubbaum", title: "Vogel-Kirsche", latin: "Prunus avium (Rosengewächse)", v1: "Wächst in Laubwäldern und wird oft als Wertholzbaum in Alleen gepflanzt.", v2: "Glatte, rötlich-braune Rinde mit auffälligen Querstreifen (Lentizellen) und weiße Blütendolden im April.", v3: "Die Stammform aller Süßkirschsorten; ihr Holz ist als Kirschbaumholz sehr geschätzt.", wiki: "https://de.wikipedia.org/wiki/Vogel-Kirsche" },
            { id: "20/45", type: "Heimischer Laubbaum", title: "Wildapfel", latin: "Malus sylvestris (Rosengewächse)", v1: "Wächst selten geworden an Waldrändern und in lichten Laubwäldern.", v2: "Kleiner, oft dorniger Baum mit weiß-rosa Blüten und kleinen, sauren, gelbgrünen Äpfeln.", v3: "Gilt als eine der Wildformen unserer Kulturäpfel und ist genetisch besonders wertvoll.", wiki: "https://de.wikipedia.org/wiki/Wildapfel" },
            { id: "21/45", type: "Heimischer Laubbaum", title: "Wildbirne", latin: "Pyrus pyraster (Rosengewächse)", v1: "Wächst sehr selten geworden an warmen Waldrändern und Feldrainen.", v2: "Oft dorniger Wuchs, weiße Blüten im April und kleine, harte, herbe Birnenfrüchte.", v3: "Eine der seltensten heimischen Wildobstarten, wichtig als genetische Ressource für Kulturbirnen.", wiki: "https://de.wikipedia.org/wiki/Wildbirne" },
            { id: "22/45", type: "Heimischer Laubbaum", title: "Speierling", latin: "Sorbus domestica (Rosengewächse)", v1: "Wächst sehr selten an warmen, trockenen Waldrändern, vor allem in Weinbauregionen.", v2: "Gefiederte Blätter ähnlich der Eberesche, aber größere, apfel- oder birnenförmige Früchte.", v3: "Die Früchte werden traditionell zur Apfelweinveredelung (Speierling-Most) genutzt.", wiki: "https://de.wikipedia.org/wiki/Speierling" },
            { id: "23/45", type: "Heimischer Laubbaum", title: "Elsbeere", latin: "Sorbus torminalis (Rosengewächse)", v1: "Wächst zerstreut in warmen Laubwäldern, besonders auf kalkreichen Böden.", v2: "Ahornähnlich gelappte Blätter und kleine, bräunlich gepunktete Früchte.", v3: "Ihr Holz zählt zu den wertvollsten und teuersten heimischen Hölzern überhaupt.", wiki: "https://de.wikipedia.org/wiki/Elsbeere" },
            { id: "24/45", type: "Heimischer Laubbaum", title: "Mehlbeere", latin: "Sorbus aria (Rosengewächse)", v1: "Wächst auf trockenen, kalkreichen Hängen und Felsstandorten.", v2: "Blattoberseite dunkelgrün, Unterseite auffällig weißfilzig behaart; rote, mehlige Früchte im Herbst.", v3: "Die Früchte schmecken erst nach dem ersten Frost mild-mehlig und wurden früher als Notnahrung genutzt.", wiki: "https://de.wikipedia.org/wiki/Mehlbeere" },
            { id: "25/45", type: "Heimischer Nadelbaum", title: "Weißtanne", latin: "Abies alba (Kieferngewächse)", v1: "Wächst in kühl-feuchten Berg- und Mittelgebirgswäldern, oft gemeinsam mit Buche und Fichte.", v2: "Flache, an der Spitze eingekerbte Nadeln mit zwei weißen Wachsstreifen auf der Unterseite; aufrecht stehende Zapfen.", v3: "Reagiert empfindlich auf Luftverschmutzung, was ihr in den 1980er Jahren stark zusetzte ('Tannensterben').", wiki: "https://de.wikipedia.org/wiki/Wei%C3%9F-Tanne" },
            { id: "26/45", type: "Heimischer Nadelbaum", title: "Europäische Lärche", latin: "Larix decidua (Kieferngewächse)", v1: "Wächst in Gebirgswäldern der Alpen, wird aber auch im Flachland forstlich angebaut.", v2: "Weiche, büschelig angeordnete Nadeln, die im Herbst goldgelb werden und abfallen – einzigartig unter heimischen Nadelbäumen.", v3: "Der einzige heimische Nadelbaum, der im Winter komplett kahl ist.", wiki: "https://de.wikipedia.org/wiki/Europ%C3%A4ische_L%C3%A4rche" },
            { id: "27/45", type: "Heimischer Laubbaum", title: "Schwarzpappel", latin: "Populus nigra (Weidengewächse)", v1: "Wächst an Flussufern und in Auwäldern, ist in reiner Wildform sehr selten geworden.", v2: "Rhombische bis dreieckige Blätter und tief gefurchte, dunkle Rinde bei älteren Bäumen.", v3: "Die echte Wildform gilt als eine der am stärksten gefährdeten Baumarten Mitteleuropas.", wiki: "https://de.wikipedia.org/wiki/Schwarz-Pappel" },
            { id: "28/45", type: "Heimischer Laubbaum", title: "Zitterpappel (Espe)", latin: "Populus tremula (Weidengewächse)", v1: "Besiedelt als Pionierbaum Waldlichtungen, Kahlschläge und Waldränder.", v2: "Rundliche Blätter an seitlich abgeflachten Stielen, die schon beim leisesten Windhauch zittern.", v3: "Namensgeberin für den Ausdruck 'zittern wie Espenlaub'.", wiki: "https://de.wikipedia.org/wiki/Zitter-Pappel" },
            { id: "29/45", type: "Heimischer Laubbaum", title: "Grau-Erle", latin: "Alnus incana (Birkengewächse)", v1: "Wächst an Gebirgsbächen, Schotterfluren und in kühleren Lagen als die Schwarz-Erle.", v2: "Graugrüne, unterseits leicht behaarte Blätter mit spitzer Blattspitze, im Gegensatz zur Schwarz-Erle nicht eingekerbt.", v3: "Als Pionierbaum besiedelt sie rasch frische Schotter- und Geröllflächen nach Hochwasser.", wiki: "https://de.wikipedia.org/wiki/Grau-Erle" },
            { id: "30/45", type: "Heimischer Laubbaum", title: "Hainbuche", latin: "Carpinus betulus (Birkengewächse)", v1: "Wächst häufig als Mischbaumart in Laubwäldern und wird gerne als Heckenpflanze genutzt.", v2: "Eiförmige, scharf doppelt gesägte Blätter; nicht mit der Rotbuche verwandt, sondern zur Birkenfamilie zählend.", v3: "Als Hecke geschnitten behält sie im Winter ihr braunes, welkes Laub bis zum Austrieb im Frühjahr.", wiki: "https://de.wikipedia.org/wiki/Hainbuche" },
            { id: "31/45", type: "Verwildert", title: "Robinie (Scheinakazie)", latin: "Robinia pseudoacacia (Hülsenfrüchtler)", v1: "Ursprünglich aus Nordamerika stammend, hat sich die Robinie auf Bahndämmen und Brachflächen stark eingebürgert.", v2: "Gefiederte Blätter mit paarigen Dornen an den Zweigen und hängende, weiße, stark duftende Blütentrauben im Mai/Juni.", v3: "Gilt heute als invasive Art, liefert aber sehr hartes, wetterfestes Holz und ist eine ergiebige Bienenweide.", wiki: "https://de.wikipedia.org/wiki/Robinie" },
            { id: "32/45", type: "Verwildert", title: "Gewöhnliche Rosskastanie", latin: "Aesculus hippocastanum (Seifenbaumgewächse)", v1: "Ursprünglich vom Balkan stammend, ist die Rosskastanie seit Jahrhunderten als Allee- und Parkbaum eingebürgert.", v2: "Handförmig gefiederte Blätter und aufrechte, kerzenartige weiß-rosa Blütenstände im Mai.", v3: "Die glänzend braunen Samen (Kastanien) sind für Menschen ungenießbar, dienen aber als Winterfutter für Rotwild.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliche_Rosskastanie" },
            { id: "33/45", type: "Heimischer Strauchbaum", title: "Stechpalme (Ilex)", latin: "Ilex aquifolium (Stechpalmengewächse)", v1: "Wächst als immergrüner Strauch oder kleiner Baum im Unterwuchs schattiger, milder Laubwälder.", v2: "Ledrige, glänzende, stachelig gezähnte Blätter und im Winter leuchtend rote, giftige Beeren.", v3: "Eine der wenigen heimischen, wirklich immergrünen Laubgehölze und beliebter Weihnachtsschmuck.", wiki: "https://de.wikipedia.org/wiki/Europ%C3%A4ische_Stechpalme" },
            { id: "34/45", type: "Verwildert / Essbar", title: "Walnuss", latin: "Juglans regia (Walnussgewächse)", v1: "Bereits seit der Römerzeit in Deutschland kultiviert und vielerorts verwildert in Gärten und an Wegrändern zu finden.", v2: "Große, gefiederte Blätter mit charakteristischem, würzigem Geruch beim Zerreiben und grüne, kugelige Fruchthüllen.", v3: "Die Nüsse sind reich an wertvollen Fettsäuren, das Holz zählt zu den edelsten Möbelhölzern.", wiki: "https://de.wikipedia.org/wiki/Walnuss" },
            { id: "35/45", type: "Heimischer Kleinbaum", title: "Purpur-Weide", latin: "Salix purpurea (Weidengewächse)", v1: "Wächst an Fluss- und Bachufern, oft in Gesellschaft anderer Weidenarten.", v2: "Schmale, oft gegenständig angeordnete Blätter mit bläulichem Schimmer und purpurrote junge Zweige.", v3: "Die sehr biegsamen Zweige wurden traditionell zum Flechten von Körben genutzt.", wiki: "https://de.wikipedia.org/wiki/Purpur-Weide" },
            { id: "36/45", type: "Heimischer Kleinbaum", title: "Korb-Weide", latin: "Salix viminalis (Weidengewächse)", v1: "Wächst an Flussufern und wird auch gezielt in Weidenkulturen zur Korbherstellung angebaut.", v2: "Sehr lange, schmale Blätter mit silbrig behaarter Unterseite und lange, biegsame Ruten.", v3: "Namensgeberin des traditionellen Korbflechter-Handwerks.", wiki: "https://de.wikipedia.org/wiki/Korb-Weide" },
            { id: "37/45", type: "Heimischer Laubbaum", title: "Traubeneiche", latin: "Quercus petraea (Buchengewächse)", v1: "Wächst bevorzugt auf trockeneren, oft sandigen oder felsigen Böden, häufig in Mittelgebirgen.", v2: "Blätter mit deutlich erkennbarem Blattstiel (im Gegensatz zur fast stiellosen Stieleiche), Eicheln fast ungestielt in Trauben.", v3: "Bildet oft besonders geradschaftige, wertvolle Stämme und ist wichtiger Bestandteil naturnaher Mittelgebirgswälder.", wiki: "https://de.wikipedia.org/wiki/Traubeneiche" },
            { id: "38/45", type: "Heimischer Laubbaum", title: "Moor-Birke", latin: "Betula pubescens (Birkengewächse)", v1: "Wächst in Mooren, feuchten Bruchwäldern und auf nassen, sauren Böden.", v2: "Im Gegensatz zur Hängebirke sind die Zweige nicht hängend und die Rinde bleibt oft länger bräunlich.", v3: "Verträgt Staunässe deutlich besser als die Hängebirke und besiedelt so nasse Moorstandorte.", wiki: "https://de.wikipedia.org/wiki/Moor-Birke" },
            { id: "39/45", type: "Verwildert / Essbar", title: "Edelkastanie (Esskastanie)", latin: "Castanea sativa (Buchengewächse)", v1: "Bereits von den Römern eingeführt, wächst sie heute vor allem in milden Weinbauregionen.", v2: "Lange, scharf gesägte Blätter und stachelige, grüne Fruchtbecher, die im Herbst aufplatzen.", v3: "Die essbaren Kastanien (Maronen) sind reich an Stärke und wurden früher als 'Brotbaum der Armen' bezeichnet.", wiki: "https://de.wikipedia.org/wiki/Edelkastanie" },
            { id: "40/45", type: "Heimischer Kleinbaum", title: "Kriechen-Pflaume", latin: "Prunus domestica subsp. insititia (Rosengewächse)", v1: "Wächst verwildert in Hecken und an Waldrändern, oft als Unterlage alter Streuobstsorten.", v2: "Dorniger Wuchs, weiße Blüten im April und kleine, runde, dunkelblaue Früchte.", v3: "Gilt als eine der ursprünglichen Kulturformen unserer heutigen Pflaumensorten.", wiki: "https://de.wikipedia.org/wiki/Kriechen-Pflaume" },
            { id: "41/45", type: "Heimischer Kleinbaum", title: "Bruchweide", latin: "Salix fragilis (Weidengewächse)", v1: "Wächst an Ufern von Flüssen und Gräben, oft als markanter Kopfbaum geschnitten.", v2: "Schmale, lanzettliche Blätter und Zweige, die bei Wind hörbar an der Basis abbrechen – daher der Name.", v3: "Die abgebrochenen Zweige bewurzeln sich leicht im feuchten Boden und verbreiten die Art so auf natürliche Weise.", wiki: "https://de.wikipedia.org/wiki/Bruch-Weide" },
            { id: "42/45", type: "Heimischer Laubbaum", title: "Grau-Pappel", latin: "Populus canescens (Weidengewächse)", v1: "Eine natürliche Kreuzung aus Silber- und Zitterpappel, wächst an Flussauen und feuchten Wäldern.", v2: "Rundliche Blätter mit graufilziger Unterseite, die im Wind silbrig schimmern.", v3: "Vereint Merkmale beider Elternarten und wird oft nur schwer von der Silberpappel unterschieden.", wiki: "https://de.wikipedia.org/wiki/Grau-Pappel" },
            { id: "43/45", type: "Alpiner Nadelstrauch", title: "Latschenkiefer (Bergkiefer)", latin: "Pinus mugo (Kieferngewächse)", v1: "Wächst als niedriger, oft kriechender Nadelstrauch an der alpinen Baumgrenze.", v2: "Dunkelgrüne, paarige Nadeln und kleine, symmetrische Zapfen an knorrigen, oft bodennahen Ästen.", v3: "Schützt als dichtes Gebüsch die Hänge vor Lawinen und Erosion.", wiki: "https://de.wikipedia.org/wiki/Berg-Kiefer" },
            { id: "44/45", type: "Alpiner Nadelbaum", title: "Zirbelkiefer (Arve)", latin: "Pinus cembra (Kieferngewächse)", v1: "Wächst als extrem langsamwüchsiger Baum an der oberen Waldgrenze der Alpen.", v2: "Fünf Nadeln pro Nadelbüschel (statt zwei wie bei der Waldkiefer) und große, klebrige Zapfen.", v3: "Das aromatische Holz wird traditionell für Zirbenstuben und Möbel geschätzt und soll beruhigend auf den Schlaf wirken.", wiki: "https://de.wikipedia.org/wiki/Zirbel-Kiefer" },
            { id: "45/45", type: "Heimischer Baum", title: "Sal-Weide (als Baum)", latin: "Salix caprea (Weidengewächse)", v1: "Kann als größter heimischer Weidenstrauch auch baumförmig bis zu zehn Meter hoch wachsen, an Waldrändern und Böschungen.", v2: "Breite, ovale Blätter und im zeitigen Frühjahr die bekannten pelzigen Palmkätzchen an den kahlen Zweigen.", v3: "Als frühester Nektarspender des Jahres von unschätzbarem Wert für Wildbienen und Hummelköniginnen.", wiki: "https://de.wikipedia.org/wiki/Sal-Weide" }
        ],
        straeucher: [
            { id: "01/45", type: "Heilkraut / Essbar", title: "Schwarzer Holunder", latin: "Sambucus nigra (Moschuskrautgewächse)", v1: "Häufiger Strauch an Waldrändern und in Gärten.", v2: "Trägt im Frühsommer duftende weiße Schirmdolden, im Herbst schwarze Beeren.", v3: "Blüten eignen sich für Sirup. Die Beeren müssen vor dem Verzehr unbedingt abgekocht werden!", wiki: "https://de.wikipedia.org/wiki/Schwarzer_Holunder" },
            { id: "02/45", type: "Essbar / Dornig", title: "Hundsrose", latin: "Rosa canina (Rosengewächse)", v1: "Wächst an Waldrändern, Hecken und sonnigen Hängen.", v2: "Trägt im Juni zartrosa Blüten und im Herbst rote, vitaminreiche Hagebutten.", v3: "Die Hagebutten eignen sich hervorragend für Marmelade, Tee und als Wildtierfutter.", wiki: "https://de.wikipedia.org/wiki/Hunds-Rose" },
            { id: "03/45", type: "Essbar", title: "Weißdorn", latin: "Crataegus monogyna (Rosengewächse)", v1: "Dorniger Strauch, der dichte Schutzhecken für Vögel bildet.", v2: "Gelappte Blätter, weiße Blüten im Mai und kleine, mehlig-rote Früchte im Herbst.", v3: "Blätter und Blüten sind ein anerkanntes Heilmittel zur Stärkung des Altersherzens.", wiki: "https://de.wikipedia.org/wiki/Eingriffeliger_Wei%C3%9Fdorn" },
            { id: "04/45", type: "Sehr Giftig", title: "Pfaffenhütchen", latin: "Euonymus europaeus (Spindelbaumgewächse)", v1: "Wächst in Hecken und an Waldrändern auf nährstoffreichen Böden.", v2: "Unscheinbare Blüten, aber im Herbst leuchtend rosa-orange Kapselfrüchte.", v3: "Die Früchte ähneln einer Bischofsmütze. Alle Teile sind stark herzgiftig.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliches_Pfaffenh%C3%BCtchen" },
            { id: "05/45", type: "Essbar", title: "Schwarzdorn (Schlehe)", latin: "Prunus spinosa (Rosengewächse)", v1: "Bildet extrem dornige, undurchdringliche Hecken an sonnigen Hängen.", v2: "Blüht im April strahlend weiß, noch weit vor dem Blattaustrieb.", v3: "Die herben, blauschwarzen Steinfrüchte werden erst nach dem ersten Frost süß und essbar.", wiki: "https://de.wikipedia.org/wiki/Schlehdorn" },
            { id: "06/45", type: "Essbar", title: "Gemeine Hasel", latin: "Corylus avellana (Birkengewächse)", v1: "Breit aufrechter Strauch, der in fast jedem Wald und Garten wächst.", v2: "Blüht sehr früh im Februar mit hängenden, gelben Staubbeutelkätzchen.", v3: "Bildet im Herbst die bekannten, nahrhaften und sehr schmackhaften Haselnüsse.", wiki: "https://de.wikipedia.org/wiki/Gemeine_Hasel" },
            { id: "07/45", type: "Heilkraut / Giftig", title: "Gemeiner Liguster", latin: "Ligustrum vulgare (Ölbaumgewächse)", v1: "Sehr häufig als Heckenpflanze in Gärten und Parkanlagen genutzt.", v2: "Halbwintergrüne, schmale Blätter und weiße, intensiv duftende Blütenrispen.", v3: "Trägt im Herbst glänzende, erbsengroße schwarze Beeren, die für den Menschen giftig sind.", wiki: "https://de.wikipedia.org/wiki/Gemeiner_Liguster" },
            { id: "08/45", type: "Heilkraut / Essbar", title: "Sanddorn", latin: "Hippophae rhamnoides (Ölweidengewächse)", v1: "Wächst auf Wilddünen der Küsten und in kiesigen Flusstälern.", v2: "Schmale, silbrig-graue Blätter und dornige Zweige mit leuchtend orangen Beeren.", v3: "Die Beeren sind extrem reich an Vitamin C ('Zitrone des Nordens') und schmecken sauer.", wiki: "https://de.wikipedia.org/wiki/Sanddorn" },
            { id: "09/45", type: "Vogelweide", title: "Rote Vogelbeere (Eberesche)", latin: "Sorbus aucuparia (Rosengewächse)", v1: "Wächst als großer Strauch oder kleiner Baum auf kargen Böden und im Wald.", v2: "Gefiederte Blätter und weiße Blütenstände, gefolgt von leuchtend roten Beeren.", v3: "Wichtige Nahrungsquelle für über 60 Vogelarten. Roh bitter, gekocht essbar.", wiki: "https://de.wikipedia.org/wiki/Eberesche" },
            { id: "10/45", type: "Heilkraut / Giftig", title: "Faulbaum", latin: "Frangula alnus (Kreuzdorngewächse)", v1: "Bevorzugt feuchte, saure Wälder und Moorböden.", v2: "Glatte Rinde, die beim Anschaben unangenehm riecht. Dreifarbige Beerenreife (Grün-Rot-Schwarz).", v3: "Die getrocknete Rinde ist ein bewährtes, starkes Abführmittel.", wiki: "https://de.wikipedia.org/wiki/Faulbaum" },
            { id: "11/45", type: "Essbar / Sauer", title: "Kornelkirsche", latin: "Cornus mas (Hartriegelgewächse)", v1: "Blüht bereits im März goldgelb in lichten Wäldern und Gärten.", v2: "Eiförmige Blätter mit bogenförmigen Nerven und glänzend rote, längliche Steinfrüchte.", v3: "Die reifen Früchte schmecken säuerlich-aromatisch und ergeben köstliche Marmeladen.", wiki: "https://de.wikipedia.org/wiki/Kornelkirsche" },
            { id: "12/45", type: "Heimischer Strauch", title: "Roter Hartriegel", latin: "Cornus sanguinea (Hartriegelgewächse)", v1: "Wächst in Hecken, an Waldrändern und auf Kalkböden, oft an den leuchtend roten Zweigen im Winter erkennbar.", v2: "Ovale, ganzrandige Blätter mit bogenförmigen Nerven und weiße Doldenblüten im Frühsommer.", v3: "Die schwarzblauen Früchte sind für Menschen ungenießbar bitter, aber wichtige Vogelnahrung.", wiki: "https://de.wikipedia.org/wiki/Roter_Hartriegel" },
            { id: "13/45", type: "Heimischer Strauch", title: "Gewöhnlicher Schneeball", latin: "Viburnum opulus (Moschuskrautgewächse)", v1: "Wächst an feuchten Waldrändern, Ufern und in Hecken.", v2: "Ahornähnlich gelappte Blätter und flache Blütendolden mit auffälligen, sterilen Außenblüten.", v3: "Die roten, glänzenden Beeren sind roh schwach giftig und schmecken bitter, gekocht früher zu Gelee verarbeitet.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnlicher_Schneeball" },
            { id: "14/45", type: "Heimischer Strauch", title: "Wolliger Schneeball", latin: "Viburnum lantana (Moschuskrautgewächse)", v1: "Wächst auf trockenen, kalkreichen Waldrändern und Gebüschen.", v2: "Runzelige, unterseits filzig behaarte Blätter und cremeweiße Blütendolden im Mai.", v3: "Die zunächst roten, später schwarzen Beeren sind für den Menschen leicht giftig.", wiki: "https://de.wikipedia.org/wiki/Wolliger_Schneeball" },
            { id: "15/45", type: "Giftig", title: "Rote Heckenkirsche", latin: "Lonicera xylosteum (Geißblattgewächse)", v1: "Wächst häufig in Hecken, an Waldrändern und in Gebüschen.", v2: "Paarweise stehende, ovale Blätter und unscheinbare, gelblich-weiße Blütenpaare.", v3: "Die paarweise stehenden roten Beeren sind giftig und werden oft mit essbaren Beeren verwechselt.", wiki: "https://de.wikipedia.org/wiki/Rote_Heckenkirsche" },
            { id: "16/45", type: "Heimischer Strauch", title: "Echter Kreuzdorn", latin: "Rhamnus cathartica (Kreuzdorngewächse)", v1: "Wächst auf trockenen Kalkböden, Hecken und Waldrändern.", v2: "Gegenständige, ovale Blätter und dornig endende Zweige, kleine gelbgrüne Blüten.", v3: "Die schwarzen Beeren wirken stark abführend und sind für den Menschen giftig.", wiki: "https://de.wikipedia.org/wiki/Echter_Kreuzdorn" },
            { id: "17/45", type: "Essbar / Heilkraut", title: "Gewöhnliche Berberitze", latin: "Berberis vulgaris (Berberitzengewächse)", v1: "Wächst an trockenen Waldrändern und Hecken, oft auf Kalkböden.", v2: "Dreiteilige Dornen an den Zweigen, gezähnte Blätter und hängende gelbe Blütentrauben.", v3: "Die sauren, roten Beeren sind reich an Vitamin C und werden getrocknet als Gewürz genutzt.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliche_Berberitze" },
            { id: "18/45", type: "Essbar / Selten", title: "Felsenbirne", latin: "Amelanchier ovalis (Rosengewächse)", v1: "Wächst selten an sonnigen, felsigen Kalkhängen und Trockenhängen.", v2: "Ovale, gezähnte Blätter, die jung weißfilzig behaart sind, und sternförmige weiße Blüten.", v3: "Die süßen, blauschwarzen Früchte schmecken ähnlich wie Heidelbeeren.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliche_Felsenbirne" },
            { id: "19/45", type: "Heimischer Strauch", title: "Alpen-Johannisbeere", latin: "Ribes alpinum (Stachelbeergewächse)", v1: "Wächst in schattigen Laubwäldern und Gebüschen, besonders in Mittelgebirgen.", v2: "Kleine, dreilappige Blätter und unscheinbare, grünlich-gelbe Blütentrauben.", v3: "Die roten Beeren sind essbar, aber deutlich weniger aromatisch als die Kultur-Johannisbeere.", wiki: "https://de.wikipedia.org/wiki/Alpen-Johannisbeere" },
            { id: "20/45", type: "Essbar", title: "Wilde Stachelbeere", latin: "Ribes uva-crispa (Stachelbeergewächse)", v1: "Wächst in schattigen Wäldern, Hecken und an Waldrändern.", v2: "Dreilappige Blätter und dornige Zweige, kleine grünlich-rote Glockenblüten.", v3: "Die stacheligen, grünen bis rötlichen Beeren sind die Wildform unserer Gartenstachelbeere.", wiki: "https://de.wikipedia.org/wiki/Stachelbeere" },
            { id: "21/45", type: "Essbar", title: "Wilde Rote Johannisbeere", latin: "Ribes rubrum (Stachelbeergewächse)", v1: "Wächst in feuchten Auwäldern und an Bachufern.", v2: "Fünflappige Blätter und hängende Trauben kleiner, grünlicher Blüten.", v3: "Die roten, säuerlichen Beeren sind die Wildform unserer Garten-Johannisbeeren.", wiki: "https://de.wikipedia.org/wiki/Rote_Johannisbeere" },
            { id: "22/45", type: "Essbar / Heilkraut", title: "Wilde Schwarze Johannisbeere", latin: "Ribes nigrum (Stachelbeergewächse)", v1: "Wächst in feuchten Erlenbrüchen und an Bachufern, oft mit intensivem Geruch beim Zerreiben der Blätter.", v2: "Gelappte Blätter mit gelben Duftdrüsen auf der Unterseite und hängende, grünliche Blütentrauben.", v3: "Die schwarzen, aromatischen Beeren sind extrem vitamin-C-reich, auch die Blätter werden als Tee genutzt.", wiki: "https://de.wikipedia.org/wiki/Schwarze_Johannisbeere" },
            { id: "23/45", type: "Essbar", title: "Weinrose", latin: "Rosa rubiginosa (Rosengewächse)", v1: "Wächst an trockenen, sonnigen Hecken und Wegrändern.", v2: "Kleine, gezähnte Blätter, die beim Zerreiben deutlich nach Apfel duften, und rosarote Blüten.", v3: "Die Hagebutten sind wie bei der Hundsrose essbar und besonders vitaminreich.", wiki: "https://de.wikipedia.org/wiki/Wein-Rose" },
            { id: "24/45", type: "Selten / Geschützt", title: "Gagelstrauch", latin: "Myrica gale (Gagelstrauchgewächse)", v1: "Wächst sehr selten in Mooren und feuchten Heiden Norddeutschlands.", v2: "Schmale, harzig duftende Blätter und unscheinbare, kätzchenartige Blüten vor dem Laubaustrieb.", v3: "Der aromatische Duft wurde traditionell zum Aromatisieren von Bier vor der Hopfennutzung verwendet.", wiki: "https://de.wikipedia.org/wiki/Gagelstrauch" },
            { id: "25/45", type: "Heimischer Zwergstrauch", title: "Kriech-Weide", latin: "Salix repens (Weidengewächse)", v1: "Wächst niederliegend in Dünen, Heiden und Mooren.", v2: "Kleine, schmale, seidig behaarte Blätter und aufrechte, kleine Kätzchen.", v3: "Ein wichtiger Dünenbefestiger mit weitreichendem Wurzelsystem.", wiki: "https://de.wikipedia.org/wiki/Kriech-Weide" },
            { id: "26/45", type: "Heimischer Strauch", title: "Ohr-Weide", latin: "Salix aurita (Weidengewächse)", v1: "Wächst auf feuchten, sauren Böden in Mooren und an Waldrändern.", v2: "Runzelige Blätter mit ohrartigen Nebenblättern an der Basis, graue Kätzchen im Frühjahr.", v3: "Eine typische Art nährstoffarmer, feuchter Heiden und Moorränder.", wiki: "https://de.wikipedia.org/wiki/Ohr-Weide" },
            { id: "27/45", type: "Heimischer Strauch", title: "Grau-Weide", latin: "Salix cinerea (Weidengewächse)", v1: "Wächst in feuchten Wäldern, Mooren und an Ufern, sehr anpassungsfähig.", v2: "Graufilzig behaarte Blattunterseiten und aufrechte, silbrig-graue Kätzchen.", v3: "Eine wichtige frühe Nahrungsquelle für Bienen und Falter im zeitigen Frühjahr.", wiki: "https://de.wikipedia.org/wiki/Grau-Weide" },
            { id: "28/45", type: "Giftig", title: "Besenginster", latin: "Cytisus scoparius (Hülsenfrüchtler)", v1: "Wächst auf sandigen, sauren Böden, Heiden und Böschungen, blüht leuchtend gelb im Mai.", v2: "Kantige, grüne Zweige und meist blattlose Triebe mit großen, gelben Schmetterlingsblüten.", v3: "Die Samen enthalten giftige Alkaloide, die Pflanze wurde historisch aber auch medizinisch genutzt.", wiki: "https://de.wikipedia.org/wiki/Besenginster" },
            { id: "29/45", type: "Heimischer Strauch", title: "Stechginster", latin: "Ulex europaeus (Hülsenfrüchtler)", v1: "Wächst auf sandigen, sauren Heideböden, vor allem in West- und Nordwestdeutschland.", v2: "Dicht bestachelte, grüne Zweige fast ohne Laubblätter und leuchtend gelbe Blüten fast ganzjährig.", v3: "Die dichten, stacheligen Bestände bieten Vögeln wertvollen Schutz vor Fressfeinden.", wiki: "https://de.wikipedia.org/wiki/Stechginster" },
            { id: "30/45", type: "Heimischer Zwergstrauch", title: "Besenheide", latin: "Calluna vulgaris (Heidekrautgewächse)", v1: "Der namensgebende Zwergstrauch weiter Heideflächen, blüht in dichten violetten Teppichen im Spätsommer.", v2: "Winzige, schuppenartige Blättchen und kleine, glockenförmige rosa-violette Blüten.", v3: "Eine der wichtigsten Nektarquellen für die Herstellung von Heidehonig.", wiki: "https://de.wikipedia.org/wiki/Besenheide" },
            { id: "31/45", type: "Heimischer Zwergstrauch", title: "Glockenheide", latin: "Erica tetralix (Heidekrautgewächse)", v1: "Wächst in feuchten Hochmooren und nassen Heiden, oft zusammen mit Torfmoosen.", v2: "Vierzählig quirlständige, nadelartige Blätter und größere, rosarote Blüten als die Besenheide.", v3: "Ein wichtiger Zeigerstrauch für intakte, nasse Moorheiden.", wiki: "https://de.wikipedia.org/wiki/Glocken-Heide" },
            { id: "32/45", type: "Essbar", title: "Preiselbeere", latin: "Vaccinium vitis-idaea (Heidekrautgewächse)", v1: "Wächst als immergrüner Zwergstrauch in sauren Nadelwäldern und auf Heideflächen.", v2: "Kleine, ledrige, glänzend dunkelgrüne Blätter und rosa-weiße Blütenglöckchen, gefolgt von roten Beeren.", v3: "Die säuerlichen Beeren sind reich an Benzoesäure, die als natürliches Konservierungsmittel wirkt.", wiki: "https://de.wikipedia.org/wiki/Preiselbeere" },
            { id: "33/45", type: "Essbar", title: "Heidelbeere (Blaubeere)", latin: "Vaccinium myrtillus (Heidekrautgewächse)", v1: "Bildet dichte Bestände im Unterwuchs saurer Nadel- und Mischwälder.", v2: "Kantige, grüne Zweige, kleine ovale Blätter und einzelne, rötliche Blütenglöckchen.", v3: "Die blauschwarzen, süßen Beeren zählen zu den beliebtesten heimischen Wildfrüchten.", wiki: "https://de.wikipedia.org/wiki/Heidelbeere" },
            { id: "34/45", type: "Essbar (in Maßen)", title: "Rauschbeere", latin: "Vaccinium uliginosum (Heidekrautgewächse)", v1: "Wächst in Hochmooren und feuchten Nadelwäldern, oft gemeinsam mit Preiselbeere und Heidelbeere.", v2: "Rundliche, graugrüne Blätter und blassrosa Blütenglöckchen, gefolgt von blaubereiften Beeren.", v3: "Der Verzehr großer Mengen kann leichte Kopfschmerzen verursachen, daher der Name.", wiki: "https://de.wikipedia.org/wiki/Rauschbeere" },
            { id: "35/45", type: "Streng Geschützt", title: "Deutsche Tamariske", latin: "Myricaria germanica (Tamariskengewächse)", v1: "Wächst extrem selten an naturnahen, kiesigen Fluss- und Wildbachufern der Alpen und Voralpen.", v2: "Schuppenartige, blaugrüne Blättchen und rosa Blütenähren an biegsamen Zweigen.", v3: "Eine der am stärksten gefährdeten Pioniersträucher an naturnahen Wildflüssen.", wiki: "https://de.wikipedia.org/wiki/Deutsche_Tamariske" },
            { id: "36/45", type: "Streng Geschützt", title: "Zwerg-Birke", latin: "Betula nana (Birkengewächse)", v1: "Wächst als eiszeitliches Relikt sehr selten in Hochmooren, vor allem im Harz und Erzgebirge.", v2: "Winzige, rundliche, gekerbte Blättchen an niederliegenden, verholzten Zweigen.", v3: "Ein Überbleibsel der letzten Eiszeit und eine der seltensten heimischen Gehölzarten.", wiki: "https://de.wikipedia.org/wiki/Zwerg-Birke" },
            { id: "37/45", type: "Geschützt", title: "Deutscher Ginster", latin: "Genista germanica (Hülsenfrüchtler)", v1: "Wächst selten auf trockenen, sandigen Heiden und in lichten Kiefernwäldern.", v2: "Dornige, behaarte Zweige und kleine, gelbe Schmetterlingsblüten in aufrechten Trauben.", v3: "Eine seltene Charakterart magerer, gehölzarmer Heideflächen.", wiki: "https://de.wikipedia.org/wiki/Deutscher_Ginster" },
            { id: "38/45", type: "Heimischer Zwergstrauch", title: "Färberginster", latin: "Genista tinctoria (Hülsenfrüchtler)", v1: "Wächst auf mageren Wiesen, Heiden und trockenen Böschungen.", v2: "Unbedornte, schmale Blätter und aufrechte, gelbe Blütentrauben im Sommer.", v3: "Diente traditionell zur Herstellung von gelbem und (mit Färberwaid) grünem Textilfarbstoff.", wiki: "https://de.wikipedia.org/wiki/F%C3%A4rber-Ginster" },
            { id: "39/45", type: "Giftig (roh)", title: "Traubenholunder (Strauch)", latin: "Sambucus racemosa (Moschuskrautgewächse)", v1: "Wächst in Bergwäldern, an Waldrändern und Schlägen, blüht bereits im April/Mai.", v2: "Gefiederte Blätter und kegelförmige, aufrechte Blütenrispen, im Sommer leuchtend rote Beeren.", v3: "Im Gegensatz zum Schwarzen Holunder sind die roten Beeren roh giftig und müssen abgekocht werden.", wiki: "https://de.wikipedia.org/wiki/Roter_Holunder" },
            { id: "40/45", type: "Selten", title: "Gewöhnliche Zwergmispel", latin: "Cotoneaster integerrimus (Rosengewächse)", v1: "Wächst selten an sonnigen, felsigen Kalkhängen und Trockenhängen.", v2: "Kleine, ovale, unterseits filzig behaarte Blätter und nickende, rosa Blüten.", v3: "Die roten Früchte sind für Menschen ungenießbar, aber wichtige Vogelnahrung im Herbst.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliche_Zwergmispel" },
            { id: "41/45", type: "Heimischer Strauch", title: "Purpur-Weide (Strauch)", latin: "Salix purpurea (Weidengewächse)", v1: "Wächst an Fluss- und Bachufern, oft in Gesellschaft anderer Weidenarten.", v2: "Schmale, oft gegenständig angeordnete Blätter mit bläulichem Schimmer und purpurrote junge Zweige.", v3: "Die sehr biegsamen Zweige wurden traditionell zum Flechten von Körben genutzt.", wiki: "https://de.wikipedia.org/wiki/Purpur-Weide" },
            { id: "42/45", type: "Heimischer Strauch", title: "Korb-Weide (Strauch)", latin: "Salix viminalis (Weidengewächse)", v1: "Wächst an Flussufern und wird auch gezielt in Weidenkulturen zur Korbherstellung angebaut.", v2: "Sehr lange, schmale Blätter mit silbrig behaarter Unterseite und lange, biegsame Ruten.", v3: "Namensgeberin des traditionellen Korbflechter-Handwerks.", wiki: "https://de.wikipedia.org/wiki/Korb-Weide" },
            { id: "43/45", type: "Stark Giftig", title: "Seidelbast (Strauch)", latin: "Daphne mezereum (Seidelbastgewächse)", v1: "Wächst in lichten Laubwäldern und an Waldrändern, blüht schon im Februar/März vor dem Laubaustrieb.", v2: "Rosa-violette, stark duftende Blüten sitzen direkt am kahlen Zweig, im Sommer folgen leuchtend rote Beeren.", v3: "Eine der giftigsten heimischen Pflanzen – schon wenige Beeren können für Kinder lebensgefährlich sein.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnlicher_Seidelbast" },
            { id: "44/45", type: "Geschützt", title: "Rostblättrige Alpenrose (Strauch)", latin: "Rhododendron ferrugineum (Heidekrautgewächse)", v1: "Bildet dichte Bestände an sauren, steinigen Hängen der Alpen oberhalb der Waldgrenze.", v2: "Lederartige, unterseits rostbraun beschuppte Blätter und leuchtend rosarote Blütendolden im Juni/Juli.", v3: "Eine der bekanntesten alpinen Blühpflanzen und namensgebend für ganze Almlandschaften.", wiki: "https://de.wikipedia.org/wiki/Rostbl%C3%A4ttrige_Alpenrose" },
            { id: "45/45", type: "Stark Giftig", title: "Sadebaum (Strauch)", latin: "Juniperus sabina (Zypressengewächse)", v1: "Wächst als Zierstrauch in Gärten und Friedhöfen, ursprünglich aus dem Mittelmeerraum stammend.", v2: "Schuppenartige, dunkelgrüne Nadeln mit unangenehmem Geruch beim Zerreiben.", v3: "Alle Pflanzenteile sind stark giftig und sollten in Gärten mit Kindern und Haustieren gemieden werden.", wiki: "https://de.wikipedia.org/wiki/Sadebaum" }
        ],
        wiesen: [
            { id: "01/45", type: "Essbar / Heilkraut", title: "Wiesen-Löwenzahn", latin: "Taraxacum officinale (Korbblütler)", v1: "Leuchtet ab April massenhaft gelb auf fast allen Wiesen.", v2: "Tief gezähnte Blätter in einer Rosette und hohle Stängel mit weißem Milchsaft.", v3: "Die jungen Blätter sind ein herber Salat, die Wurzel wirkt magenstärkend.", wiki: "https://de.wikipedia.org/wiki/L%C3%B6wenzahn_(Formenkreis)" },
            { id: "02/45", type: "Essbar", title: "Wiesen-Glockenblume", latin: "Campanula patula (Glockenblumengewächse)", v1: "Wächst auf mäßig feuchten, sonnigen Heuwiesen ab Mai.", v2: "Trägt lockere, rispige Blütenstände mit trichterförmigen, violettblauen Glocken.", v3: "Die zarten Blüten und Blätter schmecken mild-süßlich im Salat.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Glockenblume" },
            { id: "03/45", type: "Wiesenblume", title: "Margerite", latin: "Leucanthemum vulgare (Korbblütler)", v1: "Der Inbegriff der Sommerwiese. Blüht ab Mai im strahlenden Weiß-Gelb.", v2: "Spatelförmige, grob gezähnte Blätter und große, einzeln stehende Blütenköpfe.", v3: "Wichtige Pollenquelle für Wildbienen und Käfer.", wiki: "https://de.wikipedia.org/wiki/Magerwiesen-Margerite" },
            { id: "04/45", type: "Futterpflanze", title: "Rot-Klee", latin: "Trifolium pratense (Hülsenfrüchtler)", v1: "Wächst auf fast allen Wiesen und Weiden. Verbessert die Bodenqualität.", v2: "Dreizählige Blätter mit weißer V-Zeichnung und kugelige, rote Blütenköpfe.", v3: "Die süßen Blütenröhren werden gerne von Hummeln ausgesaugt.", wiki: "https://de.wikipedia.org/wiki/Rot-Klee" },
            { id: "05/45", type: "Essbar / Gewürz", title: "Wiesen-Kümmel", latin: "Carum carvi (Doldenblütler)", v1: "Bevorzugt nährstoffreiche Fettwiesen. Blüht weiß im Mai/Juni.", v2: "Gefiederte Blätter und doppeltdoldige Blüten. Früchte riechen intensiv aromatisch.", v3: "Ein traditionelles Gewürz für Brot, Kohl und deftige Speisen.", wiki: "https://de.wikipedia.org/wiki/Echter_K%C3%BCmmel" },
            { id: "06/45", type: "Heilkraut", title: "Gemeine Schafgarbe", latin: "Achillea millefolium (Korbblütler)", v1: "Wächst auf fast jeder Wiese und an trockenen Wegrändern.", v2: "Tausendfach feingefiedertes Blatt und weiße bis rosa Scheindolden.", v3: "Enthält wie Kamille entzündungshemmendes Azulen. Ein klassisches Heilkraut.", wiki: "https://de.wikipedia.org/wiki/Gemeine_Schafgarbe" },
            { id: "07/45", type: "Essbar / Futter", title: "Wiesen-Knautie", latin: "Knautia arvensis (Geißblattgewächse)", v1: "Wächst auf nährstoffreichen Wiesen. Blüht von Juni bis September.", v2: "Gegenständige, fiederspaltige Blätter und flache, blauviolette Blütenköpfchen.", v3: "Sehr beliebte Nektarquelle für Schmetterlinge.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Witwenblume" },
            { id: "08/45", type: "Essbar", title: "Wiesen-Bocksbart", latin: "Tragopogon pratensis (Korbblütler)", v1: "Wächst auf sonnigen, frischen Wiesen. Blüht leuchtend gelb.", v2: "Die Blüten öffnen sich nur am Vormittag und schließen sich bei Wolken rasch.", v3: "Die jungen Triebe und die milchsaftreiche Pfahlwurzel sind gekocht essbar.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Bocksbart" },
            { id: "09/45", type: "Heilkraut", title: "Echter Beinwell", latin: "Symphytum officinale (Raublattgewächse)", v1: "Wächst an feuchten Gräben, Bachufern und nassen Wiesen.", v2: "Große, sehr raue Blätter und hängende, glockenförmige violette Blüten.", v3: "Die Wurzel enthält Allantoin und lindert Schmerzen bei Verstauchungen.", wiki: "https://de.wikipedia.org/wiki/Echter_Beinwell" },
            { id: "10/45", type: "Wiesenblume", title: "Kuckucks-Lichtnelke", latin: "Silene flos-cuculi (Nelkengewächse)", v1: "Wächst auf feuchten bis nassen Moorwiesen ab Mai.", v2: "Schmale Blätter und tief vierspaltige, geschlitzte rosa Blüten.", v3: "Auf den Stängeln findet man oft den schaumigen 'Kuckucksspeichel' (Zikadenlarven).", wiki: "https://de.wikipedia.org/wiki/Kuckucks-Lichtnelke" },
            { id: "11/45", type: "Schwach Giftig", title: "Scharfer Hahnenfuß", latin: "Ranunculus acris (Hahnenfußgewächse)", v1: "Überzieht feuchte Wiesen ab Mai mit einem gelben Blütenmeer.", v2: "Tief geteilte Blätter und glänzende, schalenförmige gelbe Blüten.", v3: "Wird vom Weidevieh wegen des scharfen, giftigen Geschmacks gemieden.", wiki: "https://de.wikipedia.org/wiki/Scharfer_Hahnenfu%C3%9F" },
            { id: "12/45", type: "Wiesenblume", title: "Wiesen-Storchschnabel", latin: "Geranium pratense (Storchschnabelgewächse)", v1: "Wächst auf frischen, nährstoffreichen Wiesen, oft an Wegrändern und Gräben.", v2: "Tief geteilte, gezähnte Blätter und große, violettblaue Blüten mit fein geäderten Kronblättern.", v3: "Die schnabelförmigen Fruchtkapseln schleudern die Samen bei Reife explosionsartig weg.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Storchschnabel" },
            { id: "13/45", type: "Wiesenblume", title: "Wiesen-Platterbse", latin: "Lathyrus pratensis (Hülsenfrüchtler)", v1: "Rankt mit dünnen Ranken zwischen hohen Gräsern auf Wiesen und an Wegrändern.", v2: "Paarige, schmale Blättchen mit verzweigten Ranken und leuchtend gelbe Schmetterlingsblüten.", v3: "Eine wichtige Nektar- und Futterpflanze für Wildbienen und Schmetterlingsraupen.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Platterbse" },
            { id: "14/45", type: "Wiesenblume", title: "Gewöhnlicher Hornklee", latin: "Lotus corniculatus (Hülsenfrüchtler)", v1: "Wächst auf mageren bis mittelfetten Wiesen, Wegrändern und Böschungen.", v2: "Gefiederte Blätter und leuchtend gelbe, oft rötlich überlaufene Blütenköpfchen.", v3: "Die hornartig gebogenen Hülsenfrüchte gaben der Pflanze ihren Namen.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnlicher_Hornklee" },
            { id: "15/45", type: "Wiesenblume / Essbar", title: "Kleiner Wiesenknopf", latin: "Sanguisorba minor (Rosengewächse)", v1: "Wächst auf trockenen, kalkreichen Magerwiesen und Böschungen.", v2: "Gefiederte, gurkig duftende Blätter und kugelige, grünlich-rote Blütenköpfchen ohne Kronblätter.", v3: "Die jungen Blätter schmecken erfrischend nach Gurke und würzen Salate und Kräuterquark.", wiki: "https://de.wikipedia.org/wiki/Kleiner_Wiesenknopf" },
            { id: "16/45", type: "Wiesenblume / Rote Liste", title: "Kornblume", latin: "Centaurea cyanus (Korbblütler)", v1: "Ursprünglich ein Getreideunkraut, heute durch intensive Landwirtschaft selten geworden.", v2: "Schmale, graugrüne Blätter und leuchtend kornblumenblaue Blütenköpfe.", v3: "Früher ein fester Bestandteil bunter Kornfelder, heute vor allem an Feldrändern und in Blühstreifen zu finden.", wiki: "https://de.wikipedia.org/wiki/Kornblume" },
            { id: "17/45", type: "Wiesenblume", title: "Klatschmohn (Wiese)", latin: "Papaver rhoeas (Mohngewächse)", v1: "Leuchtet ab Mai in dichten roten Teppichen auf Äckern, Brachflächen und Wegrändern.", v2: "Fein gefiederte Blätter und die unverwechselbaren, leuchtend roten, oft schwarz gefleckten Blüten.", v3: "Jede einzelne Blüte hält oft nur einen Tag, wird aber ständig durch neue Knospen ersetzt.", wiki: "https://de.wikipedia.org/wiki/Klatschmohn" },
            { id: "18/45", type: "Wiesenblume", title: "Tauben-Skabiose", latin: "Scabiosa columbaria (Geißblattgewächse)", v1: "Wächst auf trockenen, kalkreichen Magerwiesen und Trockenrasen.", v2: "Fein gefiederte Stängelblätter und lockere, blasslila Blütenköpfe auf langen, dünnen Stielen.", v3: "Eine wichtige Nektarquelle für Schmetterlinge und Wildbienen auf mageren Standorten.", wiki: "https://de.wikipedia.org/wiki/Tauben-Skabiose" },
            { id: "19/45", type: "Wiesenblume", title: "Wiesen-Flockenblume", latin: "Centaurea jacea (Korbblütler)", v1: "Wächst auf mageren bis mittelfetten Wiesen und blüht von Juni bis in den Herbst hinein.", v2: "Schmale, ungeteilte Blätter und purpurrote Blütenköpfe mit trockenhäutigen, braunen Hüllblatträndern.", v3: "Eine der häufigsten und wertvollsten Nektarquellen unserer Wiesen für Schmetterlinge.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Flockenblume" },
            { id: "20/45", type: "Wiesengras", title: "Zittergras", latin: "Briza media (Süßgräser)", v1: "Wächst auf mageren, trockenen bis frischen Wiesen und Böschungen.", v2: "Schmale Grundblätter und herzförmige, an dünnen Stielen hängende Ährchen, die im Wind ständig zittern.", v3: "Eines der dekorativsten heimischen Gräser, auch beliebt in Trockensträußen.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliches_Zittergras" },
            { id: "21/45", type: "Wiesengras", title: "Wiesen-Fuchsschwanz", latin: "Alopecurus pratensis (Süßgräser)", v1: "Eines der ersten blühenden Gräser auf frischen, nährstoffreichen Wiesen im Mai.", v2: "Weiche, walzenförmige, fuchsschwanzartige Blütenähren an aufrechten Halmen.", v3: "Ein wertvolles Futtergras und wichtiger Indikator für gut gedüngte Wiesen.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Fuchsschwanzgras" },
            { id: "22/45", type: "Wiesengras", title: "Wiesen-Schwingel", latin: "Festuca pratensis (Süßgräser)", v1: "Häufiges Gras auf frischen bis feuchten Wiesen und Weiden.", v2: "Flache, glänzend grüne Blätter und lockere, überhängende Rispen.", v3: "Eines der wertvollsten Futtergräser des Wirtschaftsgrünlands.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Schwingel" },
            { id: "23/45", type: "Wiesengras", title: "Glatthafer", latin: "Arrhenatherum elatius (Süßgräser)", v1: "Dominiert typische, artenreiche Fettwiesen und gibt der 'Glatthaferwiese' ihren Namen.", v2: "Hohe, glatte Halme und lockere, glänzende Rispen mit begrannten Ährchen.", v3: "Eine der charakteristischsten und artenreichsten Wiesengesellschaften Mitteleuropas trägt seinen Namen.", wiki: "https://de.wikipedia.org/wiki/Glatthafer" },
            { id: "24/45", type: "Wiesengras", title: "Wiesen-Rispengras", latin: "Poa pratensis (Süßgräser)", v1: "Eines der häufigsten Gräser auf Wiesen, Weiden und Rasenflächen.", v2: "Schmale, glatte Blätter mit charakteristischer 'Kanuspitze' und lockere, pyramidenförmige Rispen.", v3: "Bildet durch unterirdische Ausläufer dichte, strapazierfähige Grasnarben – daher beliebt als Rasengras.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Rispengras" },
            { id: "25/45", type: "Wiesenblume", title: "Zaunwicke", latin: "Vicia sepium (Hülsenfrüchtler)", v1: "Rankt an Hecken, Zäunen und zwischen hohen Wiesenpflanzen.", v2: "Gefiederte Blättchen mit verzweigten Ranken und blassviolette Blütenbüschel.", v3: "Eine wichtige Futterpflanze für die Raupen mehrerer heimischer Bläulinge.", wiki: "https://de.wikipedia.org/wiki/Zaun-Wicke" },
            { id: "26/45", type: "Wiesenblume", title: "Vogel-Wicke", latin: "Vicia cracca (Hülsenfrüchtler)", v1: "Rankt üppig zwischen hohen Gräsern auf Wiesen und an Wegrändern.", v2: "Gefiederte Blättchen mit Ranken und dichte, einseitswendige Trauben blauvioletter Blüten.", v3: "Eine ergiebige Nektarquelle für Hummeln, deren langer Rüssel perfekt zur Blütenform passt.", wiki: "https://de.wikipedia.org/wiki/Vogel-Wicke" },
            { id: "27/45", type: "Wiesenblume", title: "Wiesen-Bärenklau (Wiese)", latin: "Heracleum sphondylium (Doldenblütler)", v1: "Wächst häufig auf Wiesen, an Wegrändern und Waldsäumen – nicht zu verwechseln mit dem giftigen Riesen-Bärenklau.", v2: "Große, grob gefiederte Blätter und weiße bis grünliche Doldenblüten an kantigen, behaarten Stängeln.", v3: "Eine wichtige Nektarquelle für zahlreiche Insekten und traditionell auch als Wildgemüse genutzt.", wiki: "https://de.wikipedia.org/wiki/Wiesen-B%C3%A4renklau" },
            { id: "28/45", type: "Wiesenblume / Essbar", title: "Wilde Möhre (Wiese)", latin: "Daucus carota (Doldenblütler)", v1: "Die Urform unserer Karotte wächst auf sonnigen Wiesen und an Wegrändern.", v2: "Weiße Doppeldolden mit einer charakteristischen, fast schwarzen 'Lockblüte' in der Mitte.", v3: "Die weiße Pfahlwurzel riecht intensiv nach Karotte und schmeckt im ersten Jahr süßlich.", wiki: "https://de.wikipedia.org/wiki/Wilde_M%C3%B6hre" },
            { id: "29/45", type: "Wiesenblume / Heilkraut", title: "Frauenmantel (Wiese)", latin: "Alchemilla vulgaris (Rosengewächse)", v1: "Wächst auf feuchten Wiesen, an Wegrändern und in Gärten, besonders in höheren Lagen häufig.", v2: "Rundliche, gefaltete Blätter, an deren Rand sich morgens glitzernde Tautropfen sammeln.", v3: "Zählt zu den charakteristischen Kräutern artenreicher Bergwiesen.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnlicher_Frauenmantel" },
            { id: "30/45", type: "Schwach Giftig", title: "Kriechender Hahnenfuß", latin: "Ranunculus repens (Hahnenfußgewächse)", v1: "Wächst auf feuchten, oft verdichteten Wiesen, Weiden und Gartenrasen.", v2: "Dreiteilige, gefleckte Blätter an kriechenden, wurzelnden Ausläufern und glänzend gelbe Blüten.", v3: "Bildet durch die Ausläufer schnell dichte Bestände und wird vom Weidevieh gemieden.", wiki: "https://de.wikipedia.org/wiki/Kriechender_Hahnenfu%C3%9F" },
            { id: "31/45", type: "Wiesenblume", title: "Rundblättrige Glockenblume", latin: "Campanula rotundifolia (Glockenblumengewächse)", v1: "Wächst auf trockenen, mageren Wiesen und Böschungen, oft an sonnigen Hängen.", v2: "Runde Grundblätter, die zur Blütezeit oft schon verwelkt sind, und schmale Stängelblätter mit nickenden, blauen Glockenblüten.", v3: "Eine der zierlichsten und ausdauerndsten heimischen Glockenblumenarten.", wiki: "https://de.wikipedia.org/wiki/Rundbl%C3%A4ttrige_Glockenblume" },
            { id: "32/45", type: "Wiesenblume", title: "Acker-Stiefmütterchen", latin: "Viola arvensis (Veilchengewächse)", v1: "Wächst auf Äckern, mageren Wiesen und Brachflächen, blüht fast das ganze Jahr.", v2: "Kleine, cremeweiß-gelbe Blüten mit dünnen violetten Aderungen, deutlich kleiner als das Garten-Stiefmütterchen.", v3: "Die Wildform aller gezüchteten Stiefmütterchensorten.", wiki: "https://de.wikipedia.org/wiki/Acker-Stiefm%C3%BCtterchen" },
            { id: "33/45", type: "Wiesenblume", title: "Gelbes Leinkraut (Frauenflachs)", latin: "Linaria vulgaris (Wegerichgewächse)", v1: "Wächst auf trockenen Wiesen, Böschungen und an Bahndämmen.", v2: "Schmale, grasähnliche Blätter und leuchtend gelbe, löwenmäulchenartige Blüten mit orangem Gaumen.", v3: "Der lange Sporn speichert Nektar, den nur langrüsselige Hummeln erreichen können.", wiki: "https://de.wikipedia.org/wiki/Gew%C3%B6hnliches_Leinkraut" },
            { id: "34/45", type: "Wiesenblume / Essbar", title: "Wiesen-Pippau (Wiese)", latin: "Crepis biennis (Korbblütler)", v1: "Wächst häufig auf nährstoffreichen Wiesen und an Wegrändern, blüht leuchtend gelb ab Mai.", v2: "Grundständige, buchtig gezähnte Blätter und lockere Rispen kleiner, löwenzahnähnlicher Blütenköpfe.", v3: "Eine der häufigsten gelbblühenden Korbblütler unserer Frühsommerwiesen.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Pippau" },
            { id: "35/45", type: "Wiesenblume / Essbar", title: "Weiß-Klee (Wiese)", latin: "Trifolium repens (Hülsenfrüchtler)", v1: "Wächst kriechend auf fast jedem Rasen, jeder Weide und Wiese Mitteleuropas.", v2: "Dreizählige Blätter mit hellem V-Fleck und kugelige, weiße Blütenköpfe an langen Stielen.", v3: "Als stickstoffbindende Pflanze verbessert er die Bodenqualität ganz von selbst.", wiki: "https://de.wikipedia.org/wiki/Wei%C3%9F-Klee" },
            { id: "36/45", type: "Wiesenblume", title: "Wiesenschaumkraut (Wiese)", latin: "Cardamine pratensis (Kreuzblütler)", v1: "Überzieht feuchte Wiesen ab April mit einem zarten, lila-weißen Blütenteppich.", v2: "Gefiederte Blätter und vierblättrige, hellviolette bis weiße Blüten in lockeren Trauben.", v3: "Eine der wichtigsten Futterpflanzen für die Raupen des Aurorafalters.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Schaumkraut" },
            { id: "37/45", type: "Wiesenblume / Heilkraut", title: "Spitzwegerich (Wiese)", latin: "Plantago lanceolata (Wegerichgewächse)", v1: "Wächst auf mageren bis nährstoffreichen Wiesen, Wegrändern und in Gärten – eine der häufigsten Wiesenpflanzen überhaupt.", v2: "Schmale, lanzettliche Blätter mit parallelen Blattadern in einer Rosette; walzenförmige Ährenblüten an langen, kantigen Stielen.", v3: "Ein verlässlicher Zeiger für mäßig genutztes, artenreiches Grünland.", wiki: "https://de.wikipedia.org/wiki/Spitzwegerich" },
            { id: "38/45", type: "Wiesenblume / Heilkraut", title: "Wiesen-Salbei (Wiese)", latin: "Salvia pratensis (Lippenblütler)", v1: "Bevorzugt kalkreiche, sonnige Magerwiesen und blüht ab Mai in kräftigem Violett.", v2: "Gekerbte, runzelige Blätter und große Lippenblüten mit einem raffinierten Hebelmechanismus.", v3: "Eine Charakterart artenreicher, wenig gedüngter Kalkmagerwiesen.", wiki: "https://de.wikipedia.org/wiki/Wiesen-Salbei" },
            { id: "39/45", type: "Wiesenblume", title: "Sumpf-Vergissmeinnicht", latin: "Myosotis scorpioides (Raublattgewächse)", v1: "Wächst auf feuchten bis nassen Wiesen, an Ufern und Gräben.", v2: "Kahlere, glänzendere Blätter als das Wald-Vergissmeinnicht und größere, leuchtend blaue Blüten.", v3: "Bevorzugt deutlich feuchtere Standorte als andere heimische Vergissmeinnicht-Arten.", wiki: "https://de.wikipedia.org/wiki/Sumpf-Vergissmeinnicht" },
            { id: "40/45", type: "Wiesenblume", title: "Moschus-Malve", latin: "Malva moschata (Malvengewächse)", v1: "Wächst auf frischen, mageren Wiesen und an Wegrändern.", v2: "Tief fiederteilige Stängelblätter und große, zartrosa Blüten mit moschusartigem Duft.", v3: "Eine der zartesten und duftendsten heimischen Malvenarten.", wiki: "https://de.wikipedia.org/wiki/Moschus-Malve" },
            { id: "41/45", type: "Wiesenblume / Gewürz", title: "Kleine Bibernelle (Wiese)", latin: "Pimpinella saxifraga (Doldenblütler)", v1: "Wächst auf trockenen Magerwiesen und Kalkmagerrasen, blüht weiß im Sommer.", v2: "Unpaarig gefiederte Grundblätter und feine, filigrane Stängelblätter mit lockeren weißen Dolden.", v3: "Eine typische Charakterart mageren, artenreichen Grünlands.", wiki: "https://de.wikipedia.org/wiki/Kleine_Bibernelle" },
            { id: "42/45", type: "Wiesenblume", title: "Wiesen-Silge", latin: "Silaum silaus (Doldenblütler)", v1: "Wächst auf frischen, ungedüngten Wiesen und gilt als Zeigerpflanze für alte, extensiv genutzte Bestände.", v2: "Fein gefiederte, graugrüne Blätter und lockere, gelbliche Doppeldolden.", v3: "Durch die Intensivierung der Landwirtschaft in vielen Regionen selten geworden.", wiki: "https://de.wikipedia.org/wiki/Wiesensilge" },
            { id: "43/45", type: "Wiesenblume", title: "Kleiner Klappertopf", latin: "Rhinanthus minor (Sommerwurzgewächse)", v1: "Wächst als Halbschmarotzer auf mageren, ungedüngten Wiesen, oft gemeinsam mit Gräsern.", v2: "Gegenständige, gezähnte Blätter und gelbe Lippenblüten in aufgeblasenen, grünen Kelchen.", v3: "Die reifen Samen rasseln hörbar im aufgeblasenen Kelch – daher der Name Klappertopf.", wiki: "https://de.wikipedia.org/wiki/Kleiner_Klappertopf" },
            { id: "44/45", type: "Wiesenblume", title: "Golddistel", latin: "Carlina vulgaris (Korbblütler)", v1: "Wächst auf trockenen, mageren Wiesen und Kalkmagerrasen, blüht im Spätsommer.", v2: "Stachelig gezähnte Blätter und goldgelbe, sternförmig strahlende Hüllblätter um den Blütenkorb.", v3: "Verwandt mit der Silberdistel, aber deutlich aufrechter wachsend und weniger selten.", wiki: "https://de.wikipedia.org/wiki/Golddistel" },
            { id: "45/45", type: "Wiesenblume", title: "Weiße Lichtnelke", latin: "Silene latifolia (Nelkengewächse)", v1: "Wächst auf Wiesen, an Wegrändern und Ruderalflächen, blüht abends duftend.", v2: "Behaarte, gegenständige Blätter und weiße, fünfzählige Blüten mit tief gespaltenen Kronblättern.", v3: "Öffnet ihre Blüten erst am Abend und wird von Nachtfaltern bestäubt.", wiki: "https://de.wikipedia.org/wiki/Wei%C3%9Fe_Lichtnelke" }
        ],
        wald: [
            { id: "01/45", type: "Waldpflanze", title: "Waldmeister", latin: "Galium odoratum (Rötegewächse)", v1: "Wächst in schattigen Buchenwäldern und bildet grüne Teppiche.", v2: "Quirlständige Blätter und winzige, weiße, duftende Sternblüten.", v3: "Das typische Aroma (Cumarin) entfaltet sich erst im leicht angewelkten Zustand.", wiki: "https://de.wikipedia.org/wiki/Waldmeister" },
            { id: "02/45", type: "Heilkraut / Wald", title: "Wald-Sauerklee", latin: "Oxalis acetosella (Sauerkleegewächse)", v1: "Wächst an schattigen, moosigen Stellen in Nadel- und Laubwäldern.", v2: "Kleeblattartige, dreizählige Blätter und zarte, weiß-violett geäderte Blüten.", v3: "Die Blätter schmecken erfrischend sauer, enthalten aber viel Oxalsäure.", wiki: "https://de.wikipedia.org/wiki/Wald-Sauerklee" },
            { id: "03/45", type: "Waldpflanze", title: "Echte Sternmiere", latin: "Stellaria holostea (Nelkengewächse)", v1: "Wächst an Waldrändern und in lichten Laubwäldern ab April.", v2: "Grasartige, raue Blätter und große, tief gespaltene weiße Blütensterne.", v3: "Die reifen Kapseln schleudern ihre Samen bei Berührung explosiv heraus.", wiki: "https://de.wikipedia.org/wiki/Gro%C3%9Fe_Sternmiere" },
            { id: "04/45", type: "Schwach Giftig", title: "Wald-Ziegelwurz", latin: "Geum rivale (Rosengewächse)", v1: "Wächst in feuchten Schluchtwäldern und an schattigen Bachläufen.", v2: "Nickende, glockenförmige Blüten mit rötlich-braunen Kelchblättern.", v3: "Die Wurzel riecht wie Nelkenwurz aromatisch nach Nelken.", wiki: "https://de.wikipedia.org/wiki/Bach-Nelkenwurz" },
            { id: "05/45", type: "Geschützt", title: "Rote Lichtnelke", latin: "Silene dioica (Nelkengewächse)", v1: "Wächst an feuchten Waldrändern und in schattigen Gebüschen.", v2: "Behaarte Blätter und leuchtend purpurrote, geruchlose Blüten.", v3: "Blüht von Mai bis September und wird vor allem von Hummeln bestäubt.", wiki: "https://de.wikipedia.org/wiki/Rote_Lichtnelke" },
            { id: "06/45", type: "Waldpflanze", title: "Große Sterndolde", latin: "Astrantia major (Doldenblütler)", v1: "Wächst in feuchten Berg- und Schluchtwäldern. Sehr dekorativ.", v2: "Handförmige Blätter und weiß-rosa, von Hochblättern umgebene Blüten.", v3: "Wird wegen der aparten Blüten auch gerne im Garten kultiviert.", wiki: "https://de.wikipedia.org/wiki/Gro%C3%9Fe_Sterndolde" },
            { id: "07/45", type: "Waldpflanze", title: "Vielblütige Weißwurz", latin: "Polygonatum multiflorum (Spargelgewächse)", v1: "Wächst im Halbschatten von Laub- und Mischwäldern ab Mai.", v2: "Überhängende Stängel mit zweizeiligen Blättern und hängenden, weißen Glocken.", v3: "Die entstehenden blauschwarzen Beeren sind für den Menschen stark giftig.", wiki: "https://de.wikipedia.org/wiki/Vielbl%C3%BCtige_Wei%C3%9Fwurz" },
            { id: "08/45", type: "Waldpflanze", title: "Gemeine Goldnessel", latin: "Lamium galeobdolon (Lippenblütler)", v1: "Kriechender Bodendecker in schattigen Buchenwäldern.", v2: "Blätter oft weiß gemustert. Große, hellgelbe Lippenblüten ab Mai.", v3: "Die jungen Blatttriebe schmecken gekocht ähnlich wie Spinat.", wiki: "https://de.wikipedia.org/wiki/Goldnessel" },
            { id: "09/45", type: "Waldpflanze", title: "Quirlblättriges Salomonssiegel", latin: "Polygonatum verticillatum (Spargelgewächse)", v1: "Wächst in schattigen Schlucht- und Bergwäldern.", v2: "Schmale Blätter stehen in Quirlen am aufrechten, kantigen Stängel.", v3: "Die hängenden Blüten sind grünlich-weiß. Beeren färben sich rot bis schwarz.", wiki: "https://de.wikipedia.org/wiki/Quirlbl%C3%A4ttriges_Salomonssiegel" },
            { id: "10/45", type: "Waldpflanze", title: "Wald-Witwenblume", latin: "Knautia dipsacifolia (Geißblattgewächse)", v1: "Wächst an lichten Waldwegen und auf feuchten Waldlichtungen.", v2: "Grob gezähnte, ungeteilte Blätter und hell-violette Blütenköpfe ab Juni.", v3: "Eine sehr wichtige Futterpflanze für Wald-Schmetterlinge.", wiki: "https://de.wikipedia.org/wiki/Wald-Witwenblume" },
            { id: "11/45", type: "Schwach Giftig", title: "Christusträne (Salomonssiegel)", latin: "Polygonatum odoratum (Spargelgewächse)", v1: "Wächst in lichten, trockenen Eichen- und Kiefernwäldern.", v2: "Kantiger Stängel und duftende, weiße Einzelglocken in den Blattachseln.", v3: "Wurde früher im Volksglauben als magische Schutzpflanze angesehen.", wiki: "https://de.wikipedia.org/wiki/Echtes_Salomonssiegel" },
            { id: "12/45", type: "Waldpflanze", title: "Wald-Geißblatt", latin: "Lonicera periclymenum (Geißblattgewächse)", v1: "Rankt an Waldrändern, in Hecken und lichten Laubwäldern, blüht stark duftend im Sommer.", v2: "Ovale, gegenständige Blätter und gelb-rötliche, röhrenförmige Blüten in dichten Büscheln.", v3: "Der intensive Abendduft lockt vor allem Nachtfalter zur Bestäubung an.", wiki: "https://de.wikipedia.org/wiki/Wald-Gei%C3%9Fblatt" },
            { id: "13/45", type: "Waldpflanze / Giftig", title: "Gefleckter Aronstab (Wald)", latin: "Arum maculatum (Aronstabgewächse)", v1: "Wächst im Schatten feuchter Laubwälder ab April, oft an nährstoffreichen Standorten.", v2: "Pfeilförmige, oft gefleckte Blätter und ein Blütenkolben mit braunviolettem Stab.", v3: "Ein charakteristischer Zeiger nährstoffreicher Laubwälder – alle Pflanzenteile sind giftig.", wiki: "https://de.wikipedia.org/wiki/Gefleckter_Aronstab" },
            { id: "14/45", type: "Waldpflanze", title: "Wald-Schachtelhalm", latin: "Equisetum sylvaticum (Schachtelhalmgewächse)", v1: "Wächst in feuchten, schattigen Laub- und Nadelwäldern sowie an Waldwegen.", v2: "Zart und mehrfach verzweigte, überhängende Äste geben ihm ein filigranes, farnähnliches Aussehen.", v3: "Der zierlichste heimische Schachtelhalm und ein Zeiger feuchter Waldstandorte.", wiki: "https://de.wikipedia.org/wiki/Wald-Schachtelhalm" },
            { id: "15/45", type: "Waldgras", title: "Wald-Flattergras", latin: "Milium effusum (Süßgräser)", v1: "Wächst in schattigen, nährstoffreichen Laubwäldern, oft an feuchten Stellen.", v2: "Breite, weiche Blätter und lockere, flatterig überhängende Rispen.", v3: "Ein verlässlicher Zeiger für alte, ungestörte Laubwälder.", wiki: "https://de.wikipedia.org/wiki/Wald-Flattergras" },
            { id: "16/45", type: "Waldpflanze", title: "Finger-Segge", latin: "Carex digitata (Sauergräser)", v1: "Wächst in trockenen bis frischen Laubwäldern, oft auf kalkreichen Böden.", v2: "Schmale, überhängende Blätter und dünne, fingerartig angeordnete Ährchen.", v3: "Eine unscheinbare, aber typische Charakterart alter Buchenwälder.", wiki: "https://de.wikipedia.org/wiki/Finger-Segge" },
            { id: "17/45", type: "Waldpflanze", title: "Wald-Segge", latin: "Carex sylvatica (Sauergräser)", v1: "Wächst in schattigen Laubwäldern, oft in großen, horstbildenden Beständen.", v2: "Breite, hellgrüne Blätter und lange, dünne, hängende weibliche Ährchen.", v3: "Eine der häufigsten Seggenarten in mitteleuropäischen Laubwäldern.", wiki: "https://de.wikipedia.org/wiki/Wald-Segge" },
            { id: "18/45", type: "Waldpflanze / Giftig", title: "Wald-Bingelkraut (Wald)", latin: "Mercurialis perennis (Wolfsmilchgewächse)", v1: "Bildet dichte, teppichartige Bestände am Boden schattiger Laubwälder, blüht unscheinbar von März bis Mai.", v2: "Gegenständige, ovale Blätter und winzige, grünliche Blüten an dünnen Ähren.", v3: "Ein verlässlicher Zeiger alter, ungestörter Laubwaldböden – alle Teile sind schwach giftig.", wiki: "https://de.wikipedia.org/wiki/Wald-Bingelkraut" },
            { id: "19/45", type: "Waldpflanze / Geschützt", title: "Großes Zweiblatt", latin: "Neottia ovata (Orchideen)", v1: "Wächst in schattigen Laub- und Mischwäldern, oft auf feuchten, nährstoffreichen Böden.", v2: "Zwei große, gegenständige, eiförmige Blätter am Grund und eine lange Ähre unscheinbarer, grünlicher Blüten.", v3: "Eine der häufigsten heimischen Orchideenarten, dennoch leicht zu übersehen.", wiki: "https://de.wikipedia.org/wiki/Grosses_Zweiblatt" },
            { id: "20/45", type: "Streng Geschützt", title: "Vogel-Nestwurz", latin: "Neottia nidus-avis (Orchideen)", v1: "Wächst im tiefen Schatten alter Buchenwälder, oft auf dickem Falllaub.", v2: "Da sie kein Chlorophyll besitzt, ist die gesamte Pflanze honigbraun gefärbt, Blätter fehlen völlig.", v3: "Lebt von einem Pilzpartner im Boden und ernährt sich so ganz ohne eigene Photosynthese.", wiki: "https://de.wikipedia.org/wiki/Vogel-Nestwurz" },
            { id: "21/45", type: "Waldpflanze", title: "Wald-Geißbart", latin: "Aruncus dioicus (Rosengewächse)", v1: "Wächst in feuchten Schlucht- und Bergwäldern, oft an Bachläufen.", v2: "Große, doppelt gefiederte Blätter und lange, federige, cremeweiße Blütenrispen im Sommer.", v3: "Eine der imposantesten heimischen Waldstauden, wird bis zu zwei Meter hoch.", wiki: "https://de.wikipedia.org/wiki/Wald-Gei%C3%9Fbart" },
            { id: "22/45", type: "Waldpflanze", title: "Hasenlattich", latin: "Prenanthes purpurea (Korbblütler)", v1: "Wächst im tiefen Schatten von Berg- und Schluchtwäldern.", v2: "Bläulich-grüne, gestielte Blätter und kleine, nickende, violette Blütenköpfchen mit wenigen Zungenblüten.", v3: "Eine typische Zeigerpflanze für kühl-schattige, luftfeuchte Bergwälder.", wiki: "https://de.wikipedia.org/wiki/Hasenlattich" },
            { id: "23/45", type: "Waldpflanze", title: "Wald-Storchschnabel", latin: "Geranium sylvaticum (Storchschnabelgewächse)", v1: "Wächst an lichten Waldrändern und auf Bergwiesen, blüht violett von Mai bis Juli.", v2: "Tief geteilte Blätter und große, violettblaue Blüten mit hellen Aderungen.", v3: "Bevorzugt im Gegensatz zum Wiesen-Storchschnabel kühlere, schattigere Standorte.", wiki: "https://de.wikipedia.org/wiki/Wald-Storchschnabel" },
            { id: "24/45", type: "Waldpflanze / Verwildert", title: "Kleines Springkraut", latin: "Impatiens parviflora (Springkrautgewächse)", v1: "Ursprünglich aus Zentralasien eingewandert, wächst es heute massenhaft in schattigen Wäldern.", v2: "Zart gezähnte Blätter und kleine, blassgelbe Blüten mit geradem Sporn.", v3: "Die reifen Kapseln schleudern bei Berührung explosionsartig ihre Samen weg.", wiki: "https://de.wikipedia.org/wiki/Kleines_Springkraut" },
            { id: "25/45", type: "Waldpflanze / Invasiv", title: "Drüsiges Springkraut", latin: "Impatiens glandulifera (Springkrautgewächse)", v1: "Ursprünglich aus dem Himalaya stammend, wächst es an Bachufern und schattigen Waldrändern.", v2: "Große, gezähnte Blätter und auffällig große, rosa-violette Blüten in dichten Trauben.", v3: "Gilt als invasive Art, die heimische Ufervegetation stark verdrängen kann.", wiki: "https://de.wikipedia.org/wiki/Dr%C3%BCsiges_Springkraut" },
